  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"WebSite",
    "name":"PTD Today — Cosmos",
    "url":"https://ptdtoday.com/",
    "description":"Everything is connected. Ask anything. Explore everything."
  }
  </script>

  <style>
    :root{
      --bg:#02050b;
      --bg2:#07111d;
      --ink:#f5fbff;
      --muted:rgba(222,238,249,.61);
      --muted2:rgba(222,238,249,.38);
      --line:rgba(187,229,255,.15);
      --line-strong:rgba(202,236,255,.28);
      --glass:rgba(7,17,29,.46);
      --cyan:#8ed8ff;
      --blue:#4d87ff;
      --violet:#9a73ff;
      --white:#f7fdff;
    }

    *{box-sizing:border-box}

    html,body{
      width:100%;
      min-height:100%;
      margin:0;
      background:var(--bg);
      color:var(--ink);
    }

    html{
      background:
        radial-gradient(circle at 50% 44%, rgba(40,86,132,.11), transparent 31%),
        #02050b;
    }

    body{
      min-height:100dvh;
      overflow-x:hidden;
      font-family:
        Inter,
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    button,input{font:inherit}

    .cosmos-shell{
      position:relative;
      min-height:100dvh;
      isolation:isolate;
      display:grid;
      place-items:center;
      padding:
        max(22px,env(safe-area-inset-top))
        22px
        max(24px,env(safe-area-inset-bottom));
      overflow:hidden;
      background:
        radial-gradient(circle at 50% 46%, rgba(57,121,178,.115), transparent 29%),
        radial-gradient(circle at 50% 62%, rgba(77,92,255,.045), transparent 30%),
        linear-gradient(180deg,#02050a 0%,#030812 55%,#02050a 100%);
    }

    .stars,
    .stars::before,
    .stars::after{
      position:absolute;
      inset:0;
      pointer-events:none;
      content:"";
    }

    .stars{
      z-index:-5;
      opacity:.7;
      background-image:
        radial-gradient(circle at 9% 16%,rgba(255,255,255,.58) 0 1px,transparent 1.4px),
        radial-gradient(circle at 20% 71%,rgba(181,224,255,.42) 0 1px,transparent 1.3px),
        radial-gradient(circle at 35% 27%,rgba(255,255,255,.34) 0 1px,transparent 1.25px),
        radial-gradient(circle at 44% 81%,rgba(180,213,255,.34) 0 1px,transparent 1.25px),
        radial-gradient(circle at 61% 13%,rgba(255,255,255,.48) 0 1px,transparent 1.3px),
        radial-gradient(circle at 73% 77%,rgba(203,231,255,.36) 0 1px,transparent 1.25px),
        radial-gradient(circle at 87% 31%,rgba(255,255,255,.42) 0 1px,transparent 1.2px),
        radial-gradient(circle at 94% 65%,rgba(152,210,255,.34) 0 1px,transparent 1.25px);
      background-size:410px 390px,530px 510px,620px 600px,770px 720px,890px 830px,990px 940px,1170px 1090px,1310px 1210px;
    }

    .stars::before{
      opacity:.55;
      background:
        radial-gradient(circle at 50% 50%,rgba(132,198,255,.07),transparent 46%);
      filter:blur(20px);
    }

    .stars::after{
      opacity:.5;
      background:
        radial-gradient(ellipse at 50% 46%,rgba(74,125,180,.06) 0 18%,transparent 43%);
      transform:rotate(-9deg) scale(1.15);
      filter:blur(12px);
    }

    .entry{
      width:min(720px,100%);
      text-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
      transform:translateY(-1.8vh);
    }

    .orb-stage{
      position:relative;
      width:min(54vw,280px);
      aspect-ratio:1;
      display:grid;
      place-items:center;
      margin-bottom:24px;
    }

    .orb-aura,
    .orb-ring,
    .orb,
    .orb-core{
      position:absolute;
      border-radius:50%;
      pointer-events:none;
    }

    .orb-aura{
      inset:-20%;
      background:
        radial-gradient(circle,rgba(111,198,255,.12) 0 24%,rgba(95,132,255,.07) 36%,transparent 68%);
      filter:blur(24px);
      animation:auraBreathe 7.2s ease-in-out infinite;
    }

    .orb-ring{
      inset:8%;
      border:1px solid rgba(156,222,255,.13);
      box-shadow:
        0 0 26px rgba(103,201,255,.08),
        inset 0 0 18px rgba(133,199,255,.045);
      animation:ringBreathe 7.2s ease-in-out infinite;
    }

    .orb{
      inset:17%;
      overflow:hidden;
      background:
        radial-gradient(circle at 43% 37%,rgba(245,252,255,.98) 0 2%,rgba(182,232,255,.82) 7%,rgba(77,160,233,.56) 22%,rgba(38,92,162,.36) 39%,rgba(14,38,76,.82) 68%,rgba(4,9,20,.96) 100%),
        conic-gradient(from 210deg,rgba(65,157,238,.12),rgba(146,105,255,.24),rgba(46,185,224,.17),rgba(65,157,238,.12));
      border:1px solid rgba(185,231,255,.26);
      box-shadow:
        0 0 28px rgba(84,179,255,.23),
        0 0 80px rgba(69,120,255,.13),
        inset 8px 6px 28px rgba(185,236,255,.13),
        inset -16px -20px 38px rgba(0,0,0,.54);
      animation:orbBreathe 7.2s cubic-bezier(.42,0,.35,1) infinite;
    }

    .orb::before,
    .orb::after{
      content:"";
      position:absolute;
      inset:-12%;
      border-radius:50%;
    }

    .orb::before{
      background:
        repeating-radial-gradient(
          ellipse at 34% 33%,
          rgba(218,245,255,.13) 0 1px,
          transparent 2px 11px
        );
      opacity:.37;
      transform:rotate(19deg) scale(1.12);
      filter:blur(.35px);
      animation:surfaceDrift 18s linear infinite;
    }

    .orb::after{
      background:
        radial-gradient(circle at 38% 28%,rgba(255,255,255,.30),transparent 15%),
        radial-gradient(circle at 67% 63%,rgba(108,77,255,.20),transparent 22%),
        radial-gradient(circle at 44% 72%,rgba(0,208,255,.12),transparent 19%);
      mix-blend-mode:screen;
      animation:innerPulse 4.6s ease-in-out infinite;
    }

    .orb-core{
      width:12%;
      aspect-ratio:1;
      background:rgba(239,251,255,.94);
      box-shadow:
        0 0 10px rgba(255,255,255,.95),
        0 0 28px rgba(119,207,255,.88),
        0 0 66px rgba(89,131,255,.48);
      filter:blur(.15px);
      animation:coreBeat 4.6s ease-in-out infinite;
    }

    .entry.is-resolving .orb,
    .entry.is-resolving .orb-ring,
    .entry.is-resolving .orb-aura{
      animation-duration:2.15s;
    }

    .entry.is-resolving .orb-core{
      animation-duration:1.45s;
    }

    .eyebrow{
      margin:0 0 8px;
      color:rgba(201,227,244,.48);
      font-size:11px;
      font-weight:650;
      letter-spacing:.28em;
      text-transform:uppercase;
    }

    h1{
      margin:0;
      font-size:clamp(40px,7vw,68px);
      line-height:.96;
      letter-spacing:.22em;
      padding-left:.22em;
      font-weight:540;
      color:var(--white);
      text-shadow:0 0 28px rgba(132,212,255,.12);
    }

    .philosophy{
      margin:15px auto 0;
      max-width:590px;
      color:var(--muted);
      font-size:clamp(14px,2.3vw,17px);
      line-height:1.55;
      letter-spacing:.018em;
    }

    .ask-form{
      width:min(620px,100%);
      margin-top:34px;
      position:relative;
    }

    .ask-shell{
      display:grid;
      grid-template-columns:44px minmax(0,1fr) 44px;
      align-items:center;
      min-height:58px;
      padding:5px 6px;
      border:1px solid var(--line);
      border-radius:999px;
      background:
        linear-gradient(180deg,rgba(13,25,40,.68),rgba(5,13,24,.62));
      box-shadow:
        0 16px 55px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.025);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      transition:border-color .25s ease,box-shadow .25s ease,transform .25s ease;
    }

    .ask-shell:focus-within{
      border-color:var(--line-strong);
      box-shadow:
        0 18px 65px rgba(0,0,0,.32),
        0 0 0 1px rgba(139,218,255,.05),
        0 0 34px rgba(92,176,255,.07);
      transform:translateY(-1px);
    }

    .ask-input{
      width:100%;
      min-width:0;
      border:0;
      outline:0;
      color:var(--ink);
      background:transparent;
      padding:13px 5px;
      font-size:16px;
      line-height:1.25;
      text-align:left;
      caret-color:var(--cyan);
    }

    .ask-input::placeholder{color:rgba(216,235,248,.34)}

    .icon-btn{
      appearance:none;
      width:42px;
      height:42px;
      padding:0;
      border:0;
      border-radius:50%;
      display:grid;
      place-items:center;
      cursor:pointer;
      color:rgba(221,239,251,.62);
      background:transparent;
      transition:background .2s ease,color .2s ease,transform .2s ease;
    }

    .icon-btn:hover{
      color:#fff;
      background:rgba(255,255,255,.055);
    }

    .icon-btn:active{transform:scale(.94)}

    .icon-btn svg{
      width:19px;
      height:19px;
      fill:none;
      stroke:currentColor;
      stroke-width:1.7;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .submit-btn{
      color:rgba(235,248,255,.92);
      background:rgba(140,213,255,.09);
      border:1px solid rgba(180,228,255,.10);
    }

    .submit-btn:hover{
      background:rgba(140,213,255,.16);
      color:#fff;
    }

    .voice-btn.listening{
      color:#fff;
      background:rgba(113,198,255,.14);
      box-shadow:0 0 24px rgba(105,195,255,.14);
      animation:listenPulse 1.35s ease-in-out infinite;
    }

    .status{
      min-height:22px;
      margin:10px 12px 0;
      color:var(--muted2);
      font-size:12px;
      line-height:1.4;
      letter-spacing:.01em;
    }

    .status.active{color:rgba(207,235,252,.62)}

    .footer{
      position:absolute;
      left:0;
      right:0;
      bottom:max(14px,env(safe-area-inset-bottom));
      text-align:center;
      color:rgba(195,221,237,.28);
      font-size:11px;
      letter-spacing:.08em;
      pointer-events:none;
    }

    .footer strong{
      font-weight:600;
      color:rgba(213,236,248,.40);
    }

    @keyframes orbBreathe{
      0%,100%{transform:scale(.965);filter:brightness(.88) saturate(.93)}
      48%{transform:scale(1.035);filter:brightness(1.08) saturate(1.07)}
      58%{transform:scale(1.018);filter:brightness(1.02) saturate(1.03)}
    }

    @keyframes ringBreathe{
      0%,100%{transform:scale(.95);opacity:.34}
      48%{transform:scale(1.06);opacity:.74}
      58%{transform:scale(1.025);opacity:.60}
    }

    @keyframes auraBreathe{
      0%,100%{transform:scale(.91);opacity:.44}
      48%{transform:scale(1.11);opacity:.92}
      58%{transform:scale(1.05);opacity:.72}
    }

    @keyframes coreBeat{
      0%,42%,100%{transform:scale(.72);opacity:.55}
      47%{transform:scale(1.08);opacity:1}
      52%{transform:scale(.82);opacity:.70}
      57%{transform:scale(1.00);opacity:.94}
      64%{transform:scale(.76);opacity:.60}
    }

    @keyframes innerPulse{
      0%,100%{opacity:.52;transform:scale(.98) rotate(0deg)}
      50%{opacity:.88;transform:scale(1.035) rotate(8deg)}
    }

    @keyframes surfaceDrift{
      from{transform:rotate(19deg) scale(1.12)}
      to{transform:rotate(379deg) scale(1.12)}
    }

    @keyframes listenPulse{
      0%,100%{box-shadow:0 0 0 0 rgba(116,204,255,.04)}
      50%{box-shadow:0 0 0 7px rgba(116,204,255,.065)}
    }

    @media (max-width:640px){
      .entry{transform:translateY(-2.8vh)}
      .orb-stage{width:min(64vw,235px);margin-bottom:18px}
      .ask-form{margin-top:28px}
      .ask-shell{
        grid-template-columns:42px minmax(0,1fr) 42px;
        min-height:56px;
      }
      .ask-input{font-size:16px}
      .footer{font-size:10px}
    }

    @media (max-height:650px){
      .entry{transform:none}
      .orb-stage{width:min(38vh,210px);margin-bottom:12px}
      h1{font-size:40px}
      .philosophy{margin-top:10px}
      .ask-form{margin-top:20px}
      .footer{display:none}
    }

    @media (prefers-reduced-motion:reduce){
      *,
      *::before,
      *::after{
        animation-duration:.001ms !important;
        animation-iteration-count:1 !important;
        scroll-behavior:auto !important;
      }
    }
  </style>
</head>

<body>
  <main class="cosmos-shell">
    <div class="stars" aria-hidden="true"></div>

    <section class="entry" id="cosmosEntry" aria-labelledby="cosmosTitle">
      <div class="orb-stage" aria-hidden="true">
        <div class="orb-aura"></div>
        <div class="orb-ring"></div>
        <div class="orb"></div>
        <div class="orb-core"></div>
      </div>

      <p class="eyebrow">PTD Today</p>
      <h1 id="cosmosTitle">COSMOS</h1>

      <p class="philosophy">
        Everything is connected. Ask anything. Explore everything.
      </p>

      <form class="ask-form" id="askCosmosForm" autocomplete="off">
        <div class="ask-shell">
          <button
            class="icon-btn voice-btn"
            id="voiceButton"
            type="button"
            aria-label="Ask Cosmos by voice"
            title="Ask by voice"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="3" width="6" height="11" rx="3"></rect>
              <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"></path>
              <path d="M12 18v3"></path>
              <path d="M9 21h6"></path>
            </svg>
          </button>

          <input
            class="ask-input"
            id="askCosmosInput"
            name="question"
            type="text"
            inputmode="text"
            enterkeyhint="go"
            placeholder="Ask Cosmos…"
            aria-label="Ask Cosmos"
            maxlength="600"
          />

          <button
            class="icon-btn submit-btn"
            type="submit"
            aria-label="Enter Cosmos"
            title="Enter Cosmos"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14"></path>
              <path d="m14 7 5 5-5 5"></path>
            </svg>
          </button>
        </div>

        <div class="status" id="cosmosStatus" aria-live="polite"></div>
      </form>
    </section>

    <div class="footer">
      <strong>PTD Today</strong> · Cosmos
    </div>
  </main>

  <script>
    /*
      COSMOS PRODUCTION ENTRY v1

      Existing PTD Today homepage deep links are preserved by routing them to
      /intelligence.html with the same query string/hash.

      Fresh "/" and "/index.html" requests remain in the Cosmos entry.
    */

    (function preserveLegacyHomepageDeepLinks(){
      const params = new URLSearchParams(window.location.search);
      const legacyKeys = [
        "country",
        "category",
        "map",
        "outlook",
        "summary"
      ];

      const hasLegacyQuery = legacyKeys.some(key=>params.has(key));
      const hasLegacyArticleHash =
        Boolean(window.location.hash) &&
        !params.has("question") &&
        !params.has("focus");

      if(hasLegacyQuery || hasLegacyArticleHash){
        const destination =
          "/intelligence.html" +
          window.location.search +
          window.location.hash;

        window.location.replace(destination);
      }
    })();

    const form = document.getElementById("askCosmosForm");
    const input = document.getElementById("askCosmosInput");
    const entry = document.getElementById("cosmosEntry");
    const status = document.getElementById("cosmosStatus");
    const voiceButton = document.getElementById("voiceButton");

    function enterCosmos(rawQuestion){
      const question = String(rawQuestion || "").trim();
      if(!question){
        input.focus();
        status.textContent = "Ask a question to create the center.";
        status.classList.add("active");
        return;
      }

      entry.classList.add("is-resolving");
      status.textContent = "Creating your center…";
      status.classList.add("active");

      const url = new URL("/cosmos.html",window.location.origin);
      url.searchParams.set("focus","question");
      url.searchParams.set("question",question);
      url.searchParams.set("from","cosmos-entry");

      window.setTimeout(()=>{
        window.location.assign(url.toString());
      },360);
    }

    form.addEventListener("submit",event=>{
      event.preventDefault();
      enterCosmos(input.value);
    });

    input.addEventListener("input",()=>{
      if(status.textContent){
        status.textContent = "";
        status.classList.remove("active");
      }
    });

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if(!SpeechRecognition){
      voiceButton.style.opacity = ".34";
      voiceButton.title = "Voice input is not available in this browser";
      voiceButton.setAttribute("aria-disabled","true");
    }else{
      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = true;
      recognition.continuous = false;

      recognition.onstart = ()=>{
        voiceButton.classList.add("listening");
        status.textContent = "Listening…";
        status.classList.add("active");
      };

      recognition.onresult = event=>{
        let transcript = "";

        for(let i=event.resultIndex;i<event.results.length;i++){
          transcript += event.results[i][0].transcript;
        }

        if(transcript.trim()){
          input.value = transcript.trim();
        }

        const last = event.results[event.results.length - 1];
        if(last && last.isFinal){
          status.textContent = "Voice captured.";
        }
      };

      recognition.onerror = event=>{
        voiceButton.classList.remove("listening");
        status.textContent =
          event.error === "not-allowed"
            ? "Microphone permission was not granted."
            : "Voice input could not start.";
        status.classList.add("active");
      };

      recognition.onend = ()=>{
        voiceButton.classList.remove("listening");

        if(input.value.trim()){
          status.textContent = "Press the arrow to enter Cosmos.";
          status.classList.add("active");
        }else{
          status.textContent = "";
          status.classList.remove("active");
        }
      };

      voiceButton.addEventListener("click",()=>{
        try{
          recognition.start();
        }catch(error){
          /* Recognition may already be active. */
        }
      });
    }

    window.setTimeout(()=>{
      if(document.activeElement === document.body && window.innerWidth > 760){
        input.focus({preventScroll:true});
      }
    },700);
  </script>
</body>

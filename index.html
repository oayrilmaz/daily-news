<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="utf-8" />

  <meta name="twitter:title" content="Cosmos | PTD Today" />
  <meta name="twitter:description" content="Everything is connected. Ask anything. Explore everything." />
  <meta name="twitter:image" content="https://ptdtoday.com/assets/og-default.png" />

  <style>
    :root{
      --bg0:#01040b;
      --bg1:#030816;
      --bg2:#061326;
      --text:#f5f9ff;
      --muted:rgba(221,233,247,.63);
      --faint:rgba(206,224,244,.32);
      --line:rgba(187,218,255,.17);
      --line2:rgba(192,225,255,.31);
      --cyan:#9fe9ff;
      --blue:#5598ff;
      --violet:#9c78ff;
    }

    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;background:var(--bg0)}
    body{
      min-height:100dvh;
      overflow:hidden;
      color:var(--text);
      font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    .cosmos{
      position:relative;
      width:100%;
      min-height:100dvh;
      display:grid;
      place-items:center;
      overflow:hidden;
      isolation:isolate;
      background:
        radial-gradient(circle at 50% 42%,rgba(44,92,145,.12) 0,rgba(18,44,80,.055) 27%,transparent 56%),
        radial-gradient(circle at 50% 100%,rgba(56,74,162,.05),transparent 45%),
        linear-gradient(180deg,#01040b 0%,#030814 46%,#020611 100%);
    }

    /* very quiet "infinite" field, not a decorative star wallpaper */
    .space,
    .space::before,
    .space::after{
      position:absolute;
      inset:-10%;
      content:"";
      pointer-events:none;
      z-index:-4;
    }

    .space{
      opacity:.58;
      background-image:
        radial-gradient(circle at 8% 21%,rgba(255,255,255,.55) 0 .7px,transparent .95px),
        radial-gradient(circle at 17% 72%,rgba(178,218,255,.42) 0 .65px,transparent .95px),
        radial-gradient(circle at 26% 35%,rgba(255,255,255,.34) 0 .55px,transparent .85px),
        radial-gradient(circle at 39% 12%,rgba(202,229,255,.35) 0 .65px,transparent .9px),
        radial-gradient(circle at 48% 78%,rgba(255,255,255,.30) 0 .55px,transparent .85px),
        radial-gradient(circle at 61% 27%,rgba(177,219,255,.45) 0 .65px,transparent .95px),
        radial-gradient(circle at 72% 69%,rgba(255,255,255,.34) 0 .58px,transparent .9px),
        radial-gradient(circle at 83% 17%,rgba(191,220,255,.43) 0 .65px,transparent .95px),
        radial-gradient(circle at 93% 57%,rgba(255,255,255,.31) 0 .6px,transparent .9px);
      background-size:380px 370px,460px 440px,570px 540px,680px 650px,790px 750px,920px 870px,1040px 970px,1170px 1080px,1320px 1210px;
    }

    .space::before{
      opacity:.30;
      background:
        radial-gradient(ellipse at 50% 42%,rgba(91,154,225,.13) 0%,transparent 42%);
      filter:blur(38px);
    }

    .space::after{
      opacity:.18;
      background:
        conic-gradient(from 220deg at 50% 46%,transparent,rgba(94,86,190,.16),transparent 24%,rgba(50,155,206,.13),transparent 58%);
      filter:blur(75px);
      animation:nebulaDrift 42s linear infinite;
    }

    .center{
      width:min(680px,calc(100vw - 40px));
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      transform:translateY(-2.8vh);
    }

    /* The object itself: a living, almost-black Cosmos with luminous atmosphere. */
    .life{
      position:relative;
      width:clamp(180px,25vw,250px);
      aspect-ratio:1;
      margin:0 0 28px;
      display:grid;
      place-items:center;
      filter:drop-shadow(0 0 22px rgba(77,157,255,.15));
      animation:wholeBreath 6.4s cubic-bezier(.45,0,.25,1) infinite;
      will-change:transform,filter;
    }

    .halo{
      position:absolute;
      inset:-27%;
      border-radius:50%;
      background:
        radial-gradient(circle,rgba(111,203,255,.14) 0 22%,rgba(76,128,255,.075) 38%,rgba(122,91,255,.035) 52%,transparent 72%);
      filter:blur(25px);
      animation:haloBreath 6.4s cubic-bezier(.45,0,.25,1) infinite;
    }

    .pulse-wave{
      position:absolute;
      inset:3%;
      border-radius:50%;
      border:1px solid rgba(150,219,255,.18);
      opacity:0;
      animation:pulseWave 3.2s ease-out infinite;
    }

    .pulse-wave.two{
      animation-delay:.22s;
      border-color:rgba(160,128,255,.13);
    }

    .sphere{
      position:absolute;
      inset:13%;
      border-radius:50%;
      overflow:hidden;
      background:
        radial-gradient(circle at 35% 30%,rgba(228,248,255,.90) 0 1.2%,rgba(158,223,255,.44) 6%,rgba(55,139,216,.20) 17%,transparent 31%),
        radial-gradient(circle at 63% 67%,rgba(118,86,255,.20),transparent 31%),
        radial-gradient(circle at 50% 48%,rgba(10,30,62,.98) 0 51%,rgba(2,8,20,1) 78%);
      border:1px solid rgba(182,226,255,.24);
      box-shadow:
        inset 0 0 25px rgba(102,188,255,.13),
        inset -18px -20px 46px rgba(0,0,0,.72),
        0 0 0 1px rgba(67,126,199,.07),
        0 0 26px rgba(87,174,255,.18),
        0 0 62px rgba(78,114,255,.10);
    }

    .sphere::before{
      content:"";
      position:absolute;
      inset:-17%;
      border-radius:50%;
      background:
        conic-gradient(from 36deg,
          transparent 0 13%,
          rgba(129,219,255,.23) 17%,
          transparent 24% 42%,
          rgba(139,102,255,.17) 47%,
          transparent 54% 72%,
          rgba(88,190,235,.18) 76%,
          transparent 83%);
      filter:blur(5px);
      opacity:.58;
      animation:surfaceTurn 19s linear infinite;
    }

    .sphere::after{
      content:"";
      position:absolute;
      inset:5%;
      border-radius:50%;
      background:
        repeating-radial-gradient(ellipse at 42% 43%,rgba(197,236,255,.065) 0 1px,transparent 2px 8px);
      opacity:.45;
      transform:rotate(-22deg);
      animation:surfaceFlow 13s ease-in-out infinite alternate;
    }

    .rim{
      position:absolute;
      inset:13%;
      border-radius:50%;
      background:transparent;
      box-shadow:
        inset 6px 4px 11px rgba(188,235,255,.23),
        inset -4px -4px 14px rgba(83,100,255,.10);
      animation:rimPulse 3.2s ease-in-out infinite;
    }

    .heart{
      position:absolute;
      width:4.2%;
      aspect-ratio:1;
      border-radius:50%;
      background:#f2fbff;
      box-shadow:
        0 0 6px rgba(255,255,255,.98),
        0 0 18px rgba(144,224,255,.95),
        0 0 42px rgba(88,151,255,.70),
        0 0 78px rgba(133,89,255,.31);
      animation:heartBeat 3.2s cubic-bezier(.42,0,.2,1) infinite;
    }

    .name{
      margin:0;
      font-size:clamp(42px,7vw,66px);
      line-height:1;
      font-weight:360;
      letter-spacing:.21em;
      padding-left:.21em;
      color:rgba(247,252,255,.97);
      text-shadow:0 0 24px rgba(140,213,255,.12);
    }

    .tagline{
      margin:15px 0 0;
      color:rgba(216,232,246,.53);
      font-size:clamp(13px,2vw,15px);
      line-height:1.5;
      letter-spacing:.025em;
    }

    .ask{
      width:min(610px,100%);
      margin-top:35px;
    }

    .askbar{
      min-height:58px;
      display:grid;
      grid-template-columns:48px minmax(0,1fr) 48px;
      align-items:center;
      padding:4px 5px;
      border:1px solid rgba(187,218,255,.15);
      border-radius:999px;
      background:rgba(7,16,29,.48);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.018),
        0 13px 50px rgba(0,0,0,.25);
      -webkit-backdrop-filter:blur(18px);
      backdrop-filter:blur(18px);
      transition:.25s ease;
    }

    .askbar:focus-within{
      border-color:rgba(177,225,255,.30);
      background:rgba(8,18,32,.60);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.025),
        0 16px 56px rgba(0,0,0,.29),
        0 0 34px rgba(89,168,255,.065);
    }

    .ask input{
      width:100%;
      border:0;
      outline:0;
      background:transparent;
      color:#f4faff;
      padding:13px 2px;
      font-size:16px;
      caret-color:#9fe9ff;
    }

    .ask input::placeholder{color:rgba(213,232,247,.34)}

    .round{
      width:42px;height:42px;
      border-radius:50%;
      display:grid;
      place-items:center;
      padding:0;
      appearance:none;
      border:0;
      background:transparent;
      color:rgba(221,239,252,.52);
      cursor:pointer;
      transition:background .2s ease,color .2s ease,transform .15s ease;
    }

    .round:hover{background:rgba(255,255,255,.055);color:#fff}
    .round:active{transform:scale(.93)}

    .round.go{
      color:rgba(239,249,255,.88);
      background:rgba(133,207,255,.08);
      border:1px solid rgba(173,222,255,.08);
    }

    .round.go:hover{background:rgba(133,207,255,.14)}

    .round svg{
      width:18px;height:18px;
      stroke:currentColor;fill:none;
      stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;
    }

    .round.listening{
      color:#fff;
      background:rgba(113,203,255,.13);
      animation:listening 1.2s ease-in-out infinite;
    }

    .status{
      height:22px;
      margin-top:10px;
      color:rgba(203,224,241,.36);
      font-size:11.5px;
      line-height:1.4;
    }

    .bottom{
      position:absolute;
      left:0;right:0;
      bottom:max(15px,env(safe-area-inset-bottom));
      color:rgba(199,219,235,.24);
      text-align:center;
      font-size:10px;
      letter-spacing:.11em;
      text-transform:uppercase;
      pointer-events:none;
    }

    /* ------------------------ LIFE ------------------------ */

    /* Breath = the entire Cosmos inhales and exhales slowly. */
    @keyframes wholeBreath{
      0%,100%{transform:scale(.955);filter:drop-shadow(0 0 18px rgba(73,155,255,.11))}
      46%{transform:scale(1.035);filter:drop-shadow(0 0 31px rgba(92,181,255,.21))}
      58%{transform:scale(1.022);filter:drop-shadow(0 0 27px rgba(86,170,255,.17))}
    }

    @keyframes haloBreath{
      0%,100%{transform:scale(.90);opacity:.43}
      46%{transform:scale(1.12);opacity:.92}
      58%{transform:scale(1.06);opacity:.72}
    }

    /* Pulse = a separate heartbeat: lub-dub, then quiet. */
    @keyframes heartBeat{
      0%,10%,100%{transform:scale(.72);opacity:.56}
      13%{transform:scale(1.38);opacity:1}
      17%{transform:scale(.82);opacity:.68}
      22%{transform:scale(1.18);opacity:.98}
      29%{transform:scale(.76);opacity:.58}
    }

    @keyframes rimPulse{
      0%,10%,100%{opacity:.38;filter:brightness(.8)}
      13%{opacity:.95;filter:brightness(1.32)}
      17%{opacity:.54;filter:brightness(.94)}
      22%{opacity:.83;filter:brightness(1.18)}
      29%{opacity:.42;filter:brightness(.86)}
    }

    @keyframes pulseWave{
      0%,11%{transform:scale(.80);opacity:0}
      13%{opacity:.34}
      36%{transform:scale(1.24);opacity:0}
      100%{transform:scale(1.24);opacity:0}
    }

    @keyframes surfaceTurn{
      from{transform:rotate(0deg) scale(1)}
      to{transform:rotate(360deg) scale(1)}
    }

    @keyframes surfaceFlow{
      from{transform:rotate(-22deg) scale(.97);opacity:.30}
      to{transform:rotate(-10deg) scale(1.05);opacity:.53}
    }

    @keyframes nebulaDrift{
      from{transform:rotate(0deg) scale(1)}
      to{transform:rotate(360deg) scale(1.08)}
    }

    @keyframes listening{
      0%,100%{box-shadow:0 0 0 0 rgba(133,214,255,0)}
      50%{box-shadow:0 0 0 7px rgba(133,214,255,.07)}
    }

    /* Awake/resolving: Cosmos is no longer dormant. */
    .center.awake .life{animation-duration:2.25s}
    .center.awake .halo{animation-duration:2.25s}
    .center.awake .heart,
    .center.awake .rim,
    .center.awake .pulse-wave{animation-duration:1.25s}

    @media(max-width:640px){
      .center{width:min(100% - 30px,680px);transform:translateY(-3vh)}
      .life{width:clamp(168px,51vw,215px);margin-bottom:23px}
      .name{font-size:44px}
      .tagline{font-size:13px;max-width:340px}
      .ask{margin-top:29px}
      .askbar{min-height:56px;grid-template-columns:45px minmax(0,1fr) 45px}
    }

    @media(max-height:660px){
      .center{transform:none}
      .life{width:min(31vh,185px);margin-bottom:16px}
      .name{font-size:38px}
      .tagline{margin-top:10px}
      .ask{margin-top:20px}
      .bottom{display:none}
    }

    @media(prefers-reduced-motion:reduce){
      .life,.halo,.heart,.rim,.pulse-wave,.space::after,.sphere::before,.sphere::after{
        animation:none !important;
      }
    }
  </style>
</head>

<body>
  <main class="cosmos">
    <div class="space" aria-hidden="true"></div>

    <section class="center" id="center">
      <div class="life" aria-hidden="true">
        <div class="halo"></div>
        <div class="pulse-wave"></div>
        <div class="pulse-wave two"></div>
        <div class="sphere"></div>
        <div class="rim"></div>
        <div class="heart"></div>
      </div>

      <h1 class="name">COSMOS</h1>
      <p class="tagline">Everything is connected. Ask anything. Explore everything.</p>

      <form class="ask" id="askForm" autocomplete="off">
        <div class="askbar">
          <button class="round" id="voiceBtn" type="button" aria-label="Ask by voice">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="3" width="6" height="11" rx="3"></rect>
              <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"></path>
              <path d="M12 18v3"></path>
              <path d="M9 21h6"></path>
            </svg>
          </button>

          <input
            id="question"
            type="text"
            placeholder="Ask Cosmos..."
            aria-label="Ask Cosmos"
            maxlength="600"
            enterkeyhint="go"
          />

          <button class="round go" type="submit" aria-label="Enter Cosmos">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14"></path>
              <path d="m14 7 5 5-5 5"></path>
            </svg>
          </button>
        </div>
        <div class="status" id="status" aria-live="polite"></div>
      </form>
    </section>

    <div class="bottom">PTD Today · Cosmos</div>
  </main>

  <script>
    /*
      Existing legacy homepage deep links remain valid.
      Fresh / and /index.html are the Cosmos entry.
    */
    (function(){
      const p=new URLSearchParams(location.search);
      const legacy=["country","category","map","outlook","summary"];
      const legacyQuery=legacy.some(k=>p.has(k));
      const legacyHash=Boolean(location.hash)&&!p.has("question")&&!p.has("focus");

      if(legacyQuery||legacyHash){
        location.replace("/intelligence.html"+location.search+location.hash);
      }
    })();

    const center=document.getElementById("center");
    const form=document.getElementById("askForm");
    const input=document.getElementById("question");
    const status=document.getElementById("status");
    const voiceBtn=document.getElementById("voiceBtn");

    function go(question){
      question=String(question||"").trim();

      if(!question){
        status.textContent="Ask a question to create the center.";
        input.focus();
        return;
      }

      center.classList.add("awake");
      status.textContent="Creating your center...";

      const url=new URL("/cosmos.html",location.origin);
      url.searchParams.set("focus","question");
      url.searchParams.set("question",question);
      url.searchParams.set("from","cosmos-entry");

      setTimeout(()=>location.assign(url.toString()),420);
    }

    form.addEventListener("submit",e=>{
      e.preventDefault();
      go(input.value);
    });

    input.addEventListener("input",()=>{
      if(status.textContent)status.textContent="";
    });

    const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;

    if(!Recognition){
      voiceBtn.style.opacity=".28";
      voiceBtn.title="Voice input is unavailable in this browser";
      voiceBtn.setAttribute("aria-disabled","true");
    }else{
      const rec=new Recognition();
      rec.lang="en-US";
      rec.interimResults=true;
      rec.continuous=false;

      rec.onstart=()=>{
        voiceBtn.classList.add("listening");
        status.textContent="Listening...";
      };

      rec.onresult=e=>{
        let text="";
        for(let i=e.resultIndex;i<e.results.length;i++){
          text+=e.results[i][0].transcript;
        }
        if(text.trim())input.value=text.trim();
      };

      rec.onerror=e=>{
        voiceBtn.classList.remove("listening");
        status.textContent=e.error==="not-allowed"
          ?"Microphone permission was not granted."
          :"Voice input could not start.";
      };

      rec.onend=()=>{
        voiceBtn.classList.remove("listening");
        status.textContent=input.value.trim()?"Press the arrow to enter Cosmos.":"";
      };

      voiceBtn.addEventListener("click",()=>{
        try{rec.start()}catch(e){}
      });
    }
  </script>
</body>
</html>

      font-weight:760!important;
      letter-spacing:.10em!important
    }
    .topicMemory.historyExpanded .topicMemoryActions{gap:10px!important}
    .topicMemory.historyExpanded .topicHistoryToggle{
      padding:7px 11px!important;
      border:1px solid rgba(39,67,108,.10)!important;
      border-radius:999px!important;
      background:#f7f9fd!important;
      color:#4f6383!important
    }
    .topicMemory.historyExpanded .topicYears{
      position:fixed!important;
      z-index:54!important;
      top:calc(84px + env(safe-area-inset-top))!important;
      right:18px!important;
      left:auto!important;
      bottom:18px!important;
      transform:none!important;
      width:min(500px,calc(100vw - 36px))!important;
      padding:12px 12px 18px!important;
      display:grid!important;
      align-content:start!important;
      gap:10px!important;
      overflow-y:auto!important;
      overscroll-behavior:contain;
      border:1px solid rgba(39,67,108,.10)!important;
      border-top:0!important;
      border-radius:0 0 24px 24px!important;
      background:#ffffff!important;
      backdrop-filter:none!important;
      -webkit-backdrop-filter:none!important;
      box-shadow:0 26px 80px rgba(31,56,91,.15)!important
    }
    .topicPeriod,.topicYear,.topicMonth{
      border-color:rgba(54,82,124,.10)!important;
      background:#fbfcff!important;
      box-shadow:none!important
    }
    .topicPeriodTitle,.topicYear>summary,.topicMonth>summary{
      min-height:44px;
      color:#32445f!important;
      font-weight:650
    }
    .topicItem{
      min-height:58px;
      padding:11px 13px!important;
      background:#fff!important;
      border-bottom-color:rgba(39,67,108,.065)!important
    }
    .topicItem:hover,.topicItem:focus-visible{background:#f6f9ff!important}
    .topicQuestion{color:#26364f!important;font-weight:650}
    .topicMeta{color:#7d899b!important}
    .topicResume{color:#5875a7!important;font-weight:700}

    @media(max-width:640px){
      .topicMemory.historyExpanded .topicMemoryHeader{
        top:calc(10px + env(safe-area-inset-top))!important;
        right:10px!important;
        width:calc(100vw - 20px)!important
      }
      .topicMemory.historyExpanded .topicYears{
        top:calc(72px + env(safe-area-inset-top))!important;
        right:10px!important;
        bottom:calc(10px + env(safe-area-inset-bottom))!important;
        width:calc(100vw - 20px)!important
      }
    }

  </style>
  <script>
    (() => {
      const incoming = new URLSearchParams(location.search);
      const legacyKeys = ["country","category","map","outlook","summary"];
      const hasLegacyQuery = legacyKeys.some(key => incoming.has(key));
      const hasLegacyHash = Boolean(location.hash);

      if (hasLegacyQuery || hasLegacyHash) {
        location.replace("/intelligence.html" + location.search + location.hash);
      }
    })();
  </script>
</head>
<body>
  <div class="shell">
    <div class="stars"></div>
    <div class="topline"><div class="domain">ptdtoday.com</div></div>

    <main class="stage">
      <section class="orbWrap" id="orbWrap" data-state="dormant" aria-label="Cosmos">
        <div class="orbHalo"></div>
        <div class="orbit"></div>
        <div class="orb">
          <div>
            <h1>Cosmos</h1>
            <p>Everything is connected.<br>Ask anything. Explore everything.</p>
          </div>
        </div>
      </section>

      <form class="ask" id="askForm">
        <div class="askRow">
          <input id="askInput" autocomplete="off" placeholder="Ask Cosmos…" aria-label="Ask Cosmos" />
          <button type="button" id="voiceButton" aria-label="Voice input" title="Voice input">◉</button>
          <button class="primary" type="submit" aria-label="Ask">↑</button>
        </div>
      </form>

      <div class="hint" id="hint">Type a question or a subject. Cosmos will build the experience around you.</div>
      <section class="topicMemory" id="topicMemory" aria-label="Your Cosmos journeys">
        <div class="topicMemoryHeader"><span>Your Cosmos</span><span class="topicMemoryActions"><span class="topicMemoryCount" id="topicMemoryCount"></span><button class="topicHistoryToggle" id="topicHistoryToggle" type="button" aria-expanded="false">History ›</button></span></div>
        <div class="topicYears" id="topicYears" hidden></div>
      </section>
      <div class="historyBackdrop" id="historyBackdrop" hidden aria-hidden="true"></div>

      <section class="emergence" id="emergence" aria-live="polite">
        <div class="emergenceCard">
          <div class="eyebrow">Cosmos is resolving your intent</div>
          <strong id="resolvedLabel">Cosmos</strong>
          <p id="resolvedText">Preparing the relevant observer and intelligence view…</p>
        </div>
      </section>

      <!-- Existing PTD Today surfaces are deliberately preserved elsewhere.
           Nothing below is permanent navigation on the Cosmos entry. -->
      <nav class="hiddenLegacy" aria-hidden="true">
        <a href="/legacy-home.html">Daily Intelligence</a>
        <a href="/media.html">Media</a>
        <a href="/groups.html">Groups</a>
      </nav>
    </main>
  </div>

  <script>
    (() => {
      "use strict";

      const form = document.getElementById("askForm");
      const orbWrap = document.getElementById("orbWrap");
      const input = document.getElementById("askInput");
      const voiceButton = document.getElementById("voiceButton");
      const emergence = document.getElementById("emergence");
      const resolvedLabel = document.getElementById("resolvedLabel");
      const resolvedText = document.getElementById("resolvedText");
      const hint = document.getElementById("hint");
      const topicMemory=document.getElementById("topicMemory");
      const topicYears=document.getElementById("topicYears");
      const topicMemoryCount=document.getElementById("topicMemoryCount");
      const topicHistoryToggle=document.getElementById("topicHistoryToggle");
      const historyBackdrop=document.getElementById("historyBackdrop");
      const TOPIC_MEMORY_KEY="ptdtoday_cosmos_topic_archive_v0_1";
      const INDEX_BUILD="v5.1-calm-living-cosmos-history";

      function recoverLastTopicFromSession(){
        try{
          const existing=JSON.parse(localStorage.getItem(TOPIC_MEMORY_KEY)||"[]");
          if(Array.isArray(existing) && existing.length) return;
          const trail=JSON.parse(sessionStorage.getItem("ptdtoday_cosmos_observer_trail_v0_1")||"null");
          const journeyState=JSON.parse(sessionStorage.getItem("ptdtoday_cosmos_journey_tree_v0_8")||"null");
          const snap=trail?.currentObserver || trail?.entryObserver;
          const question=String(snap?.question||"").trim();
          if(!question) return;
          const now=Date.now();
          const topicId=`recovered-${now.toString(36)}`;
          localStorage.setItem(TOPIC_MEMORY_KEY,JSON.stringify([{
            topic_id:topicId,question,created_at:now,updated_at:now,
            year:new Date(now).getFullYear(),month:new Date(now).getMonth()+1,
            current_node_id:String(journeyState?.current_node_id||""),
            journey:Array.isArray(journeyState?.nodes)?journeyState.nodes:[],
            station_count:Array.isArray(journeyState?.nodes)?journeyState.nodes.length:0,
            current_label:String(snap?.label||snap?.question||question),last_opened_at:now,
            entry_observer:trail?.entryObserver||null,current_observer:snap
          }]));
        }catch(_){}
      }
      function readTopicMemory(){
        recoverLastTopicFromSession();
        try{const p=JSON.parse(localStorage.getItem(TOPIC_MEMORY_KEY)||"[]");return Array.isArray(p)?p:(Array.isArray(p?.topics)?p.topics:[])}catch(_){return[]}
      }
      function topicTimestamp(x){const r=x?.created_at||x?.timestamp||x?.saved_at||x?.updated_at||x?.last_opened_at,n=Number(r);if(Number.isFinite(n)&&n>0)return n;const d=Date.parse(String(r||""));return Number.isFinite(d)?d:0}
      function topicQuestion(x){return String(x?.question||x?.title||x?.label||x?.observer?.question||"").trim()}
      function topicId(x){return String(x?.topic_id||x?.id||x?.journey_id||"").trim()}
      function topicStationCount(x){return Number.isFinite(Number(x?.station_count))?Number(x.station_count):(Array.isArray(x?.journey)?x.journey.length:0)}
      function topicCurrentLabel(x){return String(x?.current_label||x?.current_observer?.label||x?.current_observer?.question||topicQuestion(x)).trim()}
      function topicResumeUrl(x){const e=String(x?.resume_url||x?.url||"").trim();if(e)return e;const p=new URLSearchParams({focus:"question",view:"cosmos_projection",question:topicQuestion(x),resume:"1"}),id=topicId(x);if(id)p.set("topic",id);return `/cosmos.html?${p}`}
      function monthName(i){return new Intl.DateTimeFormat(undefined,{month:"long"}).format(new Date(2026,i,1))}
      function startOfDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x}
      function startOfWeek(d){const x=startOfDay(d),day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x}
      function sameMonth(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()}
      function appendTopicButton(box,x){
        const b=document.createElement("button");b.type="button";b.className="topicItem";b.dataset.resumeUrl=topicResumeUrl(x);
        const q=document.createElement("span");q.className="topicQuestion";q.textContent=topicQuestion(x);
        const meta=document.createElement("span");meta.className="topicMeta";
        const count=topicStationCount(x),current=topicCurrentLabel(x);
        meta.textContent=count>1?`${count} stations · Continue from ${current}`:`Continue from ${current}`;
        const r=document.createElement("span");r.className="topicResume";r.textContent="Resume ›";
        b.append(q,meta,r);b.onclick=()=>location.href=b.dataset.resumeUrl;box.appendChild(b)
      }
      function appendFlatPeriod(label,list){
        if(!list.length)return;
        const section=document.createElement("section");section.className="topicPeriod";
        const head=document.createElement("div");head.className="topicPeriodTitle";head.innerHTML=`<span>${label}</span><span class="topicSummaryCount">${list.length}</span>`;
        const box=document.createElement("div");box.className="topicList";list.forEach(x=>appendTopicButton(box,x));section.append(head,box);topicYears.appendChild(section)
      }
      function appendWeekDetails(parent,label,list,open=false){
        if(!list.length)return;
        const wd=document.createElement("details");wd.className="topicMonth";wd.open=open;
        const ws=document.createElement("summary");ws.innerHTML=`<span class="topicSummaryLeft"><span class="topicChevron">›</span><span>${label}</span></span><span class="topicSummaryCount">${list.length}</span>`;wd.appendChild(ws);
        const box=document.createElement("div");box.className="topicList";list.forEach(x=>appendTopicButton(box,x));wd.appendChild(box);parent.appendChild(wd)
      }
      function renderTopicMemory(){
        if(!topicMemory||!topicYears)return;
        const topics=readTopicMemory().filter(x=>topicQuestion(x)).sort((a,b)=>topicTimestamp(b)-topicTimestamp(a));
        topicYears.textContent="";
        if(!topics.length){topicMemory.classList.remove("active");return}
        topicMemoryCount.textContent=`${topics.length} saved ${topics.length===1?"journey":"journeys"}`;topicMemory.classList.add("active");
        if(!topicMemory.classList.contains("historyExpanded"))return;

        const now=new Date(),today=startOfDay(now),weekStart=startOfWeek(now);
        const todayList=[],thisWeek=[],currentMonthOlder=[],older=[];
        topics.forEach(x=>{const d=new Date(topicTimestamp(x)||Date.now()),day=startOfDay(d);if(day>=today)todayList.push(x);else if(day>=weekStart)thisWeek.push(x);else if(sameMonth(d,now))currentMonthOlder.push(x);else older.push(x)});
        appendFlatPeriod("Today",todayList);
        appendFlatPeriod("This week",thisWeek);

        if(currentMonthOlder.length){
          const md=document.createElement("details");md.className="topicYear";
          const ms=document.createElement("summary");ms.innerHTML=`<span class="topicSummaryLeft"><span class="topicChevron">›</span><span>${monthName(now.getMonth())}</span></span><span class="topicSummaryCount">${currentMonthOlder.length}</span>`;md.appendChild(ms);
          const weeks=new Map();currentMonthOlder.forEach(x=>{const d=new Date(topicTimestamp(x)),w=startOfWeek(d),k=w.getTime();if(!weeks.has(k))weeks.set(k,[]);weeks.get(k).push(x)});
          [...weeks.entries()].sort((a,b)=>b[0]-a[0]).forEach(([stamp,list])=>{const w=new Date(Number(stamp)),e=new Date(w);e.setDate(e.getDate()+6);appendWeekDetails(md,`Week of ${monthName(w.getMonth()).slice(0,3)} ${w.getDate()}–${e.getDate()}`,list)});topicYears.appendChild(md)
        }

        const years=new Map();older.forEach(x=>{const d=new Date(topicTimestamp(x)),y=d.getFullYear(),m=d.getMonth();if(!years.has(y))years.set(y,new Map());if(!years.get(y).has(m))years.get(y).set(m,[]);years.get(y).get(m).push(x)});
        [...years.entries()].sort((a,b)=>b[0]-a[0]).forEach(([y,months])=>{
          const yd=document.createElement("details");yd.className="topicYear";
          const total=[...months.values()].reduce((n,a)=>n+a.length,0),ys=document.createElement("summary");ys.innerHTML=`<span class="topicSummaryLeft"><span class="topicChevron">›</span><span>${y}</span></span><span class="topicSummaryCount">${total} ${total===1?"journey":"journeys"}</span>`;yd.appendChild(ys);
          [...months.entries()].sort((a,b)=>b[0]-a[0]).forEach(([m,list])=>{const md=document.createElement("details");md.className="topicMonth";const ms=document.createElement("summary");ms.innerHTML=`<span class="topicSummaryLeft"><span class="topicChevron">›</span><span>${monthName(m)}</span></span><span class="topicSummaryCount">${list.length}</span>`;md.appendChild(ms);const weeks=new Map();list.forEach(x=>{const w=startOfWeek(new Date(topicTimestamp(x))),k=w.getTime();if(!weeks.has(k))weeks.set(k,[]);weeks.get(k).push(x)});[...weeks.entries()].sort((a,b)=>b[0]-a[0]).forEach(([stamp,wl])=>{const w=new Date(Number(stamp)),e=new Date(w);e.setDate(e.getDate()+6);appendWeekDetails(md,`Week of ${monthName(w.getMonth()).slice(0,3)} ${w.getDate()}–${e.getDate()}`,wl)});yd.appendChild(md)});topicYears.appendChild(yd)
        });
      }
      function setHistoryExpanded(expanded){
        if(!topicMemory||!topicHistoryToggle)return;
        const open=Boolean(expanded);
        topicMemory.classList.toggle("historyExpanded",open);
        topicYears.hidden=!open;
        topicYears.style.display=open?"grid":"none";
        if(historyBackdrop){
          historyBackdrop.hidden=!open;
          historyBackdrop.setAttribute("aria-hidden",open?"false":"true");
        }
        document.body.classList.toggle("historyExpanded",open);
        topicHistoryToggle.setAttribute("aria-expanded",open?"true":"false");
        topicHistoryToggle.textContent=open?"Close ×":"History ›";
        renderTopicMemory();
      }
      topicHistoryToggle?.addEventListener("click",()=>{
        const expanded=!topicMemory.classList.contains("historyExpanded");
        setHistoryExpanded(expanded);
      });
      historyBackdrop?.addEventListener("click",()=>setHistoryExpanded(false));
      document.addEventListener("keydown",event=>{
        if(event.key==="Escape" && topicMemory?.classList.contains("historyExpanded")){
          setHistoryExpanded(false);
        }
      });
      window.addEventListener("pageshow",renderTopicMemory);
      window.addEventListener("storage",e=>{if(e.key===TOPIC_MEMORY_KEY)renderTopicMemory()});
      renderTopicMemory();

      function resolveView(question) {
        const q = String(question || "").trim();
        const lower = q.toLowerCase();

        if (!q) return { view: "cosmos_entry", label: "Cosmos" };
        if (/\b(video|videos|media|watch|youtube)\b/i.test(q)) {
          return { view: "media", label: "Media" };
        }
        if (/\b(map|country|countries|geograph\w*|region|where|united states|u\.?s\.?|usa)\b/i.test(q)) {
          return { view: "global_intelligence_map", label: "Global Intelligence" };
        }
        if (/\b(group|groups|community|communities|linkedin)\b/i.test(q)) {
          return { view: "communities", label: "Professional Communities" };
        }
        if (/\b(market|markets|stock|stocks|outlook|investment|price|prices)\b/i.test(q)) {
          return { view: "market_pulse", label: "Market Pulse & Outlook" };
        }
        if (/\b(today'?s?|daily|latest|new|changed|happened)\b.*\b(intelligence|brief|briefing|signals?|news|developments?)\b/i.test(q) ||
            /\bwhat changed\b/i.test(q) || /\bwhat happened\b/i.test(q)) {
          return { view: "daily_intelligence", label: "Daily Intelligence" };
        }

        return { view: "cosmos_projection", label: q };
      }

      function cosmosUrl(question, resolved) {
        const params = new URLSearchParams({
          focus: "question",
          view: resolved.view,
          question
        });
        return `/cosmos.html?${params.toString()}`;
      }

      input.addEventListener("focus", () => {
        if (orbWrap.dataset.state !== "resolving") orbWrap.dataset.state = "engaged";
      });
      input.addEventListener("input", () => {
        if (orbWrap.dataset.state !== "resolving") orbWrap.dataset.state = input.value.trim() ? "engaged" : "dormant";
      });
      input.addEventListener("blur", () => {
        if (!input.value.trim() && orbWrap.dataset.state !== "resolving") orbWrap.dataset.state = "dormant";
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const question = input.value.trim();
        if (!question) {
          input.focus();
          return;
        }

        const resolved = resolveView(question);
        orbWrap.dataset.state = "resolving";
        emergence.classList.remove("active");
        hint.textContent = "Entering Cosmos…";

        window.setTimeout(() => {
          const url=new URL(cosmosUrl(question,resolved),location.origin);
          url.searchParams.set("new_topic","1");
          url.searchParams.set("topic",`topic-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`);
          location.href=url.pathname+url.search;
        }, 120);
      });

      voiceButton.addEventListener("click", () => {
        if (!("webkitSpeechRecognition" in window || "SpeechRecognition" in window)) {
          hint.textContent = "Voice input is not available in this browser yet. Type your question instead.";
          input.focus();
          return;
        }

        const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new Recognition();
        recognition.lang = navigator.language || "en-US";
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        hint.textContent = "Listening…";
        recognition.onresult = (event) => {
          const transcript = event.results?.[0]?.[0]?.transcript || "";
          input.value = transcript;
          hint.textContent = "Voice captured. Ask Cosmos when ready.";
        };
        recognition.onerror = () => {
          hint.textContent = "I couldn't capture that. Try again or type your question.";
        };
        recognition.onend = () => {
          if (!input.value.trim()) hint.textContent = "Type a question or a subject. Cosmos will build the experience around you.";
        };
        recognition.start();
      });
    })();
  </script>
</body>

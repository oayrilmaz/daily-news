name: COSMOS v9.5.6 — OneTouch Minimal Timeline (Private + Business)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate without changing live COSMOS, apply only when green, or rollback
        required: true
        default: validate
        type: choice
        options:
          - validate
          - apply
          - rollback

permissions:
  contents: write

concurrency:
  group: cosmos-next-frontend-v956
  cancel-in-progress: false

jobs:
  onetouch:
    name: Validate, apply or rollback the shared minimal timeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 2
      - name: Check Node.js availability
        run: node --version
      - name: Validate patch against current source (read-only)
        run: python3 scripts/apply_cosmos_onetouch_v956.py --mode validate
      - name: Apply or rollback minimal timeline, preserving legacy behavior
        if: ${{ inputs.mode != 'validate' }}
        run: python3 scripts/apply_cosmos_onetouch_v956.py --mode "${{ inputs.mode }}"
      - name: Check diff
        if: ${{ inputs.mode != 'validate' }}
        run: |
          git diff --check -- cosmos-next.html
          git status --short
      - name: Commit only frontend
        if: ${{ inputs.mode != 'validate' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- cosmos-next.html
          if git diff --cached --quiet; then
            echo "No new changes; current state already matches requested mode."
            exit 0
          fi
          git commit -m "COSMOS v9.5.6 OneTouch minimal private and business timeline"
          git push origin HEAD:main

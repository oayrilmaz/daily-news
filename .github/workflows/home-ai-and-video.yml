        run: node scripts/generate_media.js

      # ----------------------------------------------------------------------
      # 9. Validate every critical output before committing
      # ----------------------------------------------------------------------

      - name: Verify Briefing and Historical Files
        run: |
          test -f briefs/daily-ai.json
          test -f briefs/map-signals.json
          test -f briefs/trends.json
          test -f briefs/outlook.json
          test -f briefs/backfill-report.json
          test -d history
          test -d map-share
          test -d summary-share
          test -d outlook-share/7-day
          test -d outlook-share/30-day
          test -f map-share/global.html

          MAP_SHARE_COUNT="$(find map-share -maxdepth 1 -type f -name '*.html' | wc -l)"
          SUMMARY_SHARE_COUNT="$(find summary-share -maxdepth 1 -type f -name '*.html' | wc -l)"
          OUTLOOK_7_COUNT="$(find outlook-share/7-day -maxdepth 1 -type f -name '*.html' | wc -l)"
          OUTLOOK_30_COUNT="$(find outlook-share/30-day -maxdepth 1 -type f -name '*.html' | wc -l)"

          echo "Map share pages: ${MAP_SHARE_COUNT}"
          echo "Summary share pages: ${SUMMARY_SHARE_COUNT}"
          echo "7-day outlook share pages: ${OUTLOOK_7_COUNT}"
          echo "30-day outlook share pages: ${OUTLOOK_30_COUNT}"

          if [ "${MAP_SHARE_COUNT}" -lt 2 ]; then
            echo "ERROR: Expected global + country map-share HTML pages."
            exit 1
          fi

          if [ "${SUMMARY_SHARE_COUNT}" -lt 1 ]; then
            echo "ERROR: No summary-share HTML page was generated."
            exit 1
          fi

          if [ "${OUTLOOK_7_COUNT}" -lt 1 ]; then
            echo "ERROR: No 7-day outlook-share HTML pages were generated."
            exit 1
          fi

          if [ "${OUTLOOK_30_COUNT}" -lt 1 ]; then
            echo "ERROR: No 30-day outlook-share HTML pages were generated."
            exit 1
          fi

          echo "Briefing, historical intelligence, and all static social-preview share pages are ready."

      - name: Verify Knowledge Graph Files
        run: |
          test -f knowledge/developments.json
          test -f knowledge/entities.json
          test -f knowledge/relationships.json
          test -f knowledge/timeline-events.json
          test -f knowledge/knowledge-diff.json
          test -f knowledge/entity-resolution-report.json
          test -f knowledge/integrity-report.json
          test -f knowledge/map-signals-normalization-report.json
          test -f knowledge/cosmos/state-current.json
          test -f knowledge/cosmos/delta-current.json
          test -f knowledge/cosmos/impact-current.json
          test -f knowledge/cosmos/patterns-current.json
          test -f "knowledge/cosmos/state-history/$(date -u +%F).json"
          test -f "knowledge/cosmos/delta-history/$(date -u +%F).json"
          test -f "knowledge/cosmos/impact-history/$(date -u +%F).json"
          test -f "knowledge/cosmos/pattern-history/$(date -u +%F).json"
          echo "Core knowledge graph, Cosmos integrity, state, delta, impact, and pattern outputs are ready."

      - name: Verify Entity Lifecycle and Snapshot
        run: |
          TODAY_UTC="$(date -u +%F)"

          test -f knowledge/entity-lifecycle.json
          test -f "knowledge/snapshots/${TODAY_UTC}.json"

          echo "Entity lifecycle and Time Machine snapshot are ready."
          echo "Snapshot: knowledge/snapshots/${TODAY_UTC}.json"

      # ----------------------------------------------------------------------
      # 10. Commit all automatically generated knowledge
      # ----------------------------------------------------------------------

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update PTD Today living intelligence"
          git push origin main

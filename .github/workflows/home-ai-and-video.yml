





name: Home AI + Video (PTD Today)

on:
  workflow_dispatch:

  # Run once per day to control OpenAI usage and operating cost.
  # 05:15 UTC = 08:15 Türkiye time during UTC+3.
  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: write

concurrency:
  group: home-ai-ptdtoday
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ----------------------------------------------------------------------
      # 1. Repository and runtime
      # ----------------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync with latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Cosmos Preflight Syntax Check
        run: |
          node --check scripts/generate_ai_news.js
          node --check scripts/resolve_entities.js
          node --check scripts/update_entity_lifecycle.js
          node --check scripts/normalize_map_signals.cjs
          node --check scripts/validate_intelligence.cjs
          node --check scripts/cosmos_state_delta.cjs
          node --check scripts/cosmos_impact_engine.cjs
          node --check scripts/cosmos_pattern_engine.cjs
          node --check scripts/backfill_history_from_articles.js

      # ----------------------------------------------------------------------
      # 2. Existing PTD Today source feeds
      # ----------------------------------------------------------------------

      - name: Build Home feed + YouTube + short share pages
        env:
          RECENT_HOURS: "60"
          YT_HOURS: "168"
          CONCURRENCY: "6"
          YT_MAX_PER_CHANNEL: "8"
          MAX_ENRICH: "50"
        run: node scripts/build.mjs

      # ----------------------------------------------------------------------
      # 3. Generate structured daily intelligence
      # ----------------------------------------------------------------------

      - name: Generate Daily AI JSON + Article Pages
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SITE_ORIGIN: https://ptdtoday.com
          KNOWLEDGE_DIR: knowledge
          HISTORY_DIR: history
          BRIEFS_DIR: briefs
          ARTICLES_DIR: articles
          MAP_SIGNAL_LIMIT: "50"
        run: npm run generate:ai

      # ----------------------------------------------------------------------
      # 4. Resolve duplicate entities and repair graph references
      # ----------------------------------------------------------------------

      - name: Resolve Entities + Repair Knowledge Graph
        env:
          KNOWLEDGE_DIR: knowledge
        run: node scripts/resolve_entities.js

      # ----------------------------------------------------------------------
      # 5. Calculate lifecycle after graph resolution
      # ----------------------------------------------------------------------

      - name: Update Entity Lifecycle + Time Machine Snapshot
        env:
          KNOWLEDGE_DIR: knowledge
        run: node scripts/update_entity_lifecycle.js

      # ----------------------------------------------------------------------
      # 5A. Normalize map signals after entity resolution
      # ----------------------------------------------------------------------

      - name: Normalize Map Signals for Cosmos
        env:
          BRIEFS_DIR: briefs
          KNOWLEDGE_DIR: knowledge
        run: node scripts/normalize_map_signals.cjs

      # ----------------------------------------------------------------------
      # 5B. Generate country-specific map-share HTML pages
      #
      # This step reads briefs/map-signals.json and creates static pages such as:
      #   map-share/united-states.html
      #   map-share/germany.html
      #   map-share/france.html
      #
      # LinkedIn/social crawlers can read the Open Graph tags from these static
      # pages. Human visitors are redirected to the live PTD Today map with the
      # selected country already applied.
      #
      # No separate Python file is required; the generator is embedded here.
      # ----------------------------------------------------------------------

      - name: Generate Country Map Share Pages
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import json
          import re
          import html

          BASE_URL = "https://ptdtoday.com"
          SRC = Path("briefs/map-signals.json")
          OUT = Path("map-share")
          OUT.mkdir(parents=True, exist_ok=True)

          COUNTRY_REGION = {
              "Algeria":"Africa",
              "Argentina":"LATAM",
              "Australia":"Asia",
              "Austria":"Europe",
              "Bahrain":"Middle East",
              "Bangladesh":"Asia",
              "Belgium":"Europe",
              "Bolivia":"LATAM",
              "Brazil":"LATAM",
              "Bulgaria":"Europe",
              "Canada":"North America",
              "Chile":"LATAM",
              "China":"Asia",
              "Colombia":"LATAM",
              "Costa Rica":"LATAM",
              "Croatia":"Europe",
              "Czechia":"Europe",
              "Denmark":"Europe",
              "Dominican Republic":"LATAM",
              "Ecuador":"LATAM",
              "Egypt":"Africa",
              "Estonia":"Europe",
              "Ethiopia":"Africa",
              "Finland":"Europe",
              "France":"Europe",
              "Germany":"Europe",
              "Ghana":"Africa",
              "Greece":"Europe",
              "Hungary":"Europe",
              "Iceland":"Europe",
              "India":"Asia",
              "Indonesia":"Asia",
              "Iraq":"Middle East",
              "Ireland":"Europe",
              "Israel":"Middle East",
              "Italy":"Europe",
              "Japan":"Asia",
              "Jordan":"Middle East",
              "Kenya":"Africa",
              "Kuwait":"Middle East",
              "Latvia":"Europe",
              "Lithuania":"Europe",
              "Luxembourg":"Europe",
              "Malaysia":"Asia",
              "Mexico":"North America",
              "Morocco":"Africa",
              "Netherlands":"Europe",
              "New Zealand":"Asia",
              "Nigeria":"Africa",
              "Norway":"Europe",
              "Oman":"Middle East",
              "Pakistan":"Asia",
              "Panama":"LATAM",
              "Paraguay":"LATAM",
              "Peru":"LATAM",
              "Philippines":"Asia",
              "Poland":"Europe",
              "Portugal":"Europe",
              "Qatar":"Middle East",
              "Romania":"Europe",
              "Saudi Arabia":"Middle East",
              "Senegal":"Africa",
              "Serbia":"Europe",
              "Singapore":"Asia",
              "Slovakia":"Europe",
              "Slovenia":"Europe",
              "South Africa":"Africa",
              "South Korea":"Asia",
              "Spain":"Europe",
              "Sri Lanka":"Asia",
              "Sweden":"Europe",
              "Switzerland":"Europe",
              "Tanzania":"Africa",
              "Thailand":"Asia",
              "Tunisia":"Africa",
              "Turkey":"Middle East",
              "Türkiye":"Middle East",
              "Ukraine":"Europe",
              "United Arab Emirates":"Middle East",
              "United Kingdom":"Europe",
              "United States":"North America",
              "Uruguay":"LATAM",
              "Vietnam":"Asia",
              "Democratic Republic of the Congo":"Africa"
          }

          VALID_COUNTRIES = set(COUNTRY_REGION.keys())

          def slugify(value):
              value = str(value or "").strip()
              value = value.replace("Türkiye", "Turkey").lower()
              value = re.sub(r"[^a-z0-9]+", "-", value)
              return value.strip("-")

          def esc(value):
              return html.escape(str(value or ""), quote=True)

          def clean_text(value):
              return re.sub(r"\s+", " ", str(value or "")).strip()

          def truncate(value, limit=290):
              value = clean_text(value)
              if len(value) <= limit:
                  return value
              return value[:limit - 1].rstrip() + "…"

          if not SRC.exists():
              raise SystemExit(f"Missing required file: {SRC}")

          payload = json.loads(SRC.read_text(encoding="utf-8"))
          signals = payload.get("signals", [])

          if not isinstance(signals, list):
              raise SystemExit("briefs/map-signals.json does not contain a valid signals[] array.")

          grouped = {}

          for signal in signals:
              raw_countries = signal.get("countries", [])

              if not isinstance(raw_countries, list):
                  raw_countries = []

              # IMPORTANT:
              # Some transitional map-signals data has contained non-country tags
              # inside countries[]. Only valid country names are allowed here.
              countries = [
                  country for country in raw_countries
                  if country in VALID_COUNTRIES
              ]

              for country in countries:
                  grouped.setdefault(country, []).append(signal)

          # Remove old generated country pages so deleted countries/signals do not
          # leave stale share pages behind.
          for old_page in OUT.glob("*.html"):
              old_page.unlink()

          generated = 0

          for country, items in sorted(grouped.items()):
              # Deduplicate signals for each country.
              seen = set()
              unique_items = []

              for item in items:
                  key = (
                      item.get("signal_id")
                      or item.get("dedup_key")
                      or item.get("id")
                      or item.get("title")
                  )

                  if key in seen:
                      continue

                  seen.add(key)
                  unique_items.append(item)

              items = unique_items

              slug = slugify(country)
              if not slug:
                  continue

              share_url = f"{BASE_URL}/map-share/{slug}.html"
              destination = f"{BASE_URL}/?country={quote(country)}"

              headlines = [
                  clean_text(item.get("title"))
                  for item in items
                  if clean_text(item.get("title"))
              ][:3]

              count = len(items)
              title = f"{country} Power Intelligence | PTD Today"

              if headlines:
                  description = truncate(
                      f"{count} current intelligence signal"
                      f"{'' if count == 1 else 's'} for {country}: "
                      + " • ".join(headlines)
                  )
              else:
                  description = truncate(
                      f"Explore today's power-grid, substation, data-center, "
                      f"renewable and infrastructure intelligence associated with {country}."
                  )

              # Use the default PTD Today OG image for now.
              # Later this can be replaced with a country-specific generated image.
              og_image = f"{BASE_URL}/assets/og-default.png"

              bullets = "\n".join(
                  f"        <li>{esc(headline)}</li>"
                  for headline in headlines
              )

              generated_at = payload.get("generated_at", "")

              page = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">

            <title>{esc(title)}</title>
            <meta name="description" content="{esc(description)}">
            <link rel="canonical" href="{esc(share_url)}">

            <meta property="og:type" content="website">
            <meta property="og:site_name" content="PTD Today">
            <meta property="og:title" content="{esc(title)}">
            <meta property="og:description" content="{esc(description)}">
            <meta property="og:url" content="{esc(share_url)}">
            <meta property="og:image" content="{esc(og_image)}">
            <meta property="og:image:width" content="1200">
            <meta property="og:image:height" content="630">

            <meta name="twitter:card" content="summary_large_image">
            <meta name="twitter:title" content="{esc(title)}">
            <meta name="twitter:description" content="{esc(description)}">
            <meta name="twitter:image" content="{esc(og_image)}">

            <script>
              /*
                Human visitors go to the live PTD Today interactive map with the
                selected country already applied.

                Social crawlers normally do not execute this JavaScript, so they
                continue to read the Open Graph metadata above.
              */
              window.location.replace({json.dumps(destination)});
            </script>
          </head>

          <body>
            <main>
              <h1>{esc(title)}</h1>
              <p>{esc(description)}</p>

              <ul>
          {bullets}
              </ul>

              <p>
                <a href="{esc(destination)}">
                  Open {esc(country)} Power Intelligence on PTD Today
                </a>
              </p>

              <small>
                Generated from PTD Today map intelligence:
                {esc(generated_at)}
              </small>
            </main>
          </body>
          </html>
          """

              (OUT / f"{slug}.html").write_text(page, encoding="utf-8")
              generated += 1

          print(f"Generated {generated} country map-share page(s) in {OUT}/")

          if generated == 0:
              print("WARNING: No valid country share pages were generated.")
          PY

      # ----------------------------------------------------------------------
      # 5C. Generate dedicated social-preview pages for every share surface
      #
      # LinkedIn and other social crawlers do not use JavaScript-generated share
      # text to build the preview card. They crawl the URL and read static Open
      # Graph metadata. These pages therefore provide dedicated preview cards for:
      #
      #   • Today's Intelligence Summary
      #   • Global Power Intelligence Map
      #   • Every 7-Day AI Outlook card
      #   • Every 30-Day AI Outlook card
      #
      # Article share buttons already point to dedicated /articles/*.html pages.
      # Sponsored Partner Spotlight already points to its dedicated partner page.
      # Country map-share pages are generated in Step 5B above.
      # ----------------------------------------------------------------------

      - name: Generate Summary + Global Map + Outlook Share Pages
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import json
          import re
          import html

          BASE_URL = "https://ptdtoday.com"
          DAILY = Path("briefs/daily-ai.json")
          MAP = Path("briefs/map-signals.json")
          OUTLOOK = Path("briefs/outlook.json")
          DEVELOPMENTS = Path("knowledge/developments.json")

          SUMMARY_OUT = Path("summary-share")
          MAP_OUT = Path("map-share")
          OUTLOOK_OUT = Path("outlook-share")

          SUMMARY_OUT.mkdir(parents=True, exist_ok=True)
          MAP_OUT.mkdir(parents=True, exist_ok=True)
          (OUTLOOK_OUT / "7-day").mkdir(parents=True, exist_ok=True)
          (OUTLOOK_OUT / "30-day").mkdir(parents=True, exist_ok=True)

          def esc(value):
              return html.escape(str(value or ""), quote=True)

          def clean_text(value):
              return re.sub(r"\s+", " ", str(value or "")).strip()

          def truncate(value, limit=290):
              value = clean_text(value)
              if len(value) <= limit:
                  return value
              return value[:limit - 1].rstrip() + "…"

          def slugify(value):
              value = clean_text(value).lower()
              value = re.sub(r"[^a-z0-9]+", "-", value)
              return value.strip("-") or "outlook"

          def page_html(title, description, share_url, destination, heading=None, bullets=None):
              og_image = f"{BASE_URL}/assets/og-default.png"
              bullets = bullets or []
              bullet_html = "\n".join(
                  f"        <li>{esc(item)}</li>"
                  for item in bullets if clean_text(item)
              )

              return f"""<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">

            <title>{esc(title)}</title>
            <meta name="description" content="{esc(description)}">
            <link rel="canonical" href="{esc(share_url)}">

            <meta property="og:type" content="website">
            <meta property="og:site_name" content="PTD Today">
            <meta property="og:title" content="{esc(title)}">
            <meta property="og:description" content="{esc(description)}">
            <meta property="og:url" content="{esc(share_url)}">
            <meta property="og:image" content="{esc(og_image)}">
            <meta property="og:image:width" content="1200">
            <meta property="og:image:height" content="630">

            <meta name="twitter:card" content="summary_large_image">
            <meta name="twitter:title" content="{esc(title)}">
            <meta name="twitter:description" content="{esc(description)}">
            <meta name="twitter:image" content="{esc(og_image)}">

            <script>
              /*
                Human visitors are redirected to the live PTD Today interface.
                Social crawlers normally do not execute this JavaScript, so they
                retain the dedicated Open Graph preview above.
              */
              window.location.replace({json.dumps(destination)});
            </script>
          </head>
          <body>
            <main>
              <h1>{esc(heading or title)}</h1>
              <p>{esc(description)}</p>
              <ul>
          {bullet_html}
              </ul>
              <p><a href="{esc(destination)}">Open on PTD Today</a></p>
            </main>
          </body>
          </html>
          """

          # --------------------------------------------------------------
          # A. Today's Intelligence Summary
          # --------------------------------------------------------------
          if DAILY.exists():
              payload = json.loads(DAILY.read_text(encoding="utf-8"))
              date_utc = clean_text(payload.get("date_utc")) or clean_text(payload.get("date")) or "today"
              sections = payload.get("sections", [])
              if not isinstance(sections, list):
                  sections = []

              def section_bullets(name):
                  for section in sections:
                      if clean_text(section.get("heading")).lower() == name.lower():
                          rows = section.get("bullets", [])
                          return rows if isinstance(rows, list) else []
                  return []

              top = section_bullets("Top Themes")[:3]
              why = section_bullets("Why It Matters")[:2]
              ripple = (
                  section_bullets("Ripple Effects & Connections")
                  or section_bullets("Connections & Ripple Effects")
              )[:2]

              summary_bits = [clean_text(x) for x in (top + why) if clean_text(x)]
              description = truncate(
                  " • ".join(summary_bits)
                  if summary_bits
                  else "Today's PTD Today intelligence summary: the leading themes, why they matter, and plausible ripple effects across the power and energy ecosystem."
              )

              share_url = f"{BASE_URL}/summary-share/{quote(date_utc)}.html"
              destination = f"{BASE_URL}/?summary=1"
              title = f"PTD Today — Intelligence Summary | {date_utc}"

              (SUMMARY_OUT / f"{date_utc}.html").write_text(
                  page_html(
                      title,
                      description,
                      share_url,
                      destination,
                      heading="Today's Intelligence Summary",
                      bullets=(top + why + ripple)[:7],
                  ),
                  encoding="utf-8",
              )
              print(f"Generated summary share page: {SUMMARY_OUT / f'{date_utc}.html'}")
          else:
              print("WARNING: briefs/daily-ai.json missing; summary share page skipped.")

          # --------------------------------------------------------------
          # B. Global Power Intelligence Map
          # --------------------------------------------------------------
          if MAP.exists():
              payload = json.loads(MAP.read_text(encoding="utf-8"))
              signals = payload.get("signals", [])
              if not isinstance(signals, list):
                  signals = []

              headlines = [
                  clean_text(item.get("title"))
                  for item in signals
                  if clean_text(item.get("title"))
              ][:3]

              description = truncate(
                  (
                      f"{len(signals)} current global intelligence signals: "
                      + " • ".join(headlines)
                  )
                  if headlines
                  else "Explore today's global power-grid, substation, data-center, renewable, infrastructure and market intelligence."
              )

              share_url = f"{BASE_URL}/map-share/global.html"
              destination = f"{BASE_URL}/?map=global"
              title = "Global Power Intelligence Map | PTD Today"

              (MAP_OUT / "global.html").write_text(
                  page_html(
                      title,
                      description,
                      share_url,
                      destination,
                      heading="Global Power Intelligence Map",
                      bullets=headlines,
                  ),
                  encoding="utf-8",
              )
              print("Generated global map share page: map-share/global.html")
          else:
              print("WARNING: briefs/map-signals.json missing; global map share page skipped.")

          # --------------------------------------------------------------
          # C. 7-Day + 30-Day AI Outlook share pages
          # --------------------------------------------------------------
          developments_by_id = {}

          if DEVELOPMENTS.exists():
              development_payload = json.loads(DEVELOPMENTS.read_text(encoding="utf-8"))
              development_rows = development_payload.get("developments", [])
              if isinstance(development_rows, list):
                  for row in development_rows:
                      key = row.get("development_id") or row.get("id")
                      if key:
                          developments_by_id[str(key)] = row

          def evidence_title(dev_id):
              row = developments_by_id.get(str(dev_id), {})
              return clean_text(
                  row.get("title")
                  or row.get("summary")
                  or ""
              )

          def evidence_driven_description(entry, horizon):
              label = clean_text(entry.get("label") or entry.get("key") or "This outlook")
              ids = entry.get("evidence_development_ids", [])
              if not isinstance(ids, list):
                  ids = []

              recent_ids = entry.get("short_evidence_development_ids", [])
              if not isinstance(recent_ids, list):
                  recent_ids = []
              recent_ids = set(str(x) for x in recent_ids if x)

              ordered = []
              seen = set()

              # Recent evidence first.
              for dev_id in list(ids):
                  key = str(dev_id)
                  title = evidence_title(key)
                  if not title:
                      continue
                  normalized = title.lower()
                  if normalized in seen:
                      continue
                  ordered.append((0 if key in recent_ids else 1, title))
                  seen.add(normalized)

              ordered.sort(key=lambda row: row[0])
              titles = [row[1] for row in ordered[:2]]

              if len(titles) >= 2:
                  return truncate(
                      f"{label}: the current {horizon}-day outlook is being driven by "
                      f"{titles[0]}, together with {titles[1]}."
                  )
              if len(titles) == 1:
                  return truncate(
                      f"{label}: the current {horizon}-day outlook is being driven by {titles[0]}."
                  )

              statement = clean_text(entry.get("statement"))
              if statement:
                  return truncate(statement)

              return truncate(
                  f"Current PTD Today evidence keeps {label} active in the {horizon}-day AI outlook."
              )

          generated_outlooks = 0

          if OUTLOOK.exists():
              payload = json.loads(OUTLOOK.read_text(encoding="utf-8"))
              horizons = payload.get("horizons", {})
              if not isinstance(horizons, dict):
                  horizons = {}

              configs = [
                  (7, "next_7_days", "7-day"),
                  (30, "next_30_days", "30-day"),
              ]

              for horizon, key, folder in configs:
                  rows = horizons.get(key, {}).get("topics", [])
                  if not isinstance(rows, list):
                      rows = []

                  out_dir = OUTLOOK_OUT / folder

                  # Remove stale generated outlook pages in this horizon.
                  for old_page in out_dir.glob("*.html"):
                      old_page.unlink()

                  for entry in rows:
                      label = clean_text(entry.get("label") or entry.get("key") or "PTD Today Outlook")
                      slug = slugify(entry.get("key") or label)
                      probability = round(float(entry.get("probability") or 0) * 100)
                      direction = clean_text(entry.get("direction")) or "Stable"
                      confidence = clean_text(entry.get("confidence")) or "Low"
                      evidence_count = int(entry.get("evidence_signal_count") or 0)

                      title = f"{label} — {probability}% | {horizon}-Day AI Outlook | PTD Today"
                      description = evidence_driven_description(entry, horizon)

                      share_url = f"{BASE_URL}/outlook-share/{folder}/{slug}.html"
                      destination = (
                          f"{BASE_URL}/?outlook={horizon}&focus={quote(slug)}"
                          f"#market-outlook-{horizon}-{quote(slug)}"
                      )

                      bullets = [
                          f"Direction: {direction}",
                          f"Confidence: {confidence}",
                          f"{evidence_count} intelligence signal{'s' if evidence_count != 1 else ''} behind this outlook.",
                      ]

                      (out_dir / f"{slug}.html").write_text(
                          page_html(
                              title,
                              description,
                              share_url,
                              destination,
                              heading=f"{label} — {probability}%",
                              bullets=bullets,
                          ),
                          encoding="utf-8",
                      )
                      generated_outlooks += 1

              print(
                  f"Generated {generated_outlooks} outlook share page(s) "
                  f"in {OUTLOOK_OUT}/7-day and {OUTLOOK_OUT}/30-day"
              )
          else:
              print("WARNING: briefs/outlook.json missing; outlook share pages skipped.")

          if generated_outlooks == 0:
              print("WARNING: No outlook share pages were generated.")
          PY

      # ----------------------------------------------------------------------
      # 6. Cosmos Foundation Gate
      #
      # Strict production mode: corrupted structural intelligence must not
      # continue into historical ingestion.
      # ----------------------------------------------------------------------

      - name: Cosmos Intelligence Integrity Gate
        env:
          BRIEFS_DIR: briefs
          KNOWLEDGE_DIR: knowledge
          INTEGRITY_STRICT: "true"
        run: node scripts/validate_intelligence.cjs

      # ----------------------------------------------------------------------
      # 6A. Cosmos State + Delta Engine
      # Runs only after the strict integrity gate passes.
      # First production run establishes a cold-start baseline.
      # ----------------------------------------------------------------------

      - name: Build Cosmos State + Delta
        env:
          KNOWLEDGE_DIR: knowledge
        run: node scripts/cosmos_state_delta.cjs

      # ----------------------------------------------------------------------
      # 6B. Cosmos Impact / Propagation Engine
      #
      # Deterministic and zero-OpenAI-credit.
      # Runs after State + Delta so the persistent impact graph reflects the
      # newly generated current Cosmos state.
      # ----------------------------------------------------------------------

      - name: Build Cosmos Impact Graph
        env:
          KNOWLEDGE_DIR: knowledge
        run: node scripts/cosmos_impact_engine.cjs

      # ----------------------------------------------------------------------
      # 6C. Cosmos Pattern Engine
      #
      # Deterministic and zero-OpenAI-credit.
      # Detects convergence, reinforcement, structural acceleration, and
      # cross-domain coupling after State + Delta + Impact are available.
      # ----------------------------------------------------------------------

      - name: Build Cosmos Patterns
        env:
          KNOWLEDGE_DIR: knowledge
        run: node scripts/cosmos_pattern_engine.cjs

      # ----------------------------------------------------------------------
      # 7. Rebuild historical analytics from accumulated intelligence
      # ----------------------------------------------------------------------

      - name: Rebuild Historical Intelligence
        run: node scripts/backfill_history_from_articles.js

      # ----------------------------------------------------------------------
      # 8. Generate Media intelligence
      # ----------------------------------------------------------------------

      - name: Generate Media (YouTube → AI summaries)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SITE_ORIGIN: https://ptdtoday.com

          # Output sizing
          MEDIA_MAX_VIDEOS: "18"
          MEDIA_MAX_PER_CHANNEL: "2"

          # Lookback + auto-expand when too few
          MEDIA_LOOKBACK_HOURS: "168"
          MEDIA_MIN_ITEMS: "10"
          MEDIA_EXPAND_HOURS_IF_LOW: "720"

          # Filtering
          MEDIA_FILTER_MODE: "hybrid"
          MEDIA_MIN_MATCH_SCORE: "1"
          MEDIA_MAX_FILTER_AI: "40"
          MEDIA_CAPTIONS_LANG: "en"

          # Channels

            );
          }

          if (Number(report.reversal_state?.requested_count) !== 1 ||
              Number(report.reversal_state?.reversed_count) !== 1 ||
              Number(report.reversal_state?.idempotent_skip_count) !== 0 ||
              Number(report.reversal_state?.error_count) !== 0 ||
              Number(report.reversal_state?.active_graph_record_count) !== 0 ||

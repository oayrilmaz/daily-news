              `Temporal Knowledge reference_time invalid: ${payload.reference_time}`
            );
          }

          const state = payload.temporal_state || {};

          if (Number(state.record_count) !== 4 ||
              Number(state.past_count) !== 1 ||
              Number(state.current_count) !== 1 ||
              Number(state.transition_count) !== 1 ||
              Number(state.future_count) !== 1 ||
              Number(state.unknown_count) !== 0) {
            errors.push(
              `Temporal state counts invalid: ${JSON.stringify(state)}`
            );
          }

          const timeline = payload.timeline || {};

          if ((timeline.past || []).length !== 1 ||
              timeline.past?.[0]?.graph_record_id !== "graph_past" ||
              timeline.past?.[0]?.active !== false) {
            errors.push(
              "Historical record classification invalid"
            );
          }

          if ((timeline.current || []).length !== 1 ||
              timeline.current?.[0]?.graph_record_id !== "graph_current" ||
              timeline.current?.[0]?.active !== true) {
            errors.push(
              "Current record classification invalid"
            );
          }

          if ((timeline.transition || []).length !== 1 ||
              timeline.transition?.[0]?.graph_record_id !== "graph_transition") {
            errors.push(
              "Transition record classification invalid"
            );
          }

          if ((timeline.future || []).length !== 1 ||
              timeline.future?.[0]?.graph_record_id !== "graph_future" ||
              timeline.future?.[0]?.temporal_contract?.future_is_not_current_fact !== true ||
              timeline.future?.[0]?.temporal_contract?.current_state_claimed !== false) {
            errors.push(
              "Future scenario boundary invalid"
            );
          }

          const future = timeline.future?.[0];

          if (!future ||
              Number(future.confidence_score) !== 58 ||
              future.confidence_band !== "moderate" ||
              future.geography_scope !== "Global" ||
              !Array.isArray(future.evidence_record_ids) ||
              future.evidence_record_ids.length !== 1 ||
              future.evidence_record_ids[0] !== "evidence_future_1") {
            errors.push(
              "Future record lost confidence/geography/evidence lineage"
            );
          }

          const transitions = payload.transitions || [];

          if (!Array.isArray(transitions) ||
              transitions.length !== 1) {
            errors.push(
              `Expected one observed historical transition; got ${transitions.length}`
            );
          } else {
            const t = transitions[0];

            if (t.validation_target_id !== "validation_temporal_shared" ||
                t.from_graph_record_id !== "graph_past" ||
                t.to_graph_record_id !== "graph_current" ||
                t.from_temporal_state !== "past" ||
                t.to_temporal_state !== "current" ||

                "subject": "PTD Today",
                "predicate": "founded_by",
                "object": "External Claimant",
                "source_type": "external_secondary",
                "source_url": "https://example.com/conflicting-founder-claim",
                "source_label": "Controlled conflicting external claim",
                "verification_status": "unverified",
                "verified_at": null,
                "confidence_score": 45,
                "protected_identity": false,
                "valid_from": "2026-01-01T00:00:00Z",
                "valid_to": null
              },
              {
                "identity_relationship_id": "identity_future_creator_fixture",
                "subject": "Cosmos",
                "predicate": "created_by",
                "object": "External Claimant",
                "source_type": "external_secondary",
                "source_url": "https://example.com/future-identity-claim",
                "source_label": "Controlled future identity claim",
                "verification_status": "unverified",
                "verified_at": null,
                "confidence_score": 30,
                "protected_identity": false,
                "valid_from": "2099-01-01T00:00:00Z",
                "valid_to": null
              }
            ]
          }
          JSON

          (
            cd "$TEST_DIR"

            node scripts/cosmos_first_party_identity.cjs \
              --input first-party-identity-fixture-v0.1.json \
              --reference-time 2026-08-27T12:00:00Z \
              --question "Who founded PTD Today?" \
              --question "Who created Cosmos?" \
              --question "What is the relationship between PTD Today and Cosmos?" \
              --out knowledge/cosmos/first-party-identity-test-v0.1.json
          )

          TEST_DIR="$TEST_DIR" node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const root = process.env.TEST_DIR;
          const file = path.join(
            root,
            "knowledge/cosmos/first-party-identity-test-v0.1.json"
          );

          if (!fs.existsSync(file)) {
            throw new Error(
              "Cosmos First-Party Identity did not create first-party-identity-test-v0.1.json"
            );
          }

          const payload = JSON.parse(fs.readFileSync(file, "utf8"));
          const errors = [];

          if (payload.schema_version !== "0.1") {
            errors.push(
              `Unexpected First-Party Identity schema_version: ${payload.schema_version}`
            );
          }

          if (payload.status !== "first_party_identity_resolved") {
            errors.push(
              `First-Party Identity failed: ${payload.status}`
            );
          }

          if (payload.reference_time !== "2026-08-27T12:00:00Z") {
            errors.push(
              `First-Party Identity reference_time invalid: ${payload.reference_time}`
            );
          }

          const relationships = payload.relationships || [];
          const conflicts = payload.conflicts || [];
          const answers = payload.answers || [];

          if (!Array.isArray(relationships) || relationships.length !== 5) {
            errors.push(
              `Controlled First-Party Identity expected 5 relationships; got ${relationships.length}`
            );
          }

          const firstPartyFounder = relationships.find(
            row =>
              row.identity_relationship_id ===
              "identity_ptd_founded_by_fixture"
          );

          if (!firstPartyFounder ||
              firstPartyFounder.subject !== "PTD Today" ||
              firstPartyFounder.predicate !== "founded_by" ||
              firstPartyFounder.object !== "Fixture Founder" ||
              firstPartyFounder.source_type !== "first_party" ||
              firstPartyFounder.verification_status !== "verified" ||
              firstPartyFounder.temporal_state !== "current" ||
              firstPartyFounder.assertion_scope !==
                "entity_self_asserted_identity" ||
              firstPartyFounder.source_url !==
                "https://www.ptdtoday.com/about") {
            errors.push(
              "Controlled first-party founder record invalid"
            );
          }

          const futureClaim = relationships.find(
            row =>
              row.identity_relationship_id ===
              "identity_future_creator_fixture"
          );

          if (!futureClaim ||
              futureClaim.temporal_state !== "future") {
            errors.push(
              "Future identity relationship was not classified as future"
            );
          }

          if (!Array.isArray(conflicts) || conflicts.length !== 1) {
            errors.push(
              `Expected one current identity conflict; got ${conflicts.length}`
            );
          } else {
            const conflict = conflicts[0];

            if (conflict.predicate !== "founded_by" ||
                conflict.temporal_state !== "current" ||
                conflict.first_party_present !== true ||
                conflict.external_present !== true ||
                conflict.resolution_status !== "unresolved" ||
                conflict.silent_overwrite_permitted !== false ||
                conflict.records_preserved !== true ||
                !Array.isArray(conflict.competing_objects) ||
                !conflict.competing_objects.includes("Fixture Founder") ||
                !conflict.competing_objects.includes("External Claimant")) {
              errors.push(
                "Controlled identity conflict preservation invalid"
              );
            }
          }

          if (!Array.isArray(answers) || answers.length !== 3) {
            errors.push(
              `Expected 3 controlled identity answers; got ${answers.length}`
            );
          }

          const founderAnswer = answers.find(
            row => row.predicate === "founded_by"
          );

          if (!founderAnswer ||
              founderAnswer.answer_status !== "resolved" ||
              founderAnswer.selected_relationship?.object !== "Fixture Founder" ||
              founderAnswer.selected_relationship?.source_type !== "first_party" ||
              founderAnswer.selected_relationship?.verification_status !== "verified" ||
              founderAnswer.conflicts?.length !== 1 ||
              founderAnswer.answer_contract?.first_party_selected_as_self_asserted_identity !== true ||
              founderAnswer.answer_contract?.first_party_not_universal_truth !== true ||
              founderAnswer.answer_contract?.conflict_disclosed !== true ||
              founderAnswer.answer_contract?.external_disagreement_preserved !== true ||
              founderAnswer.answer_contract?.provenance_required !== true) {
            errors.push(
              "Founder answer did not preserve first-party/provenance/conflict boundaries"
            );
          }

          const creatorAnswer = answers.find(
            row => row.predicate === "created_by"
          );

          if (!creatorAnswer ||
              creatorAnswer.answer_status !== "resolved" ||
              creatorAnswer.selected_relationship?.object !== "Fixture Founder" ||
              creatorAnswer.selected_relationship?.temporal_state !== "current" ||
              creatorAnswer.selected_relationship?.source_type !== "first_party") {
            errors.push(
              "Cosmos creator answer invalid"
            );
          }

          const relationshipAnswer = answers.find(
            row => row.predicate === "develops"
          );

          if (!relationshipAnswer ||
              relationshipAnswer.answer_status !== "resolved" ||
              relationshipAnswer.selected_relationship?.subject !== "PTD Today" ||
              relationshipAnswer.selected_relationship?.object !== "Cosmos" ||
              relationshipAnswer.selected_relationship?.source_type !== "first_party") {
            errors.push(
              "PTD Today/Cosmos relationship answer invalid"
            );
          }

          const contract = payload.identity_contract || {};

          if (contract.first_party_means_self_asserted_identity_authority !== true ||
              contract.first_party_does_not_mean_universal_truth !== true ||
              contract.protected_identity_records_preserved !== true ||
              contract.external_conflicts_preserved !== true ||
              contract.silent_conflict_overwrite_forbidden !== true ||
              contract.temporal_identity_supported !== true ||
              contract.provenance_required !== true) {
            errors.push(
              "First-Party Identity contract invalid"
            );
          }

          const safeguards = payload.safeguards || {};

          if (safeguards.performs_external_search !== false ||
              safeguards.calls_openai_or_external_api !== false ||
              safeguards.mutates_graph !== false ||
              safeguards.deletes_identity_history !== false ||
              safeguards.overwrites_conflicting_external_claims !== false ||
              safeguards.treats_first_party_as_universal_truth !== false ||
              safeguards.promotes_future_identity_to_current !== false ||
              safeguards.preserves_provenance !== true ||
              safeguards.preserves_conflicts !== true) {
            errors.push(
              "First-Party Identity safeguards invalid"
            );
          }

          if (errors.length) {
            console.error(
              "\nCosmos First-Party Identity v0.1 preflight errors:"
            );
            for (const error of errors) {
              console.error(`- ${error}`);
            }
            process.exit(1);
          }

          console.log("");
          console.log("Cosmos First-Party Identity v0.1 isolated test passed.");
          console.log(`Status:              ${payload.status}`);
          console.log(`Relationships:       ${relationships.length}`);
          console.log(`Current conflicts:   ${conflicts.length}`);
          console.log(`Resolved answers:    ${answers.filter(x => x.answer_status === "resolved").length}`);
          console.log(
            "Founder/creator resolution, provenance, temporal identity, conflict preservation and first-party-not-universal-truth safeguards passed."
          );
          console.log(
            "Repository files were not modified by the isolated test."
          );
          NODE


                !row.evidence_status ||
                !row.effective_confidence_band) {
              errors.push(
                `Causal edge ${row.narrative_edge_id || "(unknown)"} lost narrative metadata`
              );
            }
          }

          if (!Array.isArray(candidates) || candidates.length < 1) {
            errors.push(
              "Cosmos Causal Narrative produced no potential_new_signals"
            );
          }

          for (const candidate of candidates) {
            if (candidate.status !== "candidate_only" ||
                candidate.promotion_to_signal !== false) {
              errors.push(
                `Potential new signal ${candidate.candidate_signal_id || "(unknown)"} was improperly promoted`
              );

              safeguards.preserves_source_lineage !== true ||
              safeguards.preserves_epistemic_status !== true ||
              safeguards.causal_distance_penalizes_confidence !== true ||
              safeguards.activation_logic_separate_from_causality !== true ||
              safeguards.candidate_signals_not_auto_promoted !== true) {
            errors.push(
              "Cosmos Causal Narrative safeguards invalid"
            );
          }

          if (errors.length) {
            console.error(
              "\nCosmos Causal Narrative v0.1 preflight errors:"
            );
            for (const error of errors) {
              console.error(`- ${error}`);
            }
            process.exit(1);

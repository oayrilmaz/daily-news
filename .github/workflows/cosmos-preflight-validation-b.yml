          cp scripts/cosmos_graph_integrity.cjs \
            "$TEST_DIR/scripts/cosmos_graph_integrity.cjs"

          TEST_DIR="$TEST_DIR" node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const root = process.env.TEST_DIR;

          const qualified = {
            knowledge_admission_id: "knowledge_admission_integrity_fixture_qualified",
            evidence_validation_id: "evidence_validation_integrity_fixture",
            evidence_task_id: "evidence_task_integrity_fixture",
            validation_target_id: "validation_integrity_fixture",
            admitted_claim_class: "validated_qualified_relationship",
            validation_disposition: "partially_supported",
            decision: "admit_with_qualification",
            confidence_score: 76,
            confidence_band: "high",
            persistence_level: "persistent_qualified_knowledge",
            evidence_record_ids: [
              "evidence_integrity_1",
              "evidence_integrity_2",
              "evidence_integrity_3"
            ],
            qualification: {
              contradiction_present: true,
              must_preserve_contradiction: true,
              confidence_must_be_preserved: true,
              source_lineage_must_be_preserved: true,
              temporal_scope_must_be_preserved: true,
              geography_scope_must_be_preserved: true
            },
            graph_write_eligibility: true,
            graph_write_status: "not_started"
          };

          const admission = {
            schema_version: "0.1",
            generated_at: new Date().toISOString(),
            status: "knowledge_admission_resolved",
            admission_state: {
              conceptual_distance_limit: null,
              continuation_possible: true
            },
            admissions: [qualified],
            graph_write_queue: [
              { ...qualified, graph_write_rank: 1 }
            ]
          };

          const graph = {
            schema_version: "0.1",
            generated_at: null,
            status: "cosmos_graph_snapshot",
            knowledge_records: [],
            audit_log: []
          };

          fs.writeFileSync(
            path.join(root, "knowledge-admission-fixture.json"),
            JSON.stringify(admission, null, 2)
          );

          fs.writeFileSync(
            path.join(root, "empty-graph-fixture.json"),
            JSON.stringify(graph, null, 2)
          );
          NODE

          (
            cd "$TEST_DIR"

            node scripts/cosmos_graph_writer.cjs \
              --admission knowledge-admission-fixture.json \
              --graph empty-graph-fixture.json \
              --out knowledge/cosmos/valid-graph-v0.1.json \
              --report knowledge/cosmos/graph-writer-report-v0.1.json

            node scripts/cosmos_graph_integrity.cjs \
              --graph knowledge/cosmos/valid-graph-v0.1.json \
              --out knowledge/cosmos/graph-integrity-valid-v0.1.json
          )

          TEST_DIR="$TEST_DIR" node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const root = process.env.TEST_DIR;
          const graph = JSON.parse(
            fs.readFileSync(
              path.join(root, "knowledge/cosmos/valid-graph-v0.1.json"),
              "utf8"
            )
          );
          const report = JSON.parse(
            fs.readFileSync(
              path.join(root, "knowledge/cosmos/graph-integrity-valid-v0.1.json"),
              "utf8"
            )
          );

          const errors = [];

          if (report.schema_version !== "0.1") {
            errors.push(
              `Unexpected Graph Integrity schema_version: ${report.schema_version}`
            );
          }

          if (report.status !== "graph_integrity_passed") {
            errors.push(
              `Valid controlled graph should pass integrity; got ${report.status}`
            );
          }

          if (Number(report.integrity_state?.error_count) !== 0) {
            errors.push(
              `Valid graph integrity expected 0 errors; got ${report.integrity_state?.error_count}`
            );
          }

          if (report.integrity_state?.production_write_safe !== true) {
            errors.push(
              "Valid graph should be production_write_safe=true"
            );
          }

          if (Number(report.graph_state?.knowledge_record_count) !== 1 ||
              Number(report.graph_state?.active_record_count) !== 1 ||
              Number(report.graph_state?.audit_record_count) !== 1 ||
              Number(report.graph_state?.unique_admission_count) !== 1 ||
              Number(report.graph_state?.unique_validation_target_count) !== 1) {
            errors.push(
              "Valid graph state counts are incorrect"
            );
          }

          if (!Array.isArray(graph.knowledge_records) ||
              graph.knowledge_records.length !== 1 ||
              graph.knowledge_records[0].qualification?.must_preserve_contradiction !== true) {
            errors.push(
              "Graph Writer fixture did not preserve qualified contradiction"
            );
          }

          const safeguards = report.safeguards || {};

          if (safeguards.read_only !== true ||
              safeguards.mutates_graph !== false ||
              safeguards.auto_repairs_graph !== false ||
              safeguards.checks_duplicate_materialization !== true ||
              safeguards.checks_broken_lineage !== true ||
              safeguards.checks_qualification_loss !== true ||
              safeguards.checks_confidence_integrity !== true ||
              safeguards.checks_audit_integrity !== true ||
              safeguards.checks_reversibility !== true ||
              safeguards.checks_active_conflicts !== true ||
              safeguards.checks_temporal_ordering !== true) {
            errors.push(
              "Graph Integrity safeguards invalid on valid graph"
            );
          }

          if (errors.length) {
            console.error("\nCosmos Graph Integrity valid-graph errors:");
            for (const error of errors) console.error(`- ${error}`);
            process.exit(1);
          }

          // Create an intentionally corrupted copy.
          const corrupted = JSON.parse(JSON.stringify(graph));
          corrupted.knowledge_records[0].qualification.must_preserve_contradiction = false;

          fs.writeFileSync(
            path.join(root, "knowledge/cosmos/corrupted-graph-v0.1.json"),
            JSON.stringify(corrupted, null, 2)
          );

          console.log("");
          console.log("Valid graph integrity test passed.");
          console.log("Creating intentional qualification-loss corruption for negative test.");
          NODE

          set +e
          (
            cd "$TEST_DIR"
            node scripts/cosmos_graph_integrity.cjs \
              --graph knowledge/cosmos/corrupted-graph-v0.1.json \
              --out knowledge/cosmos/graph-integrity-corrupt-v0.1.json
          )
          CORRUPT_EXIT=$?
          set -e

          if [ "$CORRUPT_EXIT" -eq 0 ]; then
            echo "ERROR: Corrupted graph unexpectedly passed Graph Integrity."
            exit 1
          fi

          TEST_DIR="$TEST_DIR" node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const root = process.env.TEST_DIR;
          const report = JSON.parse(
            fs.readFileSync(
              path.join(root, "knowledge/cosmos/graph-integrity-corrupt-v0.1.json"),
              "utf8"
            )
          );

          const codes = new Set((report.issues || []).map(x => x.code));

          if (report.status !== "graph_integrity_failed") {
            throw new Error(
              `Corrupted graph must fail integrity; got ${report.status}`
            );
          }

          if (Number(report.integrity_state?.error_count) < 1) {
            throw new Error(
              "Corrupted graph integrity report must contain at least one error"
            );
          }

          if (report.integrity_state?.production_write_safe !== false) {
            throw new Error(
              "Corrupted graph must have production_write_safe=false"
            );
          }

          if (!codes.has("QUALIFICATION_LOSS")) {
            throw new Error(
              `Expected QUALIFICATION_LOSS; got ${[...codes].join(", ")}`
            );
          }

          console.log("");
          console.log("Cosmos Graph Integrity v0.1 isolated test passed.");
          console.log("Valid graph:             PASS");
          console.log(`Valid errors:            0`);
          console.log("Intentional corruption:  REJECTED");
          console.log(`Corrupt errors:          ${report.integrity_state.error_count}`);
          console.log("Detected:                QUALIFICATION_LOSS");
          console.log("Production graph writes: NONE");
          console.log(
            "Positive integrity and intentional-failure detection safeguards passed."
          );
          NODE


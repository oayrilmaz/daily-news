          for (const depth of expectedDepths) {
            if (!downstream.some(
                  row => Number(row.causal_depth) === depth
                )) {
              errors.push(
                `Butterfly effect missing causal depth ${depth}`
              );
            }
          }

          // Confidence must never increase beyond the original edge confidence
          // and should not increase as the path gets farther away.
          let priorEffective = Infinity;

          for (const row of [...downstream].sort(
            (a,b) => Number(a.causal_depth)-Number(b.causal_depth)
          )) {
            const effective =
              Number(row.effective_confidence_score);
            const original =
              Number(row.original_confidence_score);


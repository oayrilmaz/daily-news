          TEST_DIR="$TEST_DIR" node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const root = process.env.TEST_DIR;
          const file = path.join(
            root,
            "knowledge/cosmos/graph-evolution-test-v0.1.json"
          );

          if (!fs.existsSync(file)) {
            throw new Error(
              "Cosmos Graph Evolution did not create graph-evolution-test-v0.1.json"
            );
          }

          const payload = JSON.parse(fs.readFileSync(file, "utf8"));
          const errors = [];

          if (payload.schema_version !== "0.1") {
            errors.push(
              `Unexpected Cosmos Graph Evolution schema_version: ${payload.schema_version}`
            );
          }

          if (payload.status !== "graph_evolution_planned") {
            errors.push(
              `Cosmos Graph Evolution failed: ${payload.status}`
            );
          }

          const state = payload.evolution_state || {};
          const plans = payload.evolution_plans || [];
          const executionQueue = payload.evolution_execution_queue || [];
          const conflictQueue = payload.conflict_review_queue || [];

          if (!Array.isArray(plans) || plans.length !== 5) {
            errors.push(
              `Controlled Graph Evolution expected 5 plans; got ${plans.length}`
            );
          }

          if (Number(state.planned_count) !== plans.length) {
            errors.push(
              "Cosmos Graph Evolution planned_count mismatch"
            );
          }

          if (Number(state.graph_mutation_count) !== 0) {
            errors.push(
              "Cosmos Graph Evolution planning layer must not mutate graph"
            );
          }

          const actionByAdmission = new Map(
            plans.map(row => [
              row.knowledge_admission_id,
              row.evolution_action
            ])
          );

          const expected = new Map([
            ["knowledge_admission_reinforce", "reinforce_existing"],
            ["knowledge_admission_qualify", "qualify_existing"],
            ["knowledge_admission_conflict", "conflict_review_required"],
            ["knowledge_admission_supersede", "supersede_existing"],
            ["knowledge_admission_create", "create_new"]
          ]);

          for (const [admissionId, action] of expected) {
            if (actionByAdmission.get(admissionId) !== action) {
              errors.push(
                `Graph Evolution action mismatch for ${admissionId}: expected ${action}, got ${actionByAdmission.get(admissionId)}`
              );
            }
          }

          const reinforce = plans.find(
            row =>
              row.knowledge_admission_id ===
              "knowledge_admission_reinforce"
          );

          if (!reinforce ||
              reinforce.current_active_records?.length !== 1 ||
              Number(reinforce.incoming?.confidence_score) !== 82 ||
              reinforce.execution_contract?.graph_mutation_performed !== false ||
              reinforce.execution_contract?.preserve_prior_record_history !== true ||
              reinforce.execution_contract?.preserve_prior_audit_history !== true) {
            errors.push(
              "Reinforce-existing plan contract invalid"
            );
          }

          const qualify = plans.find(
            row =>
              row.knowledge_admission_id ===
              "knowledge_admission_qualify"
          );

          if (!qualify ||
              qualify.incoming?.contradiction_present !== true ||
              qualify.evolution_action !== "qualify_existing") {
            errors.push(
              "Qualify-existing contradiction handling invalid"
            );
          }

          const conflict = plans.find(
            row =>
              row.knowledge_admission_id ===
              "knowledge_admission_conflict"
          );

          if (!conflict ||
              conflict.evolution_action !==
                "conflict_review_required" ||
              conflict.execution_contract?.conflict_must_not_be_auto_resolved !== true ||
              conflict.execution_contract?.requires_separate_evolution_executor !== true) {
            errors.push(
              "Conflict-review boundary invalid"
            );
          }

          const supersede = plans.find(
            row =>
              row.knowledge_admission_id ===
              "knowledge_admission_supersede"
          );

          if (!supersede ||
              supersede.evolution_action !== "supersede_existing" ||
              supersede.execution_contract?.deactivate_prior_record_before_supersession !== true ||
              supersede.execution_contract?.preserve_prior_record_history !== true ||
              supersede.execution_contract?.preserve_prior_audit_history !== true ||
              supersede.execution_contract?.reversible !== true) {
            errors.push(
              "Supersede-existing plan contract invalid"
            );
          }

          const create = plans.find(
            row =>
              row.knowledge_admission_id ===
              "knowledge_admission_create"
          );

          if (!create ||
              create.evolution_action !== "create_new" ||
              create.current_active_records?.length !== 0) {
            errors.push(
              "Create-new plan contract invalid"
            );
          }

          if (!Array.isArray(executionQueue) ||
              executionQueue.length !== 4) {
            errors.push(
              `Controlled Graph Evolution expected 4 executable actions; got ${executionQueue.length}`
            );
          }

          if (!Array.isArray(conflictQueue) ||
              conflictQueue.length !== 1 ||
              conflictQueue[0]?.knowledge_admission_id !==
                "knowledge_admission_conflict") {
            errors.push(
              "Graph Evolution conflict review queue invalid"
            );
          }

          for (let i = 0; i < executionQueue.length; i += 1) {
            const row = executionQueue[i];

            if (Number(row.evolution_rank) !== i + 1) {
              errors.push(
                `Graph Evolution execution queue rank invalid at index ${i}`
              );
            }

            if (row.execution_status !== "not_started") {
              errors.push(
                `Graph Evolution execution queue ${row.graph_evolution_id || "(unknown)"} crossed execution boundary`
              );
            }
          }

          const safeguards = payload.safeguards || {};

          if (safeguards.performs_external_search !== false ||
              safeguards.calls_openai_or_external_api !== false ||
              safeguards.mutates_graph !== false ||
              safeguards.deletes_historical_knowledge !== false ||
              safeguards.preserves_existing_records !== true ||
              safeguards.preserves_audit_history !== true ||
              safeguards.conflicting_polarity_requires_review !== true ||
              safeguards.materially_equivalent_knowledge_not_duplicated !== true ||
              safeguards.supersession_requires_explicit_execution !== true ||
              safeguards.reversibility_required !== true) {
            errors.push(
              "Cosmos Graph Evolution safeguards invalid"
            );
          }

          if (errors.length) {
            console.error(
              "\nCosmos Graph Evolution v0.1 preflight errors:"
            );
            for (const error of errors) {
              console.error(`- ${error}`);
            }
            process.exit(1);
          }

          console.log("");
          console.log("Cosmos Graph Evolution v0.1 isolated test passed.");
          console.log(`Status:            ${payload.status}`);
          console.log(`Plans:             ${plans.length}`);
          console.log(
            `Create new:        ${state.by_action?.create_new || 0}`
          );
          console.log(
            `Reinforce:         ${state.by_action?.reinforce_existing || 0}`
          );
          console.log(
            `Qualify:           ${state.by_action?.qualify_existing || 0}`
          );
          console.log(
            `Supersede:         ${state.by_action?.supersede_existing || 0}`
          );
          console.log(
            `Conflict review:   ${state.by_action?.conflict_review_required || 0}`
          );
          console.log(`Execution queue:   ${executionQueue.length}`);
          console.log(`Conflict queue:    ${conflictQueue.length}`);
          console.log("Graph mutations:     0");
          console.log(
            "History preservation, explicit supersession, contradiction review and no-mutation safeguards passed."
          );
          console.log(
            "Repository files were not modified by the isolated test."
          );
          NODE


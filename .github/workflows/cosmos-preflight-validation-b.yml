              safeguards.preserves_confidence !== true ||
              safeguards.preserves_epistemic_status !== true) {
            errors.push(
              "Temporal Knowledge safeguards invalid"
            );
          }

          if (errors.length) {
            console.error(
              "\nCosmos Temporal Knowledge v0.1 preflight errors:"
            );
            for (const error of errors) {
              console.error(`- ${error}`);
            }

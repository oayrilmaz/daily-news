          console.log(`Status:              ${payload.status}`);
          console.log(`Why-now events:      ${whyNow.activation_event_count}`);
          console.log(`Upstream drivers:    ${upstream.length}`);
          console.log(`Direct effects:      ${direct.length}`);
          console.log(`Second-order:        ${second.length}`);
          console.log(`Third-order:         ${third.length}`);
          console.log(`Emerging effects:    ${emerging.length}`);
          console.log(`Butterfly edges:     ${downstream.length}`);
          console.log(`Candidate signals:   ${candidates.length}`);
          console.log(
            "Why-now separation, causal ordering, confidence decay, evidence lineage and candidate-only butterfly safeguards passed."
          );
          console.log(
            "Repository files were not modified by the isolated test."
          );
          NODE


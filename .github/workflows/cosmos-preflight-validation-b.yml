          );
          const afterIntegrity = read(
            "knowledge/cosmos/post-reversal-integrity-v0.1.json"
          );

          const errors = [];

          if (beforeIntegrity.status !== "graph_integrity_passed" ||
              Number(beforeIntegrity.integrity_state?.error_count) !== 0) {
            errors.push(
              "Pre-reversal graph must pass Graph Integrity"
            );
          }

          if (report.schema_version !== "0.1" ||

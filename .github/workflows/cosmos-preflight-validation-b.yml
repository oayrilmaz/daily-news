          if(!String(r.answer_preview||"").includes("Power Transformers")){
            fail("Direct HV substation equipment answer is missing expected equipment");
          }
          if(Number(r.answer_item_count)!==9){
            fail(`Expected 9 structured answer items; got ${r.answer_item_count}`);
          }
          if(Number(r.intelligence_count)!==3){
            fail(`Expected 3 related intelligence items; got ${r.intelligence_count}`);
          }
          if(Number(r.dated_items)!==2 || Number(r.undated_items)!==1){
            fail(`Unexpected date preservation result: dated=${r.dated_items}, undated=${r.undated_items}`);
          }

          const c=r.contracts||{};
          if(
            c.question_not_replaced_by_nearest_graph_object!==true ||
            c.direct_answer_built_before_exploration!==true ||
            c.enumeration_questions_return_structured_items!==true ||
            c.evidence_context_attached_after_answer!==true ||
            c.dates_preserved_when_available!==true ||
            c.missing_dates_explicit!==true ||
            c.follow_the_ripple_preserved!==true ||
            c.unsupported_answer_not_invented!==true
          ) fail("Cosmos Question Understanding / Answer Resolver contracts failed");

          const s=r.safeguards||{};
          if(
            s.performs_external_search!==false ||
            s.calls_openai_or_external_api!==false ||
            s.mutates_graph!==false ||
            s.invents_equipment_list!==false ||
            s.invents_missing_dates!==false ||
            s.promotes_scenario_to_fact!==false
          ) fail("Cosmos Question Understanding / Answer Resolver safeguards failed");
          NODE

      - name: Check Cosmos Semantic Knowledge Completion v0.1 source
        run: |
          test -f scripts/cosmos_semantic_knowledge_completion_v0.1.mjs
          test -f scripts/cosmos_semantic_knowledge_completion_test_v0.1.mjs
          node --check scripts/cosmos_semantic_knowledge_completion_v0.1.mjs
          node --check scripts/cosmos_semantic_knowledge_completion_test_v0.1.mjs

      - name: Test Cosmos Semantic Knowledge Completion v0.1
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          node scripts/cosmos_semantic_knowledge_completion_test_v0.1.mjs \
            --engine scripts/cosmos_semantic_knowledge_completion_v0.1.mjs \
            > "$TMP_DIR/result.json"

          node - "$TMP_DIR/result.json" <<'NODE'
          const fs=require("fs");
          const r=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          const fail=m=>{console.error(m);process.exit(1)};

          if(r.status!=="cosmos_semantic_knowledge_completion_test_passed"){
            fail("Cosmos Semantic Knowledge Completion test failed");
          }

          if(r.missing_case?.knowledge_status!=="insufficient"){
            fail(`Expected missing case to be insufficient; got ${r.missing_case?.knowledge_status}`);
          }

          if(Number(r.missing_case?.supported_members)!==0){
            fail("Missing case should not invent supported equipment members");
          }

          if(Number(r.missing_case?.completion_task_count)!==4){
            fail(`Expected 4 completion tasks; got ${r.missing_case?.completion_task_count}`);
          }

          if(r.missing_case?.broad_projection_suppressed!==true){
            fail("Broad projection must be suppressed while the answer is unsupported");
          }

          if(r.supported_case?.knowledge_status!=="sufficient"){
            fail("Supported case should be sufficient");
          }

          const members=r.supported_case?.supported_members||[];
          if(!members.includes("Power Transformers") || !members.includes("Circuit Breakers")){
            fail("Supported case must preserve validated equipment relationships");
          }

          if(r.supported_case?.answer_ready!==true){
            fail("Supported case must be answer-ready");
          }

          if(r.supported_case?.current_intelligence_allowed!==true){
            fail("Current intelligence should be allowed only after direct-answer support");
          }

          if(!Object.values(r.contracts||{}).every(Boolean)){
            fail("Semantic Knowledge Completion contracts failed");
          }

          if(!Object.values(r.safeguards||{}).every(v=>v===false)){
            fail("Semantic Knowledge Completion safeguards failed");
          }

          console.log("Cosmos Semantic Knowledge Completion v0.1 passed.");
          NODE


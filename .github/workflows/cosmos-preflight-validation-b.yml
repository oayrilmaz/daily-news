              before.knowledge_records.length !== 1 ||
              !Array.isArray(after.knowledge_records) ||
              after.knowledge_records.length !== 1) {
            errors.push(
              "Graph Reversal must preserve exactly one historical graph record"
            );
          } else {
            const prior = before.knowledge_records[0];
            const current = after.knowledge_records[0];

            if (prior.graph_record_id !== current.graph_record_id ||
                prior.knowledge_admission_id !== current.knowledge_admission_id ||
                prior.validation_target_id !== current.validation_target_id) {
              errors.push(
                "Graph Reversal changed graph-record identity/lineage"
              );
            }

            if (current.active !== false ||
                !current.deactivated_at ||
                current.deactivation?.operation !==
                  "deactivate_graph_record" ||
                current.deactivation?.reversible_history_preserved !== true) {
              errors.push(
                "Graph Reversal did not safely deactivate the record"
              );
            }

            if (Number(current.confidence_score) !== 76 ||
                current.validation_disposition !==
                  "partially_supported" ||
                current.qualification?.contradiction_present !== true ||
                current.qualification?.must_preserve_contradiction !== true ||
                !Array.isArray(current.evidence_record_ids) ||
                current.evidence_record_ids.length !== 3) {
              errors.push(
                "Graph Reversal lost confidence, qualification, contradiction or evidence lineage"
              );
            }
          }

          if (!Array.isArray(before.audit_log) ||
              before.audit_log.length !== 1 ||
              !Array.isArray(after.audit_log) ||
              after.audit_log.length !== 2) {
            errors.push(
              "Graph Reversal must preserve creation audit and append exactly one reversal audit"
            );
          } else {
            const creationAudit = before.audit_log[0];
            const preservedCreation = after.audit_log.find(
              row => row.audit_id === creationAudit.audit_id
            );
            const reversalAudit = after.audit_log.find(
              row => row.operation === "deactivate_graph_record"
            );

            if (!preservedCreation) {
              errors.push(
                "Original creation audit was not preserved"
              );
            }

            if (!reversalAudit ||
                reversalAudit.prior_active_state !== true ||

            if (Number(candidate.causal_depth) < 2) {
              errors.push(
                `Potential new signal ${candidate.candidate_signal_id || "(unknown)"} is too close to focal signal`
              );
            }
          }

          const contract = payload.narrative_contract || {};

          if (contract.machine_readable_only !== true ||
              contract.article_prose_generated !== false ||
              contract.causal_direction_preserved !== true ||
              contract.causal_depth_preserved !== true ||
              contract.time_horizon_preserved !== true ||
              contract.evidence_status_preserved !== true ||
              contract.evidence_lineage_preserved !== true ||
              contract.confidence_degrades_with_distance !== true ||
              contract.why_now_separated_from_root_cause !== true ||
              contract.possibility_never_silently_promoted_to_fact !== true) {
            errors.push(
              "Cosmos Causal Narrative narrative contract invalid"
            );
          }

          const safeguards = payload.safeguards || {};

          if (safeguards.performs_external_search !== false ||
              safeguards.calls_openai_or_external_api !== false ||
              safeguards.writes_to_knowledge_graph !== false ||
              safeguards.mutates_input_graph !== false ||

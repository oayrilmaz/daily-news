name: Cosmos Preflight - Validation B

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync With Latest Branch Tip
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          echo "Workspace synchronized to origin/${GITHUB_REF_NAME}."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cosmos Source Files
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "scripts/generate_ai_news.js"
            "scripts/resolve_entities.js"
            "scripts/update_entity_lifecycle.js"
            "scripts/normalize_map_signals.cjs"
            "scripts/validate_intelligence.cjs"
            "scripts/cosmos_state_delta.cjs"
            "scripts/cosmos_impact_engine.cjs"
            "scripts/cosmos_pattern_engine.cjs"
            "scripts/cosmos_emergence_engine.cjs"
            "scripts/cosmos_state_builder.cjs"
            "scripts/cosmos_core.cjs"
            "scripts/cosmos_attention.cjs"
            "scripts/cosmos_consequence.cjs"
            "scripts/cosmos_discovery.cjs"
            "scripts/cosmos_acquisition.cjs"
            "scripts/cosmos_acquisition_applicability.cjs"
            "scripts/cosmos_decomposition.cjs"
            "scripts/cosmos_candidate_validation.cjs"
            "scripts/cosmos_evidence_strategy.cjs"
            "scripts/cosmos_evidence_executor.cjs"
            "scripts/cosmos_evidence_validator.cjs"
            "scripts/cosmos_knowledge_admission.cjs"
            "scripts/cosmos_graph_writer.cjs"
            "scripts/cosmos_graph_integrity.cjs"
            "scripts/cosmos_graph_reversal.cjs"
            "scripts/cosmos_causal_narrative.cjs"
            "scripts/cosmos_graph_evolution.cjs"
            "scripts/cosmos_temporal_knowledge.cjs"
            "scripts/cosmos_first_party_identity.cjs"
            "scripts/backfill_history_from_articles.js"
            "package.json"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required file: $file"
              exit 1
            fi
            echo "OK: $file"
          done

      - name: Check JavaScript Syntax
        run: |
          set -e
          node --check scripts/generate_ai_news.js
          node --check scripts/resolve_entities.js
          node --check scripts/update_entity_lifecycle.js
          node --check scripts/normalize_map_signals.cjs
          node --check scripts/validate_intelligence.cjs
          node --check scripts/cosmos_state_delta.cjs
          node --check scripts/cosmos_impact_engine.cjs
          node --check scripts/cosmos_pattern_engine.cjs
          node --check scripts/cosmos_emergence_engine.cjs
          node --check scripts/cosmos_state_builder.cjs
          node --check scripts/cosmos_core.cjs
          node --check scripts/cosmos_attention.cjs
          node --check scripts/cosmos_consequence.cjs
          node --check scripts/cosmos_discovery.cjs
          node --check scripts/cosmos_acquisition.cjs
          node --check scripts/cosmos_acquisition_applicability.cjs
          node --check scripts/cosmos_decomposition.cjs
          node --check scripts/cosmos_candidate_validation.cjs
          node --check scripts/cosmos_evidence_strategy.cjs
          node --check scripts/cosmos_evidence_executor.cjs
          node --check scripts/cosmos_evidence_validator.cjs
          node --check scripts/cosmos_knowledge_admission.cjs
          node --check scripts/cosmos_graph_writer.cjs
          node --check scripts/cosmos_graph_integrity.cjs
          node --check scripts/cosmos_graph_reversal.cjs
          node --check scripts/cosmos_causal_narrative.cjs
          node --check scripts/cosmos_graph_evolution.cjs
          node --check scripts/cosmos_temporal_knowledge.cjs
          node --check scripts/cosmos_first_party_identity.cjs
          node --check scripts/backfill_history_from_articles.js
          echo "All Cosmos JavaScript files passed syntax validation."

      - name: Verify package.json
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          if (!pkg.scripts || !pkg.scripts["generate:ai"]) {
            throw new Error(
              'package.json is missing scripts["generate:ai"].'
            );
          }

          if (!pkg.dependencies || !pkg.dependencies.openai) {
            throw new Error(
              'package.json is missing the "openai" dependency.'
            );
          }

          console.log("generate:ai:", pkg.scripts["generate:ai"]);
          console.log("OpenAI dependency:", pkg.dependencies.openai);
          console.log("package.json validation passed.");
          NODE

      - name: Validate Existing JSON Files
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          const required = [
            "briefs/daily-ai.json",
            "briefs/map-signals.json",
            "briefs/trends.json",
            "briefs/outlook.json",
            "knowledge/developments.json",
            "knowledge/entities.json",
            "knowledge/relationships.json",
            "knowledge/timeline-events.json",
            "knowledge/entity-lifecycle.json"
          ];

          let failed = false;

          for (const file of required) {
            if (!fs.existsSync(file)) {
              console.error(`ERROR: Missing ${file}`);
              failed = true;
              continue;
            }

            try {
              JSON.parse(fs.readFileSync(file, "utf8"));
              console.log(`OK JSON: ${file}`);
            } catch (error) {
              console.error(
                `ERROR: Invalid JSON in ${file}: ${error.message}`
              );
              failed = true;
            }
          }

          if (failed) process.exit(1);

          console.log(
            "All currently committed critical JSON files parse correctly."
          );
          NODE

      - name: Verify Current Knowledge Structure
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          function read(file) {
            return JSON.parse(fs.readFileSync(file, "utf8"));
          }

          const daily = read("briefs/daily-ai.json");
          const map = read("briefs/map-signals.json");
          const developments = read("knowledge/developments.json");
          const entities = read("knowledge/entities.json");
          const relationships = read("knowledge/relationships.json");
          const timeline = read("knowledge/timeline-events.json");
          const lifecycle = read("knowledge/entity-lifecycle.json");

          const errors = [];

          if (!Array.isArray(daily.items)) {
            errors.push("briefs/daily-ai.json: items[] missing");
          }

          if (!Array.isArray(map.signals)) {
            errors.push("briefs/map-signals.json: signals[] missing");
          }

          if (!Array.isArray(developments.developments)) {
            errors.push(
              "knowledge/developments.json: developments[] missing"
            );
          }

          if (!Array.isArray(entities.entities)) {
            errors.push("knowledge/entities.json: entities[] missing");
          }

          if (!Array.isArray(relationships.relationships)) {
            errors.push(
              "knowledge/relationships.json: relationships[] missing"
            );
          }

          if (!Array.isArray(timeline.events)) {
            errors.push(
              "knowledge/timeline-events.json: events[] missing"
            );
          }

          if (
            !lifecycle ||
            typeof lifecycle !== "object" ||
            !lifecycle.rankings
          ) {
            errors.push(
              "knowledge/entity-lifecycle.json: lifecycle structure missing"
            );
          }

          if (errors.length) {
            console.error("\nCompatibility errors:");
            for (const error of errors) {
              console.error(`- ${error}`);
            }
            process.exit(1);
          }

          console.log("\nCurrent committed data structure:");
          console.log(`Daily items:      ${daily.items.length}`);
          console.log(`Map signals:      ${map.signals.length}`);
          console.log(`Developments:     ${developments.developments.length}`);
          console.log(`Entities:         ${entities.entities.length}`);
          console.log(`Relationships:    ${relationships.relationships.length}`);
          console.log(`Timeline events:  ${timeline.events.length}`);

          if (Array.isArray(lifecycle.entities)) {
            console.log(`Lifecycle registry: ${lifecycle.entities.length}`);
          } else {
            console.log(
              "Lifecycle registry: legacy format currently committed " +
              "(File 5 will create lifecycle.entities[] on the next production run)"
            );
          }

          console.log("\nCosmos source/data compatibility checks passed.");
          NODE

      - name: Test Cosmos Knowledge Admission v0.1 In Isolated Workspace
        shell: bash
        run: |
          set -euo pipefail

          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEST_DIR"' EXIT

          mkdir -p "$TEST_DIR/scripts"
          mkdir -p "$TEST_DIR/knowledge/cosmos"

          cp scripts/cosmos_knowledge_admission.cjs \
            "$TEST_DIR/scripts/cosmos_knowledge_admission.cjs"

          TEST_DIR="$TEST_DIR" node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const root = process.env.TEST_DIR;

          const partiallySupported = {
            evidence_validation_id: "evidence_validation_5ca25c15",
            evidence_task_id: "evidence_task_115f3b3e",
            validation_target_id: "validation_3642f09d",
            evidence_record_ids: [
              "evidence_d0143201",
              "evidence_6cccfc61",
              "evidence_65ed10af"
            ],
            evidence_record_count: 3,
            disposition: "partially_supported",
            confidence_score: 76,
            confidence_band: "high",
            rationale:
              "Supporting evidence outweighs contradiction, but contradiction remains material and prevents an unqualified supported conclusion.",
            evidence_balance: {
              weighted_support: 196,
              weighted_contradiction: 82,
              independent_source_groups: 3,
              direct_high_authority_records: 2
            },
            sufficiency_observation: {
              total_source_threshold_met: true,
              independent_source_threshold_met: true,
              direct_primary_preference_met: true,
              contradiction_search_observed: true
            },
            record_assessments: [],
            validation_status: "completed",
            knowledge_admission_status: "not_started",
            executable_for_knowledge_admission: true,
            epistemic_rule:
              "Validation may classify evidence, but only Knowledge Admission may create or update persistent Cosmos knowledge."
          };

          const insufficientIds = [
            ["evidence_validation_3bf0d71e", "evidence_task_a6c1f318", "validation_787b6815"],
            ["evidence_validation_64afcb5a", "evidence_task_3e80975d", "validation_83169e60"],
            ["evidence_validation_932cf23f", "evidence_task_64771149", "validation_4600b8de"],
            ["evidence_validation_e319e364", "evidence_task_2f80881f", "validation_224b2a14"],
            ["evidence_validation_eb71dfb6", "evidence_task_e1e94d3d", "validation_e81fcda8"],
            ["evidence_validation_60545a0e", "evidence_task_39c6b18f", "validation_04b40a48"]
          ];

          const insufficient = insufficientIds.map(([validationId, taskId, targetId]) => ({
            evidence_validation_id: validationId,
            evidence_task_id: taskId,
            validation_target_id: targetId,
            evidence_record_ids: [],
            evidence_record_count: 0,
            disposition: "insufficient_evidence",
            confidence_score: 0,
            confidence_band: "very_low",
            rationale: "No evidence records were collected for this target.",
            evidence_balance: {
              weighted_support: 0,
              weighted_contradiction: 0,
              independent_source_groups: 0,
              direct_high_authority_records: 0
            },
            sufficiency_observation: {
              total_source_threshold_met: false,
              independent_source_threshold_met: false,
              direct_primary_preference_met: false,
              contradiction_search_observed: false
            },
            record_assessments: [],
            validation_status: "completed",
            knowledge_admission_status: "not_started",
            executable_for_knowledge_admission: false,
            epistemic_rule:
              "Validation may classify evidence, but only Knowledge Admission may create or update persistent Cosmos knowledge."
          }));

          const fixture = {
            schema_version: "0.1",
            generated_at: new Date().toISOString(),
            status: "evidence_validation_resolved",
            source_evidence_executor: {
              schema_version: "0.1",
              generated_at: new Date().toISOString(),
              status: "evidence_execution_normalized"
            },
            validation_state: {
              validation_target_count: 7,
              completed_validation_count: 7,
              knowledge_admission_count: 0,
              by_disposition: {
                insufficient_evidence: 6,
                partially_supported: 1
              },
              conceptual_distance_limit: null,
              continuation_possible: true,
              principle:
                "Cosmos may classify what the collected evidence justifies, but validation is not permanent knowledge admission."
            },
            validations: [
              insufficient[0],
              insufficient[1],
              partiallySupported,
              insufficient[2],
              insufficient[3],
              insufficient[4],
              insufficient[5]
            ],
            knowledge_admission_queue: [
              {
                admission_rank: 1,
                evidence_validation_id: partiallySupported.evidence_validation_id,
                evidence_task_id: partiallySupported.evidence_task_id,
                validation_target_id: partiallySupported.validation_target_id,
                disposition: "partially_supported",
                confidence_score: 76,
                confidence_band: "high",
                evidence_record_ids: partiallySupported.evidence_record_ids,
                admission_status: "not_started"
              }
            ]
          };

          fs.writeFileSync(
            path.join(root, "evidence-validator-fixture-v0.1.json"),
            JSON.stringify(fixture, null, 2)
          );
          NODE

          (
            cd "$TEST_DIR"
            node scripts/cosmos_knowledge_admission.cjs \
              --input evidence-validator-fixture-v0.1.json \
              --out knowledge/cosmos/knowledge-admission-test-v0.1.json
          )

          TEST_DIR="$TEST_DIR" node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const root = process.env.TEST_DIR;
          const file = path.join(
            root,
            "knowledge/cosmos/knowledge-admission-test-v0.1.json"
          );

          if (!fs.existsSync(file)) {
            throw new Error(
              "Cosmos Knowledge Admission did not create knowledge-admission-test-v0.1.json"
            );
          }

          const payload = JSON.parse(fs.readFileSync(file, "utf8"));
          const errors = [];

          if (payload.schema_version !== "0.1") {
            errors.push(
              `Unexpected Knowledge Admission schema_version: ${payload.schema_version}`
            );
          }

          if (payload.status !== "knowledge_admission_resolved") {
            errors.push(
              `Cosmos Knowledge Admission failed: ${payload.status}`
            );
          }

          if (payload.source_evidence_validator?.schema_version !== "0.1" ||
              payload.source_evidence_validator?.status !== "evidence_validation_resolved") {
            errors.push(
              "Cosmos Knowledge Admission must consume Evidence Validator v0.1"
            );
          }

          const state = payload.admission_state || {};
          const admissions = payload.admissions || [];
          const graphQueue = payload.graph_write_queue || [];

          if (Number(state.validation_count) !== 7 ||
              Number(state.reviewed_count) !== 7 ||
              Number(state.validator_queue_count) !== 1) {
            errors.push(
              `Knowledge Admission counts invalid: validations=${state.validation_count}, reviewed=${state.reviewed_count}, validator_queue=${state.validator_queue_count}`
            );
          }

          if (Number(state.graph_write_eligible_count) !== 1) {
            errors.push(
              `Controlled Knowledge Admission expected exactly 1 graph-write-eligible item; got ${state.graph_write_eligible_count}`
            );
          }

          if (Number(state.graph_write_count) !== 0) {
            errors.push(
              "Knowledge Admission v0.1 must not perform graph writes"
            );
          }

          if (state.conceptual_distance_limit !== null ||
              state.continuation_possible !== true) {
            errors.push(
              "Knowledge Admission did not preserve unlimited continuation"
            );
          }

          if (!Array.isArray(admissions) || admissions.length !== 7) {
            errors.push(
              `Controlled Knowledge Admission expected 7 admissions; got ${admissions.length}`
            );
          }

          const qualified = admissions.filter(
            row => row.decision === "admit_with_qualification"
          );

          const rejected = admissions.filter(
            row => row.decision === "reject_for_now"
          );

          if (qualified.length !== 1) {
            errors.push(
              `Expected exactly 1 admit_with_qualification; got ${qualified.length}`
            );
          }

          if (rejected.length !== 6) {
            errors.push(
              `Expected exactly 6 reject_for_now decisions; got ${rejected.length}`
            );
          }

          if (Number(state.by_decision?.admit_with_qualification || 0) !== 1 ||
              Number(state.by_decision?.reject_for_now || 0) !== 6) {
            errors.push(
              "Knowledge Admission decision summary invalid"
            );
          }

          if (qualified.length === 1) {
            const row = qualified[0];

            if (row.validation_disposition !== "partially_supported" ||
                Number(row.confidence_score) !== 76 ||
                row.confidence_band !== "high") {
              errors.push(
                "Qualified admission lost Evidence Validator disposition/confidence"
              );
            }

            if (row.admitted_claim_class !==
                  "validated_qualified_relationship" ||
                row.persistence_level !==
                  "persistent_qualified_knowledge") {
              errors.push(
                "Qualified admission claim/persistence class invalid"
              );
            }

            if (row.qualification?.contradiction_present !== true ||
                row.qualification?.must_preserve_contradiction !== true ||
                row.qualification?.confidence_must_be_preserved !== true ||
                row.qualification?.source_lineage_must_be_preserved !== true ||
                row.qualification?.temporal_scope_must_be_preserved !== true ||
                row.qualification?.geography_scope_must_be_preserved !== true) {
              errors.push(
                "Qualified admission failed contradiction/scope preservation contract"
              );
            }

            if (!Array.isArray(row.evidence_record_ids) ||
                row.evidence_record_ids.length !== 3) {
              errors.push(
                "Qualified admission did not preserve all evidence-record lineage"
              );
            }

            if (row.knowledge_write_contract?.direct_graph_write_performed !== false ||
                row.knowledge_write_contract?.requires_separate_graph_writer !== true ||
                row.knowledge_write_contract?.preserve_validation_disposition !== true ||
                row.knowledge_write_contract?.preserve_confidence !== true ||
                row.knowledge_write_contract?.preserve_evidence_lineage !== true ||
                row.knowledge_write_contract?.preserve_contradiction !== true ||
                row.knowledge_write_contract?.reversible !== true) {
              errors.push(
                "Qualified admission graph-write contract invalid"
              );
            }

            if (row.graph_write_eligibility !== true ||
                row.graph_write_status !== "not_started") {
              errors.push(
                "Qualified admission graph-write boundary invalid"
              );
            }
          }

          for (const row of rejected) {
            if (row.validation_disposition !== "insufficient_evidence" ||
                row.persistence_level !== "none" ||
                row.graph_write_eligibility !== false ||
                row.graph_write_status !== "not_started") {
              errors.push(
                `Insufficient-evidence admission ${row.knowledge_admission_id || "(unknown)"} improperly became graph eligible`
              );
            }
          }

          if (!Array.isArray(graphQueue) || graphQueue.length !== 1) {
            errors.push(
              `Controlled Knowledge Admission expected 1 graph_write_queue item; got ${graphQueue.length}`
            );
          } else {
            const row = graphQueue[0];

            if (row.graph_write_rank !== 1 ||
                row.admitted_claim_class !== "validated_qualified_relationship" ||
                row.validation_disposition !== "partially_supported" ||
                Number(row.confidence_score) !== 76 ||
                row.graph_write_status !== "not_started" ||
                !Array.isArray(row.evidence_record_ids) ||
                row.evidence_record_ids.length !== 3) {
              errors.push(
                "Knowledge Admission graph_write_queue item invalid"
              );
            }
          }

          const safeguards = payload.safeguards || {};

          if (safeguards.performs_external_search !== false ||
              safeguards.calls_openai_or_external_api !== false ||
              safeguards.writes_to_knowledge_graph !== false ||
              safeguards.admission_is_not_graph_mutation !== true ||
              safeguards.insufficient_or_unresolved_not_admitted !== true ||
              safeguards.partially_supported_requires_qualification !== true ||
              safeguards.contradictory_evidence_preserved !== true ||
              safeguards.confidence_preserved !== true ||
              safeguards.source_lineage_preserved !== true ||
              safeguards.graph_writes_are_reversible !== true ||
              safeguards.separate_graph_writer_required !== true ||
              safeguards.unlimited_conceptual_continuation_preserved !== true) {
            errors.push(
              "Cosmos Knowledge Admission safeguards invalid"
            );
          }

          if (errors.length) {
            console.error("\nCosmos Knowledge Admission v0.1 preflight errors:");
            for (const error of errors) {
              console.error(`- ${error}`);
            }
            process.exit(1);
          }

          console.log("");
          console.log("Cosmos Knowledge Admission v0.1 isolated test passed.");
          console.log(`Status:                    ${payload.status}`);
          console.log(`Validations reviewed:      ${state.reviewed_count}`);
          console.log(`Admit with qualification:  ${state.by_decision?.admit_with_qualification || 0}`);
          console.log(`Reject for now:            ${state.by_decision?.reject_for_now || 0}`);
          console.log(`Graph-write eligible:      ${state.graph_write_eligible_count}`);
          console.log(`Graph writes performed:    ${state.graph_write_count}`);
          console.log(
            "Qualified admission, contradiction/confidence/lineage preservation, insufficient-evidence exclusion, reversible graph-write contract and separate-writer safeguards passed."
          );
          console.log(
            "Repository files were not modified by the isolated test."
          );
          NODE

      - name: Test Cosmos Graph Writer v0.1 In Isolated Workspace
        shell: bash
        run: |
          set -euo pipefail

          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEST_DIR"' EXIT

          mkdir -p "$TEST_DIR/scripts"
          mkdir -p "$TEST_DIR/knowledge/cosmos"

          cp scripts/cosmos_graph_writer.cjs \
            "$TEST_DIR/scripts/cosmos_graph_writer.cjs"

          TEST_DIR="$TEST_DIR" node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const root = process.env.TEST_DIR;

          const qualified = {
            knowledge_admission_id: "knowledge_admission_graph_writer_fixture_qualified",
            evidence_validation_id: "evidence_validation_5ca25c15",
            evidence_task_id: "evidence_task_115f3b3e",
            validation_target_id: "validation_3642f09d",
            admitted_claim_class: "validated_qualified_relationship",
            validation_disposition: "partially_supported",
            decision: "admit_with_qualification",
            confidence_score: 76,
            confidence_band: "high",
            persistence_level: "persistent_qualified_knowledge",
            evidence_record_ids: [
              "evidence_d0143201",
              "evidence_6cccfc61",
              "evidence_65ed10af"
            ],
            qualification: {
              contradiction_present: true,
              must_preserve_contradiction: true,
              confidence_must_be_preserved: true,
              source_lineage_must_be_preserved: true,
              temporal_scope_must_be_preserved: true,
              geography_scope_must_be_preserved: true
            },
            graph_write_eligibility: true,
            graph_write_status: "not_started"
          };

          const rejected = {
            knowledge_admission_id: "knowledge_admission_graph_writer_fixture_rejected",
            evidence_validation_id: "evidence_validation_rejected_fixture",
            evidence_task_id: "evidence_task_rejected_fixture",
            validation_target_id: "validation_rejected_fixture",
            admitted_claim_class: null,
            validation_disposition: "insufficient_evidence",
            decision: "reject_for_now",
            confidence_score: 0,
            confidence_band: "very_low",
            persistence_level: "none",
            evidence_record_ids: [],
            qualification: {
              contradiction_present: false,
              must_preserve_contradiction: false
            },
            graph_write_eligibility: false,
            graph_write_status: "not_started"
          };

          const admission = {
            schema_version: "0.1",
            generated_at: new Date().toISOString(),
            status: "knowledge_admission_resolved",
            admission_state: {
              validation_count: 2,
              reviewed_count: 2,
              graph_write_eligible_count: 1,
              graph_write_count: 0,
              conceptual_distance_limit: null,
              continuation_possible: true
            },
            admissions: [qualified, rejected],
            graph_write_queue: [
              {
                ...qualified,
                graph_write_rank: 1
              },
              {
                ...rejected,
                graph_write_rank: 2
              }
            ]
          };

          const emptyGraph = {
            schema_version: "0.1",
            generated_at: null,
            status: "cosmos_graph_snapshot",
            knowledge_records: [],
            audit_log: []
          };

          fs.writeFileSync(
            path.join(root, "knowledge-admission-graph-writer-fixture-v0.1.json"),
            JSON.stringify(admission, null, 2)
          );

          fs.writeFileSync(
            path.join(root, "graph-before-v0.1.json"),
            JSON.stringify(emptyGraph, null, 2)
          );
          NODE

          BEFORE_HASH="$(sha256sum "$TEST_DIR/graph-before-v0.1.json" | awk '{print $1}')"

          (
            cd "$TEST_DIR"
            node scripts/cosmos_graph_writer.cjs \
              --admission knowledge-admission-graph-writer-fixture-v0.1.json \
              --graph graph-before-v0.1.json \
              --out knowledge/cosmos/graph-after-first-v0.1.json \
              --report knowledge/cosmos/graph-write-first-report-v0.1.json
          )

          AFTER_INPUT_HASH="$(sha256sum "$TEST_DIR/graph-before-v0.1.json" | awk '{print $1}')"

          if [ "$BEFORE_HASH" != "$AFTER_INPUT_HASH" ]; then
            echo "ERROR: Cosmos Graph Writer mutated the input graph in place."
            exit 1
          fi

          (
            cd "$TEST_DIR"
            node scripts/cosmos_graph_writer.cjs \
              --admission knowledge-admission-graph-writer-fixture-v0.1.json \
              --graph knowledge/cosmos/graph-after-first-v0.1.json \
              --out knowledge/cosmos/graph-after-second-v0.1.json \
              --report knowledge/cosmos/graph-write-second-report-v0.1.json
          )

          TEST_DIR="$TEST_DIR" node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const root = process.env.TEST_DIR;
          const read = (name) => JSON.parse(
            fs.readFileSync(path.join(root, "knowledge/cosmos", name), "utf8")
          );

          const firstGraph = read("graph-after-first-v0.1.json");
          const secondGraph = read("graph-after-second-v0.1.json");
          const firstReport = read("graph-write-first-report-v0.1.json");
          const secondReport = read("graph-write-second-report-v0.1.json");
          const errors = [];

          if (firstGraph.status !== "cosmos_graph_snapshot" ||
              secondGraph.status !== "cosmos_graph_snapshot") {
            errors.push("Graph Writer did not produce Cosmos graph snapshots");
          }

          if (firstReport.status !== "graph_write_resolved" ||
              secondReport.status !== "graph_write_resolved") {
            errors.push("Graph Writer reports did not resolve successfully");
          }

          const firstState = firstReport.graph_write_state || {};
          const secondState = secondReport.graph_write_state || {};

          if (Number(firstState.written_count) !== 1 ||
              Number(firstState.idempotent_skip_count) !== 0 ||
              Number(firstState.error_count) !== 1) {
            errors.push(
              `First graph write invalid: written=${firstState.written_count}, skipped=${firstState.idempotent_skip_count}, errors=${firstState.error_count}`
            );
          }

          if (Number(secondState.written_count) !== 0 ||
              Number(secondState.idempotent_skip_count) !== 1 ||
              Number(secondState.error_count) !== 1) {
            errors.push(
              `Second graph write failed idempotency: written=${secondState.written_count}, skipped=${secondState.idempotent_skip_count}, errors=${secondState.error_count}`
            );
          }

          if (firstGraph.knowledge_records.length !== 1 ||
              secondGraph.knowledge_records.length !== 1) {
            errors.push(
              `Idempotency failed: first_records=${firstGraph.knowledge_records.length}, second_records=${secondGraph.knowledge_records.length}`
            );
          }

          if (firstGraph.audit_log.length !== 1 ||
              secondGraph.audit_log.length !== 1) {
            errors.push(
              `Idempotency failed for audit log: first=${firstGraph.audit_log.length}, second=${secondGraph.audit_log.length}`
            );
          }

          const firstRecord = firstGraph.knowledge_records[0];
          const secondRecord = secondGraph.knowledge_records[0];

          if (!firstRecord || !secondRecord ||
              firstRecord.graph_record_id !== secondRecord.graph_record_id ||
              firstRecord.knowledge_admission_id !== secondRecord.knowledge_admission_id) {
            errors.push("Second run did not preserve the original graph record identity");
          }

          if (firstRecord?.claim_class !== "validated_qualified_relationship" ||
              firstRecord?.validation_disposition !== "partially_supported" ||
              Number(firstRecord?.confidence_score) !== 76 ||
              firstRecord?.confidence_band !== "high") {
            errors.push("Graph record lost claim class, disposition or confidence");
          }

          if (firstRecord?.qualification?.contradiction_present !== true ||
              firstRecord?.qualification?.must_preserve_contradiction !== true ||
              firstRecord?.qualification?.confidence_preserved !== true ||
              firstRecord?.qualification?.source_lineage_preserved !== true ||
              firstRecord?.qualification?.temporal_scope_preserved !== true ||
              firstRecord?.qualification?.geography_scope_preserved !== true) {
            errors.push("Graph record lost qualification or preservation metadata");
          }

          if (!Array.isArray(firstRecord?.evidence_record_ids) ||
              firstRecord.evidence_record_ids.length !== 3) {
            errors.push("Graph record did not preserve complete evidence lineage");
          }

          if (firstRecord?.reversibility?.reversible !== true ||
              firstRecord?.reversibility?.reversal_operation !== "deactivate_graph_record" ||
              firstRecord?.reversibility?.reversal_key !== firstRecord?.knowledge_admission_id) {
            errors.push("Graph record reversibility contract invalid");
          }

          const rejectedId = "knowledge_admission_graph_writer_fixture_rejected";
          if (firstGraph.knowledge_records.some(
                row => row.knowledge_admission_id === rejectedId
              ) ||
              secondGraph.knowledge_records.some(
                row => row.knowledge_admission_id === rejectedId
              )) {
            errors.push("Non-eligible admission was materialized into the graph");
          }

          if (!firstReport.errors.some(
                row => row.knowledge_admission_id === rejectedId &&
                       row.reason === "admission_not_graph_write_eligible"
              ) ||
              !secondReport.errors.some(
                row => row.knowledge_admission_id === rejectedId &&
                       row.reason === "admission_not_graph_write_eligible"
              )) {
            errors.push("Graph Writer did not explicitly refuse the non-eligible admission");
          }

          if (!secondReport.skipped.some(
                row => row.knowledge_admission_id === firstRecord?.knowledge_admission_id &&
                       row.reason === "already_materialized_idempotent_skip"
              )) {
            errors.push("Second run did not record the expected idempotent skip");
          }

          const safeguards = firstReport.safeguards || {};
          if (safeguards.mutates_input_graph_in_place !== false ||
              safeguards.writes_only_explicit_output_snapshot !== true ||
              safeguards.requires_graph_write_eligibility !== true ||
              safeguards.preserves_qualification !== true ||
              safeguards.preserves_contradiction !== true ||
              safeguards.preserves_confidence !== true ||
              safeguards.preserves_evidence_lineage !== true ||
              safeguards.idempotent_by_knowledge_admission_id !== true ||
              safeguards.audit_log_required !== true ||
              safeguards.graph_records_reversible !== true ||
              safeguards.rejected_admissions_not_written !== true ||
              safeguards.unlimited_conceptual_continuation_preserved !== true) {
            errors.push("Cosmos Graph Writer safeguards invalid");
          }

          if (firstState.conceptual_distance_limit !== null ||
              firstState.continuation_possible !== true ||
              secondState.conceptual_distance_limit !== null ||
              secondState.continuation_possible !== true) {
            errors.push("Graph Writer did not preserve unlimited conceptual continuation");
          }

          if (errors.length) {
            console.error("\nCosmos Graph Writer v0.1 preflight errors:");
            for (const error of errors) console.error(`- ${error}`);
            process.exit(1);
          }

          console.log("");
          console.log("Cosmos Graph Writer v0.1 isolated test passed.");
          console.log(`First run writes:          ${firstState.written_count}`);
          console.log(`First run refused:         ${firstState.error_count}`);
          console.log(`Second run writes:         ${secondState.written_count}`);
          console.log(`Second run idempotent skip:${secondState.idempotent_skip_count}`);
          console.log(`Stable graph records:      ${secondGraph.knowledge_records.length}`);
          console.log(`Stable audit records:      ${secondGraph.audit_log.length}`);
          console.log(
            "Eligibility enforcement, qualification/confidence/lineage preservation, reversibility, snapshot isolation and second-run idempotency safeguards passed."
          );
          console.log(
            "Repository files were not modified by the isolated test."
          );
          NODE


      - name: Test Cosmos Graph Integrity v0.1 In Isolated Workspace
        shell: bash
        run: |
          set -euo pipefail

          TEST_DIR="$(mktemp -d)"

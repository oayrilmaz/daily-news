              upstream.map(x => String(x.from_label || ""))
            );

            if (!labels.has("Data-center capacity expansion") ||
                !labels.has("AI compute demand growth")) {
              errors.push(
                "Controlled upstream driver labels invalid"
              );
            }
          }

          const story = payload.downstream_story || {};
          const direct = story.direct_effects || [];
          const second = story.second_order_effects || [];
          const third = story.third_order_effects || [];
          const emerging = story.emerging_effects || [];

          if (direct.length !== 1 ||
              second.length !== 1 ||
              third.length !== 1 ||
              emerging.length !== 2) {
            errors.push(
              `Controlled downstream grouping invalid: direct=${direct.length}, second=${second.length}, third=${third.length}, emerging=${emerging.length}`
            );
          }


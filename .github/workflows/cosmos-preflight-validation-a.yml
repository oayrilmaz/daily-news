            if (!targetIds.has(row.validation_target_id)) {
              errors.push(
                `Future evidence queue references unknown validation target ${row.validation_target_id}`
              );
            }

            if (row.execution_status !== "not_connected" ||
                row.validation_status !== "not_started") {
              errors.push(
                `Future evidence queue ${row.validation_target_id} crossed execution/validation boundary`
              );
            }

            if (!row.validation_objective ||
                !Array.isArray(row.validation_requirements) ||
                !row.evidence_contract ||
                !Array.isArray(row.proposed_investigation_types)) {
              errors.push(
                `Future evidence queue ${row.validation_target_id} missing evidence-ready planning fields`
              );
            }
          }

          const safeguards = payload.safeguards || {};

          if (safeguards.performs_external_search !== false ||
              safeguards.calls_openai_or_external_api !== false ||
              safeguards.validates_candidates !== false ||
              safeguards.invents_evidence !== false ||
              safeguards.writes_to_knowledge_graph !== false ||
              safeguards.promotes_candidates_to_facts !== false ||
              safeguards.duplicate_semantic_candidates_consolidated !== true ||
              safeguards.parent_lineage_preserved !== true ||

          TEST_DIR="$TEST_DIR" node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const root = process.env.TEST_DIR;
          const file = path.join(
            root,
            "knowledge/cosmos/evidence-validator-test-v0.1.json"
          );

          if (!fs.existsSync(file)) {
            throw new Error(
              "Cosmos Evidence Validator did not create evidence-validator-test-v0.1.json"
            );
          }

          const payload = JSON.parse(fs.readFileSync(file, "utf8"));
          const errors = [];

          if (payload.schema_version !== "0.1") {
            errors.push(
              `Unexpected Cosmos Evidence Validator schema_version: ${payload.schema_version}`
            );
          }

          if (payload.status !== "evidence_validation_resolved") {
            errors.push(
              `Cosmos Evidence Validator failed: ${payload.status}`
            );
          }

          if (payload.source_evidence_executor?.schema_version !== "0.1") {
            errors.push(
              `Cosmos Evidence Validator must consume Evidence Executor v0.1; got ${payload.source_evidence_executor?.schema_version}`
            );
          }

          const state = payload.validation_state || {};
          const validations = payload.validations || [];
          const admissionQueue = payload.knowledge_admission_queue || [];

          if (!Array.isArray(validations) || validations.length !== 7) {
            errors.push(
              `Controlled Evidence Validator expected 7 validations; got ${validations.length}`
            );
          }

          if (Number(state.validation_target_count) !== 7 ||
              Number(state.completed_validation_count) !== 7) {
            errors.push(
              "Cosmos Evidence Validator validation counts invalid"
            );
          }

          if (Number(state.knowledge_admission_count) !== 0) {
            errors.push(
              "Cosmos Evidence Validator v0.1 must not admit knowledge"
            );
          }

          if (state.conceptual_distance_limit !== null) {
            errors.push(
              "Cosmos Evidence Validator conceptual distance must remain unlimited/null"
            );
          }

          if (state.continuation_possible !== true) {
            errors.push(
              "Cosmos Evidence Validator must preserve Cosmos continuation"
            );
          }

          const allowed = new Set([
            "supported",
            "partially_supported",
            "contradicted",
            "unresolved",
            "insufficient_evidence"
          ]);

          for (const row of validations) {
            if (!row.evidence_validation_id ||
                !row.evidence_task_id ||
                !row.validation_target_id ||
                !allowed.has(row.disposition)) {
              errors.push(
                "Cosmos Evidence Validator row missing identity/disposition"
              );
              continue;
            }

            if (!Number.isFinite(Number(row.confidence_score)) ||
                Number(row.confidence_score) < 0 ||
                Number(row.confidence_score) > 100 ||
                !["very_high","high","moderate","low","very_low"]
                  .includes(row.confidence_band)) {
              errors.push(
                `Evidence validation ${row.evidence_validation_id} confidence invalid`
              );
            }

            if (!Array.isArray(row.evidence_record_ids) ||
                !Array.isArray(row.record_assessments)) {
              errors.push(
                `Evidence validation ${row.evidence_validation_id} evidence lineage invalid`
              );
            }

            if (row.validation_status !== "completed" ||
                row.knowledge_admission_status !== "not_started") {
              errors.push(
                `Evidence validation ${row.evidence_validation_id} crossed knowledge-admission boundary`
              );
            }

            if (!String(row.epistemic_rule || "").includes(
              "only Knowledge Admission"
            )) {
              errors.push(
                `Evidence validation ${row.evidence_validation_id} epistemic safeguard missing`
              );
            }
          }

          const dataCenters = validations.find(
            row => Number(row.evidence_record_count) === 3
          );

          if (!dataCenters) {
            errors.push(
              "Cosmos Evidence Validator did not resolve the data-centers validation"
            );
          } else {
            if (dataCenters.disposition !== "partially_supported") {
              errors.push(
                `Controlled Data Centers validation expected partially_supported; got ${dataCenters.disposition}`
              );
            }

            if (Number(dataCenters.evidence_balance?.independent_source_groups) !== 3 ||
                Number(dataCenters.evidence_balance?.direct_high_authority_records) !== 2) {
              errors.push(
                "Controlled Data Centers evidence-balance counts invalid"
              );
            }

            if (!(Number(dataCenters.evidence_balance?.weighted_support) >
                  Number(dataCenters.evidence_balance?.weighted_contradiction))) {
              errors.push(
                "Controlled Data Centers weighted support should exceed weighted contradiction"
              );
            }

            if (dataCenters.sufficiency_observation?.total_source_threshold_met !== true ||
                dataCenters.sufficiency_observation?.independent_source_threshold_met !== true ||
                dataCenters.sufficiency_observation?.direct_primary_preference_met !== true ||
                dataCenters.sufficiency_observation?.contradiction_search_observed !== true) {
              errors.push(
                "Controlled Data Centers sufficiency observations invalid"
              );
            }

            if (dataCenters.executable_for_knowledge_admission !== true) {
              errors.push(
                "Partially supported Data Centers validation should be eligible for Knowledge Admission review"
              );
            }
          }

          const insufficient = validations.filter(
            row => row.disposition === "insufficient_evidence"
          );

          if (insufficient.length !== 6) {
            errors.push(
              `Controlled Evidence Validator expected 6 insufficient-evidence targets; got ${insufficient.length}`
            );
          }

          if (insufficient.some(
            row => row.executable_for_knowledge_admission !== false
          )) {
            errors.push(
              "Insufficient-evidence targets must not be eligible for Knowledge Admission"
            );
          }

          if (!Array.isArray(admissionQueue) ||
              admissionQueue.length !== 1) {
            errors.push(
              `Controlled Evidence Validator expected exactly 1 Knowledge Admission queue item; got ${admissionQueue.length}`
            );
          } else {
            const row = admissionQueue[0];

            if (row.disposition !== "partially_supported" ||
                row.admission_status !== "not_started" ||
                !Array.isArray(row.evidence_record_ids) ||
                row.evidence_record_ids.length !== 3) {
              errors.push(
                "Controlled Knowledge Admission queue item invalid"
              );
            }
          }

          if (Number(state.by_disposition?.partially_supported || 0) !== 1 ||
              Number(state.by_disposition?.insufficient_evidence || 0) !== 6) {
            errors.push(
              "Cosmos Evidence Validator disposition summary invalid"
            );
          }

          const safeguards = payload.safeguards || {};

          if (safeguards.performs_external_search !== false ||
              safeguards.calls_openai_or_external_api !== false ||
              safeguards.invents_evidence !== false ||
              safeguards.preserves_contradictory_evidence !== true ||
              safeguards.validation_uses_authority_directness_independence_and_completeness !== true ||
              safeguards.validation_does_not_equal_knowledge_admission !== true ||

              safeguards.validation_required_before_execution !== true ||
              safeguards.unlimited_conceptual_continuation_preserved !== true) {
            errors.push("Candidate Validation Planner safeguards invalid");
          }

          if (errors.length) {
            console.error("\nCosmos Candidate Validation Planner v0.1 preflight errors:");
            for (const error of errors) {
              console.error(`- ${error}`);
            }
            process.exit(1);
          }

          console.log("");
          console.log("Cosmos Candidate Validation Planner v0.1 isolated test passed.");
          console.log(`Status:                ${payload.status}`);
          console.log(`Raw candidates:        ${state.raw_candidate_count}`);
          console.log(`Unique targets:        ${state.unique_validation_target_count}`);
          console.log(`Duplicates collapsed:  ${state.duplicate_candidate_count}`);
          console.log(`Future evidence queue: ${queue.length}`);
          console.log(`Validated:             ${state.validated_target_count}`);
          console.log(`Executable:            ${state.executable_target_count}`);
          console.log(
            "Semantic consolidation, parent-lineage preservation, evidence contracts and no-validation/no-execution safeguards passed."
          );
          console.log(
            "Repository files were not modified by the isolated test."
          );

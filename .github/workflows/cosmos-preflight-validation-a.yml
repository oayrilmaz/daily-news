          cp scripts/cosmos_attention.cjs "$TEST_DIR/scripts/cosmos_attention.cjs"
          cp scripts/cosmos_consequence.cjs "$TEST_DIR/scripts/cosmos_consequence.cjs"
          cp scripts/cosmos_discovery.cjs "$TEST_DIR/scripts/cosmos_discovery.cjs"
          cp scripts/cosmos_acquisition.cjs "$TEST_DIR/scripts/cosmos_acquisition.cjs"
          cp scripts/cosmos_acquisition_applicability.cjs \
            "$TEST_DIR/scripts/cosmos_acquisition_applicability.cjs"
          cp knowledge/cosmos/cosmos-state-current.json \
            "$TEST_DIR/knowledge/cosmos/cosmos-state-current.json"

          cat > "$TEST_DIR/core-input.json" <<'JSON'
          {
            "text": "What could AI data-center growth affect?",
            "language": "en",
            "entity_hints": [
              "Artificial Intelligence",
              "Data Centers"
            ],
            "mode": "open",
            "metadata": {
              "purpose": "cosmos_applicability_v0.1_preflight"
            }
          }
          JSON

          (
            cd "$TEST_DIR"

            node scripts/cosmos_core.cjs \
              --input core-input.json \
              --out knowledge/cosmos/core-test-v0.1.json

            node scripts/cosmos_attention.cjs \
              --input knowledge/cosmos/core-test-v0.1.json \
              --out knowledge/cosmos/attention-test-v0.2.json

            node scripts/cosmos_consequence.cjs \
              --input knowledge/cosmos/attention-test-v0.2.json \
              --out knowledge/cosmos/consequence-test-v0.1.json

            node scripts/cosmos_discovery.cjs \
              --input knowledge/cosmos/consequence-test-v0.1.json \
              --out knowledge/cosmos/discovery-test-v0.1.json

            node scripts/cosmos_acquisition.cjs \
              --input knowledge/cosmos/discovery-test-v0.1.json \
              --out knowledge/cosmos/acquisition-test-v0.1.json

            node scripts/cosmos_acquisition_applicability.cjs \
              --input knowledge/cosmos/acquisition-test-v0.1.json \
              --out knowledge/cosmos/applicability-test-v0.1.json
          )

          TEST_DIR="$TEST_DIR" node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const root = process.env.TEST_DIR;
          const file = path.join(
            root,
            "knowledge/cosmos/applicability-test-v0.1.json"
          );

          if (!fs.existsSync(file)) {
            throw new Error(
              "Cosmos Applicability did not create applicability-test-v0.1.json"
            );
          }

          const payload = JSON.parse(fs.readFileSync(file, "utf8"));
          const errors = [];

          if (payload.schema_version !== "0.1") {
            errors.push(
              `Unexpected Cosmos Applicability schema_version: ${payload.schema_version}`
            );
          }

          if (payload.status !== "acquisition_applicability_resolved") {
            errors.push(
              `Cosmos Applicability failed: ${payload.status}`
            );
          }

          if (payload.source_acquisition?.schema_version !== "0.1") {
            errors.push(
              `Cosmos Applicability must consume Acquisition v0.1; got ${payload.source_acquisition?.schema_version}`
            );
          }

          const state = payload.applicability_state || {};
          const evaluations = payload.evaluations || [];
          const executableQueue = payload.executable_queue || [];
          const decompositionQueue = payload.decomposition_queue || [];

          if (!Array.isArray(evaluations) || evaluations.length < 1) {
            errors.push("Cosmos Applicability evaluations[] missing or empty");
          }

          if (!Array.isArray(executableQueue)) {
            errors.push("Cosmos Applicability executable_queue[] missing");
          }

          if (!Array.isArray(decompositionQueue)) {
            errors.push("Cosmos Applicability decomposition_queue[] missing");
          }

          if (Number(state.plan_count) !== evaluations.length) {
            errors.push(
              `Cosmos Applicability plan_count mismatch: ${state.plan_count} vs ${evaluations.length}`
            );
          }

          const applicable = evaluations.filter(x => x.applicability_status === "applicable");
          const decompose = evaluations.filter(
            x => x.applicability_status === "decomposition_required"
          );

          if (Number(state.applicable_count) !== applicable.length) {
            errors.push("Cosmos Applicability applicable_count mismatch");
          }

          if (Number(state.decomposition_required_count) !== decompose.length) {
            errors.push(
              "Cosmos Applicability decomposition_required_count mismatch"
            );
          }

          if (Number(state.executable_queue_count) !== executableQueue.length) {
            errors.push(
              "Cosmos Applicability executable_queue_count mismatch"
            );
          }

          if (state.external_execution_connected !== false) {
            errors.push(
              "Cosmos Applicability v0.1 must not connect external execution"
            );
          }

          if (state.conceptual_distance_limit !== null) {
            errors.push(
              "Cosmos Applicability conceptual distance must remain unlimited/null"
            );
          }

          if (state.continuation_possible !== true) {
            errors.push(
              "Cosmos Applicability must preserve continuation"
            );
          }

          for (const row of evaluations) {
            if (!row.acquisition_plan_id ||
                !row.discovery_target_id ||
                !row.target_type ||
                !row.original_statement ||
                !row.subject) {
              errors.push(
                "Cosmos Applicability evaluation missing identity/context"
              );
            }

            if (!["applicable", "decomposition_required"].includes(
              row.applicability_status
            )) {
              errors.push(
                `Cosmos Applicability invalid status ${row.applicability_status}`
              );
            }

            if (typeof row.executable !== "boolean") {
              errors.push(
                `Cosmos Applicability evaluation ${row.acquisition_plan_id || "(unknown)"} missing executable boolean`
              );
            }

            if (row.applicability_status === "decomposition_required") {
              if (row.executable !== false) {
                errors.push(
                  `Decomposition-required plan ${row.acquisition_plan_id} must be blocked`
                );
              }

              if (!row.decomposition_question ||
                  !Array.isArray(row.decomposition_hints) ||
                  row.decomposition_hints.length < 1) {
                errors.push(
                  `Decomposition-required plan ${row.acquisition_plan_id} lacks decomposition guidance`
                );
              }
            }

            if (row.applicability_status === "applicable" &&
                row.executable !== true) {
              errors.push(
                `Applicable plan ${row.acquisition_plan_id} is not executable`
              );
            }

            if (row.original_plan_preserved !== true) {
              errors.push(
                `Applicability evaluation ${row.acquisition_plan_id} did not preserve source plan`
              );
            }
          }

          const evalById = new Map(
            evaluations.map(x => [x.acquisition_plan_id, x])
          );

          for (let i = 0; i < executableQueue.length; i += 1) {
            const row = executableQueue[i];

            if (Number(row.execution_rank) !== i + 1) {
              errors.push(
                `Executable queue rank invalid at index ${i}`
              );
            }

            const evaluation = evalById.get(row.acquisition_plan_id);

            if (!evaluation || evaluation.executable !== true) {
              errors.push(
                `Executable queue contains blocked/unknown plan ${row.acquisition_plan_id}`
              );
            }

            if (row.applicability_status !== "applicable") {
              errors.push(
                `Executable queue plan ${row.acquisition_plan_id} not marked applicable`
              );
            }
          }

          for (let i = 0; i < decompositionQueue.length; i += 1) {
            const row = decompositionQueue[i];

            if (Number(row.decomposition_rank) !== i + 1) {
              errors.push(
                `Decomposition queue rank invalid at index ${i}`
              );
            }

            const evaluation = evalById.get(row.acquisition_plan_id);

            if (!evaluation ||
                evaluation.applicability_status !== "decomposition_required") {
              errors.push(
                `Decomposition queue contains non-decomposition plan ${row.acquisition_plan_id}`
              );
            }

            if (row.status !== "not_resolved") {
              errors.push(
                `Decomposition queue plan ${row.acquisition_plan_id} must remain unresolved`
              );
            }
          }

          const aiPhysicalBlocks = decompose.filter(row =>
            /artificial intelligence/i.test(row.subject) &&
            ["identify_components", "identify_materials", "identify_capacity"]
              .includes(row.target_type)
          );

          if (aiPhysicalBlocks.length < 1) {
            errors.push(
              "Controlled Applicability test did not block a physically specific Artificial Intelligence acquisition plan"
            );
          }

          const transformerExecutable = applicable.filter(row =>
            /transformers/i.test(row.subject) &&
            ["identify_components", "identify_materials", "identify_capacity"]
              .includes(row.target_type)
          );

          if (transformerExecutable.length < 1) {
            errors.push(
              "Controlled Applicability test did not preserve an applicable Transformer physical acquisition plan"
            );
          }

          const safeguards = payload.safeguards || {};

          if (safeguards.performs_external_search !== false ||
              safeguards.calls_openai_or_external_api !== false ||
              safeguards.invents_evidence !== false ||
              safeguards.invents_entities !== false ||
              safeguards.writes_to_knowledge_graph !== false ||
              safeguards.mutates_source_acquisition_plans !== false ||
              safeguards.executes_decomposition_hints_as_facts !== false ||
              safeguards.abstract_targets_blocked_from_physical_execution !== true ||
              safeguards.source_lineage_preserved !== true) {
            errors.push("Cosmos Applicability safeguards invalid");
          }

          if (errors.length) {
            console.error("\nCosmos Acquisition Applicability v0.1 preflight errors:");
            for (const error of errors) {
              console.error(`- ${error}`);
            }
            process.exit(1);
          }

          console.log("");
          console.log("Cosmos Acquisition Applicability v0.1 isolated test passed.");
          console.log(`Status:                 ${payload.status}`);
          console.log(`Plans evaluated:        ${evaluations.length}`);
          console.log(`Applicable:             ${applicable.length}`);
          console.log(`Decomposition required: ${decompose.length}`);
          console.log(`Executable queue:       ${executableQueue.length}`);
          console.log(
            "Abstract physical-target blocking, executable filtering, decomposition guidance, lineage and no-execution safeguards passed."
          );
          console.log(
            "Repository files were not modified by the isolated test."
          );
          NODE

      - name: Test Cosmos Decomposition v0.1 In Isolated Workspace

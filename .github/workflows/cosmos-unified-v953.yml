name: COSMOS v9.5.3 — Unified Metro + Safety Menu
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'validate first, then apply in a separate run'
        type: choice
        required: true
        default: validate
        options:
          - validate
          - apply
permissions:
  contents: write
jobs:
  unified-metro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check or apply guarded v9.5.3 update
        run: python scripts/apply_cosmos_unified_v953.py --mode "${{ inputs.mode }}"
      - name: Commit only frontend after apply
        if: inputs.mode == 'apply'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- cosmos-next.html
          if ! git diff --cached --quiet; then
            git commit -m 'COSMOS v9.5.3 unify Personal and Business navigation and Metro'
            git push origin HEAD:main
          fi

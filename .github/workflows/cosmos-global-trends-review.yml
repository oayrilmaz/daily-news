name: COSMOS v7.2 — Source-First Editorial Review (No Public Pages)

on:
  workflow_dispatch:
  schedule:
    # 10:09 UTC daily. Generate private drafts only; never publish to the site or X.
    - cron: '9 10 * * *'

permissions:
  contents: write # Only safe metadata & removal of previously public draft pages

concurrency:
  group: cosmos-v6-3-global-trends-review
  cancel-in-progress: false

jobs:
  generate-private-editorial-review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check files and run offline regressions (no API calls)
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/cosmos_global_trends_v6_3.mjs
          node --check scripts/cosmos_global_quality_gate_v7_2.mjs
          COSMOS_QA_SELF_TEST=1 node scripts/cosmos_global_trends_v6_3.mjs
          COSMOS_GATE_TEST=1 node scripts/cosmos_global_quality_gate_v7_2.mjs
          python -m py_compile scripts/cosmos_global_cards_v6_3.py
          if [ -f data/social-queue.json ]; then
            sha256sum data/social-queue.json | awk '{print $1}' > "$RUNNER_TEMP/cosmos-social-before.sha"
          else
            echo absent > "$RUNNER_TEMP/cosmos-social-before.sha"
          fi

      - name: Discover trends and produce REVIEW-ONLY evidence-first drafts
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          COSMOS_QA_DAILY_COUNT: ${{ vars.COSMOS_QA_DAILY_COUNT || '7' }}
          COSMOS_TRENDS_SERP_MAX: ${{ vars.COSMOS_TRENDS_SERP_MAX || '7' }}
          COSMOS_TRENDS_REGIONS: ${{ vars.COSMOS_TRENDS_REGIONS || 'US,GB,CA,AU,IN,DE,FR,BR,JP,ZA,SG,PH' }}
          COSMOS_QA_OPENAI_MODEL: ${{ vars.COSMOS_QA_OPENAI_MODEL || 'gpt-4.1-mini' }}
          COSMOS_QA_GROK_MODEL: ${{ vars.COSMOS_QA_GROK_MODEL || 'grok-4.3' }}
          COSMOS_TOPIC_SCAN_LIMIT: '24'
          COSMOS_CANDIDATE_LIMIT: '18'
          COSMOS_SOURCE_FETCH_LIMIT: '3'
          SITE_ORIGIN: https://ptdtoday.com
        run: node scripts/cosmos_global_trends_v6_3.mjs

      - name: Generate original cards (review-only artifact pending gate)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
          python scripts/cosmos_global_cards_v6_3.py

      - name: Final editorial gate and review-only preview — FAIL CLOSED
        run: node scripts/cosmos_global_quality_gate_v7_2.mjs

      - name: Validate zero public Q&A, source provenance and social isolation
        shell: bash
        run: |
          set -euo pipefail
          COSMOS_GATE_VALIDATE=1 node scripts/cosmos_global_quality_gate_v7_2.mjs
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('data/cosmos-global-questions-diagnostics.json','utf8'));
          const r=JSON.parse(fs.readFileSync('data/cosmos-global-questions-review.json','utf8'));
          if(d.version!=='7.2.0'||r.generator_version!=='7.2.0'||r.quality_gate_version!=='7.2.0')throw Error('Code version mismatch');
          if(d.serpapi_requests>d.serpapi_budget || d.serpapi_requests>7)throw Error('SerpApi budget exceeded');
          for(const x of r.items){
            if(!['editorial_evidence_first','google_paa'].includes(x.question_source_type))throw Error('Question source not labeled');
            if(!Array.isArray(x.sources)||new Set(x.sources.map(s=>new URL(s.url).hostname)).size<2)throw Error('Missing independent linked domains');
            const n=[...String(x.answer?.explanation||'').matchAll(/\[(\d+)\]/g)].map(y=>+y[1]);
            if(new Set(n).size<2||n.some(i=>i<1||i>x.sources.length))throw Error('Bad citation markers');
          }
          console.log('COSMOS: provenance, budget and publication isolation verified.');
          NODE
          if [ "$(cat "$RUNNER_TEMP/cosmos-social-before.sha")" = absent ]; then
            test ! -f data/social-queue.json
          else
            test "$(sha256sum data/social-queue.json | awk '{print $1}')" = "$(cat "$RUNNER_TEMP/cosmos-social-before.sha")"
          fi

      - name: Upload complete editorial artifact (not published to website)
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-editorial-review-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            data/cosmos-global-questions-review.json
            data/cosmos-global-questions-diagnostics.json
            data/cosmos-global-questions-quality-audit.json
            data/cosmos-global-questions-quality-summary.md
            artifacts/cosmos-editorial-review/

      - name: Publish ONLY safe status/history metadata and remove legacy draft previews
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com

          # Old workflow versions committed draft JSON and noindexed pages to main.
          # After the artifact has been uploaded, remove tracked copies. noindex is
          # NOT privacy and these files must never be pushed by this workflow.
          rm -f data/cosmos-global-questions-review.json \
                data/cosmos-global-questions-diagnostics.json \
                data/cosmos-global-questions-quality-audit.json \
                data/cosmos-global-questions-quality-summary.md
          git rm -f --ignore-unmatch -- \
            data/cosmos-global-questions-review.json \
            data/cosmos-global-questions-diagnostics.json \
            data/cosmos-global-questions-quality-audit.json \
            data/cosmos-global-questions-quality-summary.md

          git add -A -- \
            data/cosmos-global-trend-signals.json \
            data/cosmos-global-questions-history.json \
            data/cosmos-global-questions-latest.json \
            data/cosmos-global-questions-run-status.json
          if [ -d q/trends ]; then git add -u -- q/trends; fi
          if [ -d assets/cosmos-global-cards ]; then git add -u -- assets/cosmos-global-cards; fi

          # Explicit allowlist. q/trends and visual-card paths may ONLY be deleted.
          while IFS=$'\t' read -r status filename; do
            [ -z "$filename" ] && continue
            case "$filename" in
              data/cosmos-global-trend-signals.json|data/cosmos-global-questions-history.json|data/cosmos-global-questions-latest.json|data/cosmos-global-questions-run-status.json) ;;
              data/cosmos-global-questions-review.json|data/cosmos-global-questions-diagnostics.json|data/cosmos-global-questions-quality-audit.json|data/cosmos-global-questions-quality-summary.md)
                [ "$status" = D ] || { echo "FAIL: Private review file added to commit"; exit 1; } ;;
              q/trends/*|assets/cosmos-global-cards/*)
                [ "$status" = D ] || { echo "FAIL: Attempted to publish an unapproved site asset"; exit 1; } ;;
              *) echo "FAIL: Unexpected staged path $filename"; exit 1 ;;
            esac
          done < <(git diff --cached --name-status)

          if git diff --cached --quiet; then
            echo 'No safe metadata changes to commit.'
            exit 0
          fi
          git commit -m 'COSMOS v7.2: retain safe review status, remove public unapproved previews'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

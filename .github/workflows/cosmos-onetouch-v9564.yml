name: COSMOS v9.5.6.4 - OneTouch Clean Popups and Moment Identity

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate, apply, or rollback the OneTouch frontend patch
        required: true
        type: choice
        default: validate
        options: [validate, apply, rollback]

permissions:
  contents: write

concurrency:
  group: cosmos-next-frontend-v9564
  cancel-in-progress: false

jobs:
  onetouch-popup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Validate syntax and guarded patch
        run: python3 scripts/apply_cosmos_onetouch_v9564.py --mode validate
      - name: Apply or rollback
        if: ${{ inputs.mode != 'validate' }}
        run: python3 scripts/apply_cosmos_onetouch_v9564.py --mode "${{ inputs.mode }}"
      - name: Inspect frontend-only changes
        if: ${{ inputs.mode != 'validate' }}
        run: |
          git diff --check -- cosmos-next.html
          git diff --stat -- cosmos-next.html
      - name: Commit and push updated frontend
        if: ${{ inputs.mode != 'validate' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- cosmos-next.html
          if git diff --cached --quiet; then echo "Already up to date"; exit 0; fi
          git commit -m "COSMOS v9.5.6.4 OneTouch clean popups and labeled stations"
          git push origin HEAD:main

name: COSMOS v9.4.6 — Clean Metro, Owner Controls and News

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate first, then apply
        required: true
        default: validate
        type: choice
        options:
          - validate
          - apply

permissions:
  contents: write

concurrency:
  group: cosmos-metro-v946-main
  cancel-in-progress: false

jobs:
  metro-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Guarded v9.4.6 validation or application
        run: python scripts/apply_cosmos_metro_v946.py --mode "${{ inputs.mode }}"
      - name: Commit only cosmos-next.html when applying
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- cosmos-next.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- cosmos-next.html
            git commit -m "COSMOS v9.4.6 Metro owner navigation and news improvements"
            git push origin HEAD:main
          else
            echo "Already installed; nothing to commit."
          fi

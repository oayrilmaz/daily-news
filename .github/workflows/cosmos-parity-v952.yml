name: COSMOS v9.5.2 — Unified Personal and Business Metro
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "validate first, then start a NEW apply run"
        required: true
        default: validate
        type: choice
        options:
          - validate
          - apply
permissions:
  contents: write
concurrency:
  group: cosmos-v952-parity
  cancel-in-progress: false
jobs:
  frontend-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate or apply guarded parity update
        run: python scripts/apply_cosmos_parity_v952.py --mode "${{ inputs.mode }}"
      - name: Check HTML and JavaScript after apply
        if: inputs.mode == 'apply'
        shell: bash
        run: |
          node --version
          python - <<'PYCODE'
          import re,pathlib,subprocess,tempfile
          content=pathlib.Path('cosmos-next.html').read_text()
          assert 'id="cosmos952UnifiedMenuAndMetro"' in content
          assert 'renderMenuSections(kind)' in content
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',content,re.I|re.S)
          with tempfile.TemporaryDirectory() as root:
              for index,code in enumerate(scripts):
                  if not code.strip():continue
                  file=pathlib.Path(root)/f'{index}.js';file.write_text(code)
                  subprocess.run(['node','--check',str(file)],check=True)
          print('PASS: all inline JavaScript parses.')
          PYCODE
      - name: Commit updated frontend only
        if: inputs.mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- cosmos-next.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cosmos-next.html
            git commit -m "COSMOS v9.5.2: shared Personal and Business Metro + menus"
            git push origin HEAD:main
          else
            echo 'No changes to commit (already installed).'
          fi

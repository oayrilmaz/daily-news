name: COSMOS v9.5.6.8 - OneTouch Camera and Capture
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Validate, then apply (or rollback)"
        required: true
        type: choice
        default: validate
        options:
          - validate
          - apply
          - rollback
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guarded camera update
        run: python scripts/apply_cosmos_onetouch_v9568.py --mode "${{ inputs.mode }}"
      - name: Commit revised COSMOS frontend
        if: inputs.mode != 'validate'
        run: |
          if git diff --quiet -- cosmos-next.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cosmos-next.html
          git commit -m "COSMOS v9.5.6.8: OneTouch camera access (${{ inputs.mode }})"
          git push origin HEAD:main

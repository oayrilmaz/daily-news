name: COSMOS v9.3.4 — iPhone Photo Upload Fix
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate first, then apply
        type: choice
        default: validate
        required: true
        options:
          - validate
          - apply
permissions:
  contents: write
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate or apply guarded v9.3.4 profile patch
        run: python scripts/apply_cosmos_profile_v934.py "${{ inputs.mode }}"
      - name: Commit frontend only after a successful apply
        if: ${{ inputs.mode == 'apply' }}
        run: |
          if ! git diff --quiet -- cosmos-next.html; then
            git config user.name 'COSMOS GitHub Actions'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add cosmos-next.html
            git commit -m 'COSMOS v9.3.4 fix iPhone profile photo uploads'
            git push origin HEAD:main
          else
            echo 'Already applied: no commit necessary.'
          fi

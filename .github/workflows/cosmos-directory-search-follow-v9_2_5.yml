name: COSMOS v9.2.5 — Separate Profiles + Opt-in Search & Follow

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Validate first; apply only after the D1 and Worker deployment'
        required: true
        type: choice
        default: validate
        options:
          - validate
          - apply

permissions:
  contents: write
  pages: write

concurrency:
  group: cosmos-unified-metro-frontend
  cancel-in-progress: false

jobs:
  frontend:
    name: Verify independent profiles, directory and centered Metro
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - name: Verify patch scripts
        shell: bash
        run: |
          set -euo pipefail
          test -f cosmos-next.html
          test -f scripts/patch_cosmos_identical_metros_v9_2_3.py
          test -f scripts/patch_cosmos_business_profiles_v9_2_4.py
          test -f scripts/patch_cosmos_search_follow_v9_2_5.py
          python3 -m py_compile scripts/patch_cosmos_identical_metros_v9_2_3.py scripts/patch_cosmos_business_profiles_v9_2_4.py scripts/patch_cosmos_search_follow_v9_2_5.py
      - name: Apply safe patches to disposable runner checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_cosmos_identical_metros_v9_2_3.py
          python3 scripts/patch_cosmos_business_profiles_v9_2_4.py --check
          python3 scripts/patch_cosmos_business_profiles_v9_2_4.py
          python3 scripts/patch_cosmos_search_follow_v9_2_5.py --check
          python3 scripts/patch_cosmos_search_follow_v9_2_5.py
          python3 scripts/patch_cosmos_search_follow_v9_2_5.py
      - name: Check syntax, preserved features and allowed changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, tempfile, subprocess, os
          page=pathlib.Path('cosmos-next.html').read_text(encoding='utf-8')
          for expected in ['COSMOS MATCHED METRO LAYOUT v9.2.3 CSS',
             'COSMOS BUSINESS PROFILE + CENTERED DOCK v9.2.4 CSS',
             'COSMOS BUSINESS PROFILE + CENTERED DOCK v9.2.4 JS',
             'COSMOS PROFILE DIRECTORY v9.2.5',
             'id="personalDirectoryV925"','id="businessDirectoryV925"',
             'id="bBusinessName"','id="bBusinessHandle"',
             'id="businessMetroCompose"','id="coreOrb"',
             '/api/directory/search','/api/unified/ask','/api/business/me']:
             assert expected in page, 'Missing expected feature: '+expected
          count=0
          for attrs,js in re.findall(r'<script\b([^>]*)>(.*?)</script\s*>',page,re.I|re.S):
            if re.search(r'\bsrc\s*=',attrs,re.I):continue
            with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False) as f:
              f.write(js);name=f.name
            try:subprocess.run(['node','--check',name],check=True)
            finally:os.unlink(name)
            count+=1
          assert count>=2
          print('PASS',count,'JavaScript blocks, existing COSMOS features and directory entries')
          PY
          git diff --check -- cosmos-next.html
          if git diff --name-only | grep -v '^cosmos-next.html$'; then
            echo 'Unexpected tracked file changes'; exit 1
          fi
      - name: Commit only cosmos-next.html (apply only)
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- cosmos-next.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Already installed. No changes committed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'COSMOS v9.2.5: independent profiles, opt-in directory and following'
            git push origin HEAD:main
          fi
      - name: Request legacy Pages build if required
        if: ${{ inputs.mode == 'apply' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/dev/null | grep -q '^legacy$'; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
          fi
      - name: Summary
        run: |
          echo 'One login, separate Personal/Business searchable identities and follows.'
          echo 'Search and follows default off; following DOES NOT grant Connections rights.'
          echo 'No Worker or D1 change is performed by this GitHub workflow.'

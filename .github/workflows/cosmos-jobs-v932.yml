name: COSMOS v9.3.2 — Expanded Employer Jobs Discovery
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate before apply
        type: choice
        required: true
        default: validate
        options:
          - validate
          - apply
permissions:
  contents: write
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate or apply source-preserving v9.3.2 patch
        run: python scripts/apply_cosmos_jobs_v932.py "${{ inputs.mode }}"
      - name: Commit only corrected frontend in apply mode
        if: ${{ inputs.mode == 'apply' }}
        run: |
          if ! git diff --quiet -- cosmos-next.html; then
            git config user.name 'COSMOS GitHub Actions'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add cosmos-next.html
            git commit -m 'Improve COSMOS Jobs employer discovery and role relevance v9.3.2'
            git push origin HEAD:main
          else
            echo 'No frontend changes required.'
          fi

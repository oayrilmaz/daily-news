name: COSMOS v9.5.6.3 - OneTouch Month and Real Moments

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate, apply, or roll back the OneTouch timeline update
        required: true
        type: choice
        default: validate
        options: [validate, apply, rollback]

permissions:
  contents: write

concurrency:
  group: cosmos-next-frontend-v9563
  cancel-in-progress: false

jobs:
  onetouch-week:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Validate current frontend and v9.5.6.3 patch
        run: python3 scripts/apply_cosmos_onetouch_v9563.py --mode validate
      - name: Apply or rollback frontend update
        if: ${{ inputs.mode != 'validate' }}
        run: python3 scripts/apply_cosmos_onetouch_v9563.py --mode "${{ inputs.mode }}"
      - name: Inspect changes
        if: ${{ inputs.mode != 'validate' }}
        run: |
          git diff --check -- cosmos-next.html
          git diff --stat -- cosmos-next.html
      - name: Commit frontend only
        if: ${{ inputs.mode != 'validate' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- cosmos-next.html
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "COSMOS v9.5.6.3 show month and saved stations in OneTouch"
          git push origin HEAD:main

name: Cosmos Preflight - Controlled Outputs

on:
  workflow_call:
    inputs:
      write_emergence:
        description: "Generate and commit real emergence-current.json from current committed Cosmos data"
        required: false
        default: false
        type: boolean
      write_cosmos_state:
        description: "Generate and commit real cosmos-state-current.json from current committed Cosmos data"
        required: false
        default: false
        type: boolean
      write_cosmos_core_test:
        description: "Generate and commit controlled Cosmos Core v0.1 test output"
        required: false
        default: false
        type: boolean
      write_cosmos_attention_test:
        description: "Generate and commit controlled Cosmos Attention v0.2 test output"
        required: false
        default: false
        type: boolean
      write_cosmos_consequence_test:
        description: "Generate and commit controlled Cosmos Consequence v0.1 test output"
        required: false
        default: false
        type: boolean
      write_cosmos_discovery_test:
        description: "Generate and commit controlled Cosmos Discovery v0.1 test output"
        required: false
        default: false
        type: boolean
      write_cosmos_acquisition_test:
        description: "Generate and commit controlled Cosmos Acquisition v0.1 test output"
        required: false
        default: false
        type: boolean
      write_cosmos_applicability_test:
        description: "Generate and commit controlled Cosmos Acquisition Applicability v0.1 test output"
        required: false
        default: false
        type: boolean
      write_cosmos_decomposition_test:
        description: "Generate and commit controlled Cosmos Decomposition v0.1 test output"
        required: false
        default: false
        type: boolean
      write_cosmos_candidate_validation_test:
        description: "Generate and commit controlled Cosmos Candidate Validation Planner v0.1 test output"
        required: false
        default: false
        type: boolean
      write_cosmos_evidence_strategy_test:
        description: "Generate and commit controlled Cosmos Evidence Strategy v0.1 test output"
        required: false
        default: false
        type: boolean
      write_cosmos_evidence_executor_test:
        description: "Generate and commit controlled Cosmos Evidence Executor v0.1 test output"
        required: false
        default: false
        type: boolean
      write_cosmos_evidence_validator_test:
        description: "Generate and commit controlled Cosmos Evidence Validator v0.1 test output"
        required: false
        default: false
        type: boolean
      write_cosmos_knowledge_admission_test:
        description: "Generate and commit controlled Cosmos Knowledge Admission v0.1 test output"
        required: false
        default: false
        type: boolean
      write_cosmos_graph_writer_test:
        description: "Generate and commit controlled Cosmos Graph Writer v0.1 snapshot and report"
        required: false
        default: false
        type: boolean
      write_cosmos_graph_integrity_test:
        description: "Generate and commit controlled Cosmos Graph Integrity v0.1 report"
        required: false
        default: false
        type: boolean
      write_cosmos_graph_reversal_test:
        description: "Generate and commit controlled Cosmos Graph Reversal v0.1 snapshot, report and post-reversal integrity report"
        required: false
        default: false
        type: boolean
      write_cosmos_causal_narrative_test:
        description: "Generate and commit controlled Cosmos Causal Narrative v0.1 output"
        required: false
        default: false
        type: boolean
      write_cosmos_graph_evolution_test:
        description: "Generate and commit controlled Cosmos Graph Evolution v0.1 planning output"
        required: false
        default: false
        type: boolean
      write_cosmos_temporal_knowledge_test:
        description: "Generate and commit controlled Cosmos Temporal Knowledge v0.1 output"
        required: false
        default: false
        type: boolean
      write_cosmos_first_party_identity_test:
        description: "Generate and commit controlled Cosmos First-Party Identity v0.1 output"
        required: false
        default: false
        type: boolean
      write_cosmos_article_presentation_test:
        description: "Write controlled Cosmos Article Presentation v0.1 HTML test output"
        required: false
        default: false
        type: boolean
      write_cosmos_article_production_test:
        description: "Write controlled Cosmos Production Article Integration v0.1 test output"
        required: false
        default: false
        type: boolean
      write_cosmos_dimensionless_projection_test:
        description: "Write controlled Cosmos Dimensionless Projection v0.1 test output"
        required: false
        default: false
        type: boolean
      write_cosmos_butterfly_grid_contract_test:
        description: "Write controlled Cosmos Butterfly Grid Contract v0.1 test output"
        required: false
        default: false
        type: boolean
      write_cosmos_universal_object_model_test:
        description: "Write controlled Cosmos Universal Object Model v0.1 test output"
        required: false
        default: false
        type: boolean
      write_cosmos_entry_experience_test:
        description: "Write controlled Cosmos Entry Experience v0.1 test output"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  controlled-outputs:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync With Latest Branch Tip
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          echo "Workspace synchronized to origin/${GITHUB_REF_NAME}."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Real Cosmos State Output
        if: ${{ inputs.write_cosmos_state == true }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Generating real Cosmos State from current committed Cosmos data."
          echo "No OpenAI/API generation is executed by this step."

          node scripts/cosmos_state_builder.cjs

          test -f knowledge/cosmos/cosmos-state-current.json

          node <<'NODE'
          const fs = require("fs");

          const file = "knowledge/cosmos/cosmos-state-current.json";
          const payload = JSON.parse(fs.readFileSync(file, "utf8"));

          if (payload.schema_version !== "0.6") {
            throw new Error(
              `Unexpected Cosmos State schema_version: ${payload.schema_version}`
            );
          }

          if (payload.status !== "ready") {
            throw new Error(`Invalid Cosmos State status: ${payload.status}`);
          }

          if (
            payload.methodology?.reasoning_mode !==
            "deterministic_cosmos_state_synthesis"
          ) {
            throw new Error("Cosmos State methodology missing");
          }

          if (
            payload.safeguards?.forecast !== false ||
            payload.safeguards?.evidence_quality_upgraded !== false
          ) {
            throw new Error("Cosmos State safeguards invalid");
          }

          if (!Array.isArray(payload.attention?.clusters)) {
            throw new Error("Cosmos State attention.clusters[] missing");
          }

          if (payload.attention.clusters.length > 5) {
            throw new Error(
              `Cosmos State must retain at most 5 distinct bounded systems; found ${payload.attention.clusters.length}`
            );
          }

          for (const cluster of payload.attention.clusters) {
            if (!Array.isArray(cluster.member_attention_ids) || cluster.member_attention_ids.length < 2) {
              throw new Error(
                `Cosmos State cluster ${cluster.cluster_id || "unknown"} is not a real multi-member bounded system`
              );
            }

            if (cluster.member_attention_ids.length > 7) {
              throw new Error(
                `Cosmos State cluster ${cluster.cluster_id || "unknown"} exceeds v0.6 7-member bound`
              );
            }

            if (
              !cluster.anchor_attention_id ||
              !["emergence", "pattern"].includes(cluster.anchor_type) ||
              !Array.isArray(cluster.anchor_entity_ids) ||
              cluster.anchor_entity_ids.length < 1
            ) {
              throw new Error(
                `Cosmos State cluster ${cluster.cluster_id || "unknown"} missing valid v0.6 anchor identity`
              );
            }

            if (typeof cluster.cross_family !== "boolean") {
              throw new Error(
                `Cosmos State cluster ${cluster.cluster_id || "unknown"} missing cross_family`
              );
            }

            if (!cluster.member_type_counts || typeof cluster.member_type_counts !== "object") {
              throw new Error(
                `Cosmos State cluster ${cluster.cluster_id || "unknown"} missing member_type_counts`
              );
            }

            if (Number(cluster.member_type_counts.impact || 0) < 1) {
              throw new Error(
                `Cosmos State cluster ${cluster.cluster_id || "unknown"} must contain at least 1 Impact member in v0.6`
              );
            }

            if (Number(cluster.member_type_counts.emergence || 0) > 3) {
              throw new Error(
                `Cosmos State cluster ${cluster.cluster_id || "unknown"} exceeds v0.6 Emergence cap`
              );
            }

            const interpretation = String(cluster.interpretation || "").toLowerCase();
            if (
              !interpretation.includes("qualifies directly against the original anchor") ||
              !interpretation.includes("membership is not transitive") ||
              !interpretation.includes("anchor identity is preserved") ||
              !interpretation.includes("relevant impact signals are explicitly admitted") ||
              !interpretation.includes("near-duplicate emergence signals are suppressed") ||
              !interpretation.includes("does not establish new causality") ||
              !interpretation.includes("verification") ||
              !interpretation.includes("forecast")
            ) {
              throw new Error(
                `Cosmos State cluster ${cluster.cluster_id || "unknown"} missing v0.6 bounded-system safeguard`
              );
            }
          }

          const counts = payload.counts || {};

          if (Number(counts.attention_cluster_members_max || 0) > 7) {
            throw new Error("Cosmos State attention_cluster_members_max exceeds 7");
          }

          if (Number(counts.attention_distinct_system_target_max || 0) !== 5) {
            throw new Error("Cosmos State attention_distinct_system_target_max must equal 5");
          }

          if (
            Number(counts.attention_cross_family_clusters || 0) >
            Number(counts.attention_clusters || 0)
          ) {
            throw new Error("Cosmos State cross-family cluster count invalid");
          }

          if (
            Number(counts.attention_clusters_with_impact || 0) !==
            Number(counts.attention_clusters || 0)
          ) {
            throw new Error(
              `Cosmos State v0.6 requires every retained system to contain Impact; ` +
              `with-impact=${counts.attention_clusters_with_impact}, ` +
              `clusters=${counts.attention_clusters}`
            );
          }

          if (
            Number(counts.attention_cluster_emergence_members_max || 0) > 3
          ) {
            throw new Error(
              "Cosmos State v0.6 attention_cluster_emergence_members_max exceeds 3"
            );
          }

          if (
            Number(counts.attention_patterns || 0) > 8 ||
            Number(counts.attention_emergences || 0) > 6 ||
            Number(counts.attention_impacts || 0) > 6
          ) {
            throw new Error("Cosmos State attention diversity quota invalid");
          }

          console.log("");
          console.log("Real Cosmos State output created.");
          console.log(`Date:       ${payload.date_utc}`);
          console.log(`Attention:  ${payload.counts?.attention_retained ?? 0}`);
          console.log(`Clusters:   ${payload.counts?.attention_clusters ?? 0}`);
          console.log(`With Impact:${payload.counts?.attention_clusters_with_impact ?? 0}`);
          console.log(`Max Emerg.: ${payload.counts?.attention_cluster_emergence_members_max ?? 0}`);
          console.log(`Output:     ${file}`);
          NODE

      - name: Commit Real Cosmos State Output
        if: ${{ inputs.write_cosmos_state == true }}
        shell: bash
        run: |
          set -euo pipefail

          DATE_UTC="$(node -p "require('./knowledge/cosmos/cosmos-state-current.json').date_utc")"
          HISTORY_FILE="knowledge/cosmos/cosmos-state-history/${DATE_UTC}.json"

          if [ ! -f "$HISTORY_FILE" ]; then
            echo "ERROR: Expected Cosmos State history file was not generated: $HISTORY_FILE"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            knowledge/cosmos/cosmos-state-current.json \
            "$HISTORY_FILE"

          if git diff --cached --quiet; then
            echo "No Cosmos State changes to commit."
          else
            git commit -m "Update Cosmos state ${DATE_UTC}"
            # Another workflow may have updated main while this job was running.
            # Rebase this generated-output commit onto the latest remote tip before pushing.
            pushed=false
            for attempt in 1 2 3; do
              echo "Synchronizing with origin/${GITHUB_REF_NAME} before push (attempt ${attempt}/3)..."
              git fetch origin "${GITHUB_REF_NAME}"

              if ! git rebase "origin/${GITHUB_REF_NAME}"; then
                echo "ERROR: Could not rebase generated Cosmos output onto latest ${GITHUB_REF_NAME}."
                git rebase --abort || true
                exit 1
              fi

              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                pushed=true
                break
              fi

              echo "Remote changed again before push; retrying..."
              sleep $((attempt * 2))
            done

            if [ "$pushed" != "true" ]; then
              echo "ERROR: Could not push after 3 synchronization attempts."
              exit 1
            fi
          fi

          echo ""
          echo "Real Cosmos State output is now committed to the repository."
          echo "No OpenAI generation was executed."

      - name: Generate Real Cosmos Core v0.1 Test Output
        if: ${{ inputs.write_cosmos_core_test == true }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Generating controlled Cosmos Core v0.1 output from frozen Cosmos State."
          echo "No OpenAI/API generation is executed by this step."

          cat > /tmp/cosmos-core-input-v0.1.json <<'JSON'
          {
            "text": "What could AI data-center growth affect?",
            "language": "en",
            "entity_hints": [
              "Artificial Intelligence",
              "Data Centers"
            ],
            "mode": "open",
            "metadata": {
              "purpose": "controlled_repository_test"
            }
          }
          JSON

          node scripts/cosmos_core.cjs \
            --input /tmp/cosmos-core-input-v0.1.json \
            --out knowledge/cosmos/core-test-v0.1.json

          test -f knowledge/cosmos/core-test-v0.1.json

          node <<'NODE'
          const fs = require("fs");

          const file = "knowledge/cosmos/core-test-v0.1.json";
          const payload = JSON.parse(fs.readFileSync(file, "utf8"));

          if (payload.schema_version !== "0.1") {
            throw new Error(
              `Unexpected Cosmos Core schema_version: ${payload.schema_version}`
            );
          }

          if (payload.status !== "context_resolved") {
            throw new Error(
              `Cosmos Core failed to resolve controlled context: ${payload.status}`
            );
          }

          if (payload.knowledge_state?.cosmos_state_schema_version !== "0.6") {
            throw new Error(
              "Cosmos Core did not consume frozen Cosmos State v0.6"
            );
          }

          if (payload.infinite_state?.terminal !== false ||
              payload.infinite_state?.continuation_allowed !== true) {
            throw new Error(
              "Cosmos Core Infinite State continuation safeguards invalid"
            );
          }

          if (payload.safeguards?.creates_new_causal_claims !== false ||
              payload.safeguards?.upgrades_evidence_quality !== false ||
              payload.safeguards?.forecast_generated !== false ||
              payload.safeguards?.sector_whitelist_present !== false) {
            throw new Error(
              "Cosmos Core safeguards invalid"
            );
          }

          console.log("");
          console.log("Real controlled Cosmos Core v0.1 output created.");
          console.log(`Status:        ${payload.status}`);
          console.log(
            `Starting:      ${(payload.resolution?.starting_points || []).map(x => x.name).join(" | ")}`
          );
          console.log(
            `Systems:       ${(payload.selected_context?.systems || []).length}`
          );
          console.log(
            `Relationships: ${(payload.selected_context?.relationships || []).length}`
          );
          console.log(`Output:        ${file}`);
          NODE

      - name: Commit Real Cosmos Core v0.1 Test Output
        if: ${{ inputs.write_cosmos_core_test == true }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add knowledge/cosmos/core-test-v0.1.json

          if git diff --cached --quiet; then
            echo "No Cosmos Core test changes to commit."
          else
            git commit -m "Add Cosmos Core v0.1 controlled test output"
            # Another workflow may have updated main while this job was running.
            # Rebase this generated-output commit onto the latest remote tip before pushing.
            pushed=false
            for attempt in 1 2 3; do
              echo "Synchronizing with origin/${GITHUB_REF_NAME} before push (attempt ${attempt}/3)..."
              git fetch origin "${GITHUB_REF_NAME}"

              if ! git rebase "origin/${GITHUB_REF_NAME}"; then
                echo "ERROR: Could not rebase generated Cosmos output onto latest ${GITHUB_REF_NAME}."
                git rebase --abort || true
                exit 1
              fi

              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                pushed=true
                break
              fi

              echo "Remote changed again before push; retrying..."
              sleep $((attempt * 2))
            done

            if [ "$pushed" != "true" ]; then
              echo "ERROR: Could not push after 3 synchronization attempts."
              exit 1
            fi
          fi

          echo ""
          echo "Controlled Cosmos Core v0.1 output is now committed."
          echo "No OpenAI generation was executed."

      - name: Generate Real Cosmos Attention v0.2 Test Output
        if: ${{ inputs.write_cosmos_attention_test == true }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Generating controlled Cosmos Attention v0.2 output."
          echo "No OpenAI/API generation is executed by this step."

          cat > /tmp/cosmos-attention-core-input-v0.2.json <<'JSON'
          {
            "text": "What could AI data-center growth affect?",
            "language": "en",
            "entity_hints": [
              "Artificial Intelligence",
              "Data Centers"
            ],
            "mode": "open",
            "metadata": {
              "purpose": "controlled_attention_repository_test"
            }
          }
          JSON

          node scripts/cosmos_core.cjs \
            --input /tmp/cosmos-attention-core-input-v0.2.json \
            --out /tmp/core-for-attention-v0.2.json

          node scripts/cosmos_attention.cjs \
            --input /tmp/core-for-attention-v0.2.json \
            --out knowledge/cosmos/attention-test-v0.2.json

          test -f knowledge/cosmos/attention-test-v0.2.json

          node <<'NODE'
          const fs = require("fs");
          const file = "knowledge/cosmos/attention-test-v0.2.json";
          const payload = JSON.parse(fs.readFileSync(file, "utf8"));

          if (payload.schema_version !== "0.2") {
            throw new Error(
              `Unexpected Cosmos Attention schema_version: ${payload.schema_version}`
            );
          }

          if (payload.status !== "attention_resolved") {
            throw new Error(
              `Cosmos Attention failed to resolve: ${payload.status}`
            );
          }

          const active = payload.active_context || {};
          const budget = payload.attention_state?.budget || {};
          const suppressed = payload.attention_state?.suppressed_count || {};

          if ((active.primary_pathways || []).length < 1 ||
              (active.primary_pathways || []).length >
                Number(budget.primary_pathways || 0)) {
            throw new Error("Cosmos Attention primary pathway count invalid");
          }

          const primaryPathways = active.primary_pathways || [];
          const rawEntityPattern = /^ent_[a-z0-9]+$/i;

          for (const pathway of primaryPathways) {
            const fromName = String(pathway.from?.name || "").trim();
            const toName = String(pathway.to?.name || "").trim();

            if (!fromName || !toName ||
                rawEntityPattern.test(fromName) ||
                rawEntityPattern.test(toName) ||
                fromName === pathway.from?.entity_id ||
                toName === pathway.to?.entity_id) {
              throw new Error(
                `Cosmos Attention v0.2 primary pathway exposes unresolved entity: ${pathway.pathway_id || "unknown"}`
              );
            }

            if (!Number.isFinite(Number(pathway.relationship?.semantic_adjustment))) {
              throw new Error(
                `Cosmos Attention v0.2 pathway missing semantic adjustment: ${pathway.pathway_id || "unknown"}`
              );
            }
          }

          const locatedInPrimary = primaryPathways.filter(
            pathway =>
              String(pathway.relationship?.type || "").toUpperCase() === "LOCATED_IN"
          );

          const consequencePrimary = primaryPathways.filter(pathway =>
            ["AFFECTS", "IMPACTS", "DRIVES", "REQUIRES", "DEPENDS_ON",
             "CONSTRAINS", "ENABLES", "CAUSES", "INCREASES", "DECREASES",
             "SUPPLIES", "SUPPORTS"].includes(
              String(pathway.relationship?.type || "").toUpperCase()
            )
          );

          if (locatedInPrimary.length > 0 && consequencePrimary.length > 0) {
            const bestLocated = Math.max(
              ...locatedInPrimary.map(x => Number(x.score || 0))
            );
            const bestConsequence = Math.max(
              ...consequencePrimary.map(x => Number(x.score || 0))
            );

            if (bestLocated >= bestConsequence) {
              throw new Error(
                "Cosmos Attention v0.2 LOCATED_IN pathway outranks consequence pathway for impact question"
              );
            }
          }

          if ((active.patterns || []).length > Number(budget.patterns || 0) ||
              (active.emergences || []).length > Number(budget.emergences || 0) ||
              (active.impacts || []).length > Number(budget.impacts || 0) ||
              (active.relationships || []).length > Number(budget.relationships || 0)) {
            throw new Error(
              "Cosmos Attention active context exceeds configured budget"
            );
          }

          for (const key of ["patterns", "emergences", "impacts", "relationships"]) {
            const discovered = Number(suppressed[key]?.discovered || 0);
            const activeCount = Number(suppressed[key]?.active || 0);
            const expandable =
              Number(suppressed[key]?.available_for_expansion || 0);

            if (activeCount + expandable !== discovered) {
              throw new Error(
                `Cosmos Attention ${key} existence-preservation invariant failed`
              );
            }
          }

          if (payload.infinite_state?.terminal !== false ||
              payload.infinite_state?.continuation_allowed !== true ||
              payload.infinite_state?.attention_can_move !== true ||
              payload.infinite_state?.underlying_context_preserved !== true) {
            throw new Error("Cosmos Attention Infinite State safeguards invalid");
          }

          if (payload.safeguards?.creates_new_causal_claims !== false ||
              payload.safeguards?.upgrades_evidence_quality !== false ||
              payload.safeguards?.forecast_generated !== false ||
              payload.safeguards?.sector_whitelist_present !== false ||
              payload.safeguards?.visibility_suppression_only !== true ||
              payload.safeguards?.existence_preserved !== true ||
              payload.safeguards?.primary_pathways_require_resolved_entities !== true ||
              payload.safeguards?.descriptive_relationships_are_intent_weighted !== true ||
              payload.safeguards?.source_lineage_preserved !== true) {
            throw new Error("Cosmos Attention safeguards invalid");
          }

          console.log("");
          console.log("Real controlled Cosmos Attention v0.2 output created.");
          console.log(`Status:           ${payload.status}`);
          console.log(`Primary paths:    ${(active.primary_pathways || []).length}`);
          console.log(
            `Patterns:         ${suppressed.patterns?.discovered || 0} -> ${(active.patterns || []).length}`
          );
          console.log(
            `Emergences:       ${suppressed.emergences?.discovered || 0} -> ${(active.emergences || []).length}`
          );
          console.log(
            `Impacts:          ${suppressed.impacts?.discovered || 0} -> ${(active.impacts || []).length}`
          );
          console.log(
            `Relationships:    ${suppressed.relationships?.discovered || 0} -> ${(active.relationships || []).length}`
          );
          console.log(`Output:           ${file}`);
          NODE

      - name: Commit Real Cosmos Attention v0.2 Test Output
        if: ${{ inputs.write_cosmos_attention_test == true }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add knowledge/cosmos/attention-test-v0.2.json

          if git diff --cached --quiet; then
            echo "No Cosmos Attention test changes to commit."
          else
            git commit -m "Add Cosmos Attention v0.2 controlled test output"
            # Another workflow may have updated main while this job was running.
            # Rebase this generated-output commit onto the latest remote tip before pushing.
            pushed=false
            for attempt in 1 2 3; do
              echo "Synchronizing with origin/${GITHUB_REF_NAME} before push (attempt ${attempt}/3)..."
              git fetch origin "${GITHUB_REF_NAME}"

              if ! git rebase "origin/${GITHUB_REF_NAME}"; then
                echo "ERROR: Could not rebase generated Cosmos output onto latest ${GITHUB_REF_NAME}."
                git rebase --abort || true
                exit 1
              fi

              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                pushed=true
                break
              fi

              echo "Remote changed again before push; retrying..."
              sleep $((attempt * 2))
            done

            if [ "$pushed" != "true" ]; then
              echo "ERROR: Could not push after 3 synchronization attempts."
              exit 1
            fi
          fi

          echo ""
          echo "Controlled Cosmos Attention v0.2 output is now committed."
          echo "No OpenAI generation was executed."

      - name: Generate Real Cosmos Consequence v0.1 Test Output
        if: ${{ inputs.write_cosmos_consequence_test == true }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Generating controlled Cosmos Consequence v0.1 output."
          echo "No OpenAI/API generation is executed by this step."

          cat > /tmp/cosmos-consequence-core-input-v0.1.json <<'JSON'
          {
            "text": "What could AI data-center growth affect?",
            "language": "en",
            "entity_hints": [

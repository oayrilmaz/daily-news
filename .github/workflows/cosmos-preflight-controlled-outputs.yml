            status:"cosmos_knowledge_completion_acquisition_source_strategy_resolver_integration_test_passed",
            question:input.question,
            subject:input.subject_match,
            acquisition:{
              status:acquisition.status,
              plan_count:(acquisition.acquisition_plans||[]).length
            },
            acquisition_execution:{
              status:execution.status,
              next_stage:execution.next_stage,
              source_strategy_unresolved_count:execution.execution_state?.source_strategy_unresolved_count
            },
            source_strategy_resolution:{
              status:resolved.status,
              resolved_request_count:requests.length,
              source_strategy_row_count:sourceRows.length,
              next_stage:resolved.next_stage,
              external_adapter_queue_count:adapterQueue.length,
              external_execution_connected:state.external_execution_connected,
              network_execution_performed:state.network_execution_performed
            },
            source_strategy:sourceRows,
            contracts:resolved.contracts,
            safeguards:resolved.safeguards,
            protected_boundaries:{
              evidence_validation_count:state.evidence_validation_count,
              knowledge_admission_count:state.knowledge_admission_count,
              graph_write_count:state.graph_write_count
            }
          };

          fs.writeFileSync(testFile,JSON.stringify(result,null,2)+"\n");
          console.log(JSON.stringify(result,null,2));
          NODE

          git add "$OUTPUT_DIR"

          if git diff --cached --quiet; then
            echo "No Acquisition Source Strategy Resolver output changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

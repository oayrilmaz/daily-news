          const fail=m=>{console.error(m);process.exit(1)};

          if(execution.status!=="knowledge_completion_source_strategy_required" ||
             execution.next_stage!=="acquisition_source_strategy_resolver"){
            fail("Acquisition Execution did not expose source-strategy gap.");
          }

          const requests=resolved.execution_requests||[];
          const adapterQueue=resolved.future_adapter_queue||[];
          const state=resolved.resolution_state||{};

          if(resolved.status!=="knowledge_completion_source_strategy_resolved" ||
             resolved.next_stage!=="external_acquisition_adapter" ||
             requests.length<1 ||
             adapterQueue.length!==requests.length){
            fail("Source Strategy Resolver output invalid.");
          }

          const sourceTypes=new Set();
          const sourceRows=[];

          for(const request of requests){
            const strategy=request.source_strategy||[];
            if(strategy.length<1){
              fail("Resolved request contains empty source strategy.");
            }

            let previous=Infinity;
            for(const source of strategy){
              sourceTypes.add(source.source_type);
              sourceRows.push({
                execution_request_id:request.execution_request_id,
                source_rank:source.source_rank,
                source_type:source.source_type,
                authority_score:source.authority_score,
                priority:source.priority,
                acquisition_status:source.acquisition_status,
                execution_adapter:source.execution_adapter,
                search_status:source.search_status
              });

              if(!Number.isFinite(Number(source.authority_score)) ||
                 Number(source.authority_score)>previous+1e-9 ||
                 source.acquisition_status!=="planned" ||
                 source.execution_adapter!=="unassigned" ||
                 source.search_status!=="not_started"){
                fail("Source strategy row violates planning boundary.");
              }
              previous=Number(source.authority_score);
            }
          }


             state.unresolved_count!==0 ||
             state.external_execution_connected!==false ||
             state.network_execution_performed!==false ||
             Number(state.evidence_validation_count)!==0 ||
             Number(state.knowledge_admission_count)!==0 ||
             Number(state.graph_write_count)!==0){
            fail("Source Strategy Resolver crossed protected boundary.");
          }

          if(!Object.values(resolved.contracts||{}).every(Boolean)){
            fail("Source Strategy Resolver contracts failed.");
          }
          if(!Object.values(resolved.safeguards||{}).every(v=>v===false)){
            fail("Source Strategy Resolver safeguards failed.");
          }

          const result={

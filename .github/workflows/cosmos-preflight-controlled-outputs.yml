            "manufacturer_or_oem_technical_document",
            "utility_or_owner_engineering_standard",
            "regulatory_or_government_document",
            "industry_body_or_research_institution"
          ]){
            if(!sourceTypes.has(required)){
              fail(`Controlled source strategy missing ${required}`);
            }
          }


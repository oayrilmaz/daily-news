             requests.length<1){
            fail("Acquisition Execution output invalid.");
          }

          for(const request of requests){
            if(!Array.isArray(request.query_templates) ||
               request.query_templates.length<1 ||
               !Array.isArray(request.source_strategy) ||
               !["adapter_required","source_strategy_required"].includes(request.execution?.mode) ||
               request.execution?.executor_status!=="not_connected" ||
               request.execution?.network_execution_performed!==false ||
               request.epistemic_boundary?.results_are_observations_not_facts!==true ||
               request.epistemic_boundary?.candidate_validation_required!==true ||
               request.epistemic_boundary?.evidence_validation_required!==true ||
               request.epistemic_boundary?.knowledge_admission_required!==true){

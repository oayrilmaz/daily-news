            }
          }

          const state=execution.execution_state||{};
          if(state.external_execution_connected!==false ||
             state.network_execution_performed!==false ||
             Number(state.normalized_observation_count)!==0 ||
             Number(state.candidate_validation_count)!==0 ||
             Number(state.evidence_validation_count)!==0 ||
             Number(state.knowledge_admission_count)!==0 ||
             Number(state.graph_write_count)!==0){

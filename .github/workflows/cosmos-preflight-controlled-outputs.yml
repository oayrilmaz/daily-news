          const fs=require("fs");
          const [inputFile,acqFile,execFile,resolvedFile,testFile]=process.argv.slice(2);

          const input=JSON.parse(fs.readFileSync(inputFile,"utf8"));
          const acquisition=JSON.parse(fs.readFileSync(acqFile,"utf8"));

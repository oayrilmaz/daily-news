          if(nstate.validation_performed!==false ||
             nstate.knowledge_admission_performed!==false ||
             nstate.graph_write_performed!==false){
            fail("Normalization crossed protected boundary.");
          }

          if(!Object.values(provider.contracts||{}).every(Boolean) ||
             !Object.values(normalized.contracts||{}).every(Boolean)){
            fail("Connector/normalization contracts failed.");
          }

          if(!Object.values(provider.safeguards||{}).every(v=>v===false) ||
             !Object.values(normalized.safeguards||{}).every(v=>v===false)){
            fail("Connector/normalization safeguards failed.");
          }

          const result={
            schema_version:"0.1",
            status:"cosmos_knowledge_completion_external_provider_connector_integration_test_passed",
            question:input.question,
            subject:input.subject_match,
            source_strategy:{
              status:strategy.status,
              resolved_request_count:strategy.resolution_state?.resolved_count,
              next_stage:strategy.next_stage
            },
            external_acquisition_adapter:{
              status:requests.status,
              provider_request_count:providerRequests.length,
              next_stage:requests.next_stage
            },
            external_provider_connector:{
              status:provider.status,
              provider_name:provider.provider_name,
              provider_mode:provider.provider_mode,
              provider_result_count:providerResults.length,
              external_provider_connected:pstate.external_provider_connected,
              network_execution_performed:pstate.network_execution_performed,
              next_stage:provider.next_stage
            },
            normalization:{
              status:normalized.status,
              normalized_observation_count:observations.length,
              rejected_result_count:(normalized.rejected_results||[]).length,
              next_stage:normalized.next_stage
            },
            contracts:{
              provider_request_lineage_preserved:provider.contracts?.provider_request_lineage_preserved,
              requested_source_constraint_preserved_separately:provider.contracts?.requested_source_constraint_preserved_separately,
              returned_source_type_not_assumed_from_request:provider.contracts?.returned_source_type_not_assumed_from_request,
              returned_authority_not_assumed_from_request:provider.contracts?.returned_authority_not_assumed_from_request,
              provider_results_preserved_as_unvalidated_observations:normalized.contracts?.provider_results_preserved_as_unvalidated_observations,
              validation_required_before_admission:normalized.contracts?.validation_required_before_admission
            },
            safeguards:{
              connector:provider.safeguards,
              normalization:normalized.safeguards
            },
            protected_boundaries:{
              provider_network_execution_performed:pstate.network_execution_performed,
              validation_performed:nstate.validation_performed,
              knowledge_admission_performed:nstate.knowledge_admission_performed,
              graph_write_performed:nstate.graph_write_performed
            }
          };

          fs.writeFileSync(testFile,JSON.stringify(result,null,2)+"\n");
          console.log(JSON.stringify(result,null,2));
          NODE

          git add "$OUTPUT_DIR"

          if git diff --cached --quiet; then
            echo "No External Provider Connector controlled-output changes to commit."

              "Cosmos Acquisition did not consume Discovery v0.1"
            );
          }

          const plans = payload.acquisition_plans || [];
          const executorQueue = payload.future_executor_queue || [];

          if (!Array.isArray(plans) || plans.length < 1) {
            throw new Error(
              "Controlled Acquisition output produced no acquisition plans"
            );
          }

          if (!Array.isArray(executorQueue) ||
              executorQueue.length !== plans.length) {
            throw new Error(
              "Controlled Acquisition output executor queue invalid"
            );
          }

          if (payload.acquisition_state?.execution_mode !== "planned_only" ||
              payload.acquisition_state?.external_execution_connected !== false ||
              payload.acquisition_state?.evidence_validation_required_before_graph_admission !== true ||
              payload.acquisition_state?.conceptual_distance_limit !== null ||
              payload.acquisition_state?.continuation_possible !== true) {
            throw new Error(
              "Cosmos Acquisition state invariants invalid"
            );
          }

          for (const plan of plans) {

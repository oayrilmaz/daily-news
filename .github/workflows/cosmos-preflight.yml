                !Array.isArray(plan.query_templates) ||
                plan.query_templates.length < 1 ||
                !Array.isArray(plan.source_strategy) ||
                plan.source_strategy.length < 1 ||
                plan.evidence_contract?.evidence_is_not_knowledge_until_validated !== true ||

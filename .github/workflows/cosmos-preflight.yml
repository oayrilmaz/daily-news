      - name: Test Cosmos Attention v0.2 In Isolated Workspace
        shell: bash
        run: |
          set -euo pipefail

          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEST_DIR"' EXIT

          mkdir -p "$TEST_DIR/scripts"
          mkdir -p "$TEST_DIR/knowledge/cosmos"

          cp scripts/cosmos_core.cjs "$TEST_DIR/scripts/cosmos_core.cjs"
          cp scripts/cosmos_attention.cjs "$TEST_DIR/scripts/cosmos_attention.cjs"
          cp knowledge/cosmos/cosmos-state-current.json \
            "$TEST_DIR/knowledge/cosmos/cosmos-state-current.json"

          cat > "$TEST_DIR/core-input.json" <<'JSON'
          {
            "text": "What could AI data-center growth affect?",
            "language": "en",
            "entity_hints": [
              "Artificial Intelligence",
              "Data Centers"
            ],
            "mode": "open",
            "metadata": {
              "purpose": "cosmos_attention_v0.2_preflight"
            }
          }
          JSON

          (
            cd "$TEST_DIR"
            node scripts/cosmos_core.cjs \
              --input core-input.json \
              --out knowledge/cosmos/core-test-v0.1.json

            node scripts/cosmos_attention.cjs \
              --input knowledge/cosmos/core-test-v0.1.json \
              --out knowledge/cosmos/attention-test-v0.2.json
          )

          TEST_DIR="$TEST_DIR" node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const root = process.env.TEST_DIR;
          const coreFile = path.join(root, "knowledge/cosmos/core-test-v0.1.json");
          const attentionFile = path.join(root, "knowledge/cosmos/attention-test-v0.2.json");

          if (!fs.existsSync(coreFile)) {
            throw new Error("Cosmos Core did not create the controlled core test output.");
          }

          if (!fs.existsSync(attentionFile)) {
            throw new Error(
              "Cosmos Attention did not create knowledge/cosmos/attention-test-v0.2.json"
            );
          }

          const core = JSON.parse(fs.readFileSync(coreFile, "utf8"));
          const payload = JSON.parse(fs.readFileSync(attentionFile, "utf8"));
          const errors = [];

          if (payload.schema_version !== "0.2") {
            errors.push(
              `Unexpected Cosmos Attention schema_version: ${payload.schema_version}`
            );
          }

          if (payload.status !== "attention_resolved") {
            errors.push(
              `Cosmos Attention failed to resolve attention: ${payload.status}`
            );
          }

          if (payload.source_core?.schema_version !== "0.1") {
            errors.push(
              `Cosmos Attention must consume Cosmos Core schema 0.1; got ${payload.source_core?.schema_version}`
            );
          }

          const active = payload.active_context || {};
          const state = payload.attention_state || {};
          const budget = state.budget || {};
          const suppressed = state.suppressed_count || {};
          const coreContext = core.selected_context || {};

          for (const key of [
            "systems", "attention", "patterns", "emergences", "impacts",
            "developments", "relationships", "entities", "primary_pathways"
          ]) {
            if (!Array.isArray(active[key])) {
              errors.push(`Cosmos Attention active_context.${key}[] missing`);
            }
          }

          if ((active.primary_pathways || []).length < 1) {
            errors.push("Cosmos Attention controlled test produced no primary pathways");
          }

          if ((active.primary_pathways || []).length > Number(budget.primary_pathways || 0)) {
            errors.push("Cosmos Attention primary pathway budget exceeded");
          }

          const budgetChecks = [
            ["patterns", "patterns"], ["emergences", "emergences"],
            ["impacts", "impacts"], ["developments", "developments"],
            ["relationships", "relationships"], ["entities", "entities"],
            ["systems", "systems"], ["attention", "attention"]
          ];

          for (const [key, budgetKey] of budgetChecks) {
            if ((active[key] || []).length > Number(budget[budgetKey] || 0)) {
              errors.push(
                `Cosmos Attention active ${key} exceeds budget ${budget[budgetKey]}`
              );
            }
          }

          for (const key of [
            "patterns", "emergences", "impacts", "developments",
            "relationships", "entities", "systems", "attention"
          ]) {
            const discovered = Number(suppressed[key]?.discovered || 0);
            const activeCount = Number(suppressed[key]?.active || 0);
            const expandableCount =
              Number(suppressed[key]?.available_for_expansion || 0);

            if (discovered !== (coreContext[key] || []).length) {
              errors.push(
                `Cosmos Attention ${key} discovered count ${discovered} does not match Core ${(coreContext[key] || []).length}`
              );
            }

            if (activeCount + expandableCount !== discovered) {
              errors.push(
                `Cosmos Attention ${key} violates existence preservation: active ${activeCount} + expandable ${expandableCount} != discovered ${discovered}`
              );
            }
          }

          if (state.attention_mode !== "infinite_attention") {
            errors.push(
              `Cosmos Attention has invalid attention_mode: ${state.attention_mode}`
            );
          }

          if (!String(state.principle || "").toLowerCase().includes(
            "attention may suppress visibility"
          )) {
            errors.push("Cosmos Attention infinite-attention principle missing");
          }

          const expectedDimensions = [
            "question_relevance", "directness", "structural_strength",
            "confidence", "temporal_relevance", "emergence_novelty",
            "evidence_factor", "diversity", "relationship_semantics",
            "pathway_resolvability", "pathway_coverage"
          ];

          for (const dimension of expectedDimensions) {
            if (!(state.ranking_dimensions || []).includes(dimension)) {
              errors.push(
                `Cosmos Attention ranking dimension missing: ${dimension}`
              );
            }
          }

          const pathwayIntel = state.pathway_intelligence || {};

          if (pathwayIntel.intent_sensitive !== true) {
            errors.push(
              "Cosmos Attention v0.2 pathway intelligence must be intent-sensitive"
            );
          }

          if (pathwayIntel.unresolved_entities_excluded_from_primary_pathways !== true) {
            errors.push(
              "Cosmos Attention v0.2 must exclude unresolved entities from primary pathways"
            );
          }

          if (pathwayIntel.descriptive_relationships_downranked_for_impact_intent !== true) {
            errors.push(
              "Cosmos Attention v0.2 must down-rank descriptive relationships for impact intent"
            );
          }

          if (pathwayIntel.diversity_coverage_applied !== true) {
            errors.push(
              "Cosmos Attention v0.2 pathway diversity/coverage safeguard missing"
            );
          }

          for (const key of [
            "patterns", "emergences", "impacts", "relationships", "entities"
          ]) {
            for (const row of active[key] || []) {
              const attn = row._attention;
              if (!attn || !Number.isFinite(Number(attn.score))) {
                errors.push(
                  `Cosmos Attention active ${key} item is missing attention score`
                );
              }
              if (!Array.isArray(attn?.reasons)) {
                errors.push(
                  `Cosmos Attention active ${key} item is missing attention reasons`
                );
              }
            }
          }

          const primaryPathways = active.primary_pathways || [];
          const rawEntityPattern = /^ent_[a-z0-9]+$/i;

          for (const pathway of primaryPathways) {
            if (!pathway.pathway_id ||
                !pathway.from?.entity_id ||
                !pathway.to?.entity_id ||
                !pathway.relationship?.relationship_id) {
              errors.push(
                "Cosmos Attention primary pathway missing identity/lineage fields"
              );
            }

            const fromName = String(pathway.from?.name || "").trim();
            const toName = String(pathway.to?.name || "").trim();

            if (!fromName || !toName ||
                rawEntityPattern.test(fromName) ||
                rawEntityPattern.test(toName) ||
                fromName === pathway.from?.entity_id ||
                toName === pathway.to?.entity_id) {
              errors.push(
                `Cosmos Attention pathway ${pathway.pathway_id || "(unknown)"} exposes an unresolved entity`
              );
            }

            if (!Number.isFinite(Number(pathway.relationship?.semantic_adjustment))) {
              errors.push(
                `Cosmos Attention pathway ${pathway.pathway_id || "(unknown)"} missing semantic adjustment`
              );
            }

            if (!String(pathway.claim_rule || "").toLowerCase().includes(
              "does not establish new causality"
            )) {
              errors.push(
                `Cosmos Attention pathway ${pathway.pathway_id || "(unknown)"} missing no-new-causality safeguard`
              );
            }
          }

          const locatedInPrimary = primaryPathways.filter(
            pathway =>
              String(pathway.relationship?.type || "").toUpperCase() === "LOCATED_IN"
          );

          const consequencePrimary = primaryPathways.filter(pathway =>
            ["AFFECTS", "IMPACTS", "DRIVES", "REQUIRES", "DEPENDS_ON",
             "CONSTRAINS", "ENABLES", "CAUSES", "INCREASES", "DECREASES",
             "SUPPLIES", "SUPPORTS"].includes(
              String(pathway.relationship?.type || "").toUpperCase()
            )
          );

          if (locatedInPrimary.length > 0 && consequencePrimary.length > 0) {
            const bestLocated = Math.max(
              ...locatedInPrimary.map(x => Number(x.score || 0))
            );
            const bestConsequence = Math.max(
              ...consequencePrimary.map(x => Number(x.score || 0))
            );

            if (bestLocated >= bestConsequence) {
              errors.push(
                "Cosmos Attention v0.2 allows LOCATED_IN to outrank consequence pathways for an impact question"
              );
            }
          }

          if (payload.infinite_state?.terminal !== false) {
            errors.push("Cosmos Attention Infinite State must remain non-terminal");
          }
          if (payload.infinite_state?.continuation_allowed !== true) {
            errors.push("Cosmos Attention must preserve continuation");
          }
          if (payload.infinite_state?.attention_can_move !== true) {
            errors.push("Cosmos Attention must allow the attention center to move");
          }
          if (payload.infinite_state?.underlying_context_preserved !== true) {
            errors.push("Cosmos Attention must preserve underlying context");
          }

          const safeguards = payload.safeguards || {};

          if (safeguards.creates_new_causal_claims !== false) {
            errors.push("Cosmos Attention must not create new causal claims");
          }
          if (safeguards.upgrades_evidence_quality !== false) {
            errors.push("Cosmos Attention must not upgrade evidence quality");
          }
          if (safeguards.forecast_generated !== false) {
            errors.push("Cosmos Attention v0.2 must not generate forecasts");
          }
          if (safeguards.sector_whitelist_present !== false) {
            errors.push("Cosmos Attention must remain domain-neutral");
          }
          if (safeguards.visibility_suppression_only !== true ||
              safeguards.existence_preserved !== true) {
            errors.push(
              "Cosmos Attention must suppress visibility only while preserving existence"
            );
          }
          if (safeguards.primary_pathways_require_resolved_entities !== true) {
            errors.push(
              "Cosmos Attention v0.2 resolved-entity pathway safeguard missing"
            );
          }
          if (safeguards.descriptive_relationships_are_intent_weighted !== true) {
            errors.push(
              "Cosmos Attention v0.2 intent-weighted relationship safeguard missing"
            );
          }
          if (safeguards.source_lineage_preserved !== true) {
            errors.push("Cosmos Attention must preserve source lineage");
          }

          if (errors.length) {
            console.error("\nCosmos Attention v0.2 preflight errors:");
            for (const error of errors) console.error(`- ${error}`);
            process.exit(1);
          }

          console.log("");
          console.log("Cosmos Attention v0.2 isolated test passed.");
          console.log(`Status:             ${payload.status}`);
          console.log(`Primary pathways:   ${(active.primary_pathways || []).length}`);
          console.log(
            `Patterns:           ${(coreContext.patterns || []).length} discovered -> ${(active.patterns || []).length} active`
          );
          console.log(
            `Emergences:         ${(coreContext.emergences || []).length} discovered -> ${(active.emergences || []).length} active`
          );
          console.log(
            `Impacts:            ${(coreContext.impacts || []).length} discovered -> ${(active.impacts || []).length} active`
          );
          console.log(
            `Relationships:      ${(coreContext.relationships || []).length} discovered -> ${(active.relationships || []).length} active`
          );
          console.log(
            `Entities:           ${(coreContext.entities || []).length} discovered -> ${(active.entities || []).length} active`
          );
          console.log(
            "Infinite Attention budgets, existence preservation, movable attention, diversity and no-new-claims safeguards passed."
          );
          console.log(
            "Repository files were not modified by the isolated test."
          );
          NODE

      - name: Generate Real Cosmos State Output
        if: ${{ inputs.write_cosmos_state == true }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Generating real Cosmos State from current committed Cosmos data."
          echo "No OpenAI/API generation is executed by this step."

          node scripts/cosmos_state_builder.cjs

          test -f knowledge/cosmos/cosmos-state-current.json

          node <<'NODE'
          const fs = require("fs");

          const file = "knowledge/cosmos/cosmos-state-current.json";
          const payload = JSON.parse(fs.readFileSync(file, "utf8"));

          if (payload.schema_version !== "0.6") {
            throw new Error(
              `Unexpected Cosmos State schema_version: ${payload.schema_version}`
            );
          }

          if (payload.status !== "ready") {
            throw new Error(`Invalid Cosmos State status: ${payload.status}`);
          }

          if (
            payload.methodology?.reasoning_mode !==
            "deterministic_cosmos_state_synthesis"
          ) {
            throw new Error("Cosmos State methodology missing");
          }

          if (
            payload.safeguards?.forecast !== false ||
            payload.safeguards?.evidence_quality_upgraded !== false
          ) {
            throw new Error("Cosmos State safeguards invalid");
          }

          if (!Array.isArray(payload.attention?.clusters)) {
            throw new Error("Cosmos State attention.clusters[] missing");
          }

          if (payload.attention.clusters.length > 5) {
            throw new Error(
              `Cosmos State must retain at most 5 distinct bounded systems; found ${payload.attention.clusters.length}`
            );
          }

          for (const cluster of payload.attention.clusters) {
            if (!Array.isArray(cluster.member_attention_ids) || cluster.member_attention_ids.length < 2) {
              throw new Error(
                `Cosmos State cluster ${cluster.cluster_id || "unknown"} is not a real multi-member bounded system`
              );
            }

            if (cluster.member_attention_ids.length > 7) {
              throw new Error(
                `Cosmos State cluster ${cluster.cluster_id || "unknown"} exceeds v0.6 7-member bound`
              );
            }

            if (
              !cluster.anchor_attention_id ||
              !["emergence", "pattern"].includes(cluster.anchor_type) ||
              !Array.isArray(cluster.anchor_entity_ids) ||
              cluster.anchor_entity_ids.length < 1
            ) {
              throw new Error(
                `Cosmos State cluster ${cluster.cluster_id || "unknown"} missing valid v0.6 anchor identity`
              );
            }

            if (typeof cluster.cross_family !== "boolean") {
              throw new Error(
                `Cosmos State cluster ${cluster.cluster_id || "unknown"} missing cross_family`
              );
            }

            if (!cluster.member_type_counts || typeof cluster.member_type_counts !== "object") {
              throw new Error(
                `Cosmos State cluster ${cluster.cluster_id || "unknown"} missing member_type_counts`
              );
            }

            if (Number(cluster.member_type_counts.impact || 0) < 1) {
              throw new Error(
                `Cosmos State cluster ${cluster.cluster_id || "unknown"} must contain at least 1 Impact member in v0.6`
              );
            }

            if (Number(cluster.member_type_counts.emergence || 0) > 3) {
              throw new Error(
                `Cosmos State cluster ${cluster.cluster_id || "unknown"} exceeds v0.6 Emergence cap`
              );
            }

            const interpretation = String(cluster.interpretation || "").toLowerCase();
            if (
              !interpretation.includes("qualifies directly against the original anchor") ||
              !interpretation.includes("membership is not transitive") ||
              !interpretation.includes("anchor identity is preserved") ||
              !interpretation.includes("relevant impact signals are explicitly admitted") ||
              !interpretation.includes("near-duplicate emergence signals are suppressed") ||
              !interpretation.includes("does not establish new causality") ||
              !interpretation.includes("verification") ||
              !interpretation.includes("forecast")
            ) {
              throw new Error(
                `Cosmos State cluster ${cluster.cluster_id || "unknown"} missing v0.6 bounded-system safeguard`
              );
            }
          }

          const counts = payload.counts || {};

          if (Number(counts.attention_cluster_members_max || 0) > 7) {
            throw new Error("Cosmos State attention_cluster_members_max exceeds 7");
          }

          if (Number(counts.attention_distinct_system_target_max || 0) !== 5) {
            throw new Error("Cosmos State attention_distinct_system_target_max must equal 5");
          }

          if (
            Number(counts.attention_cross_family_clusters || 0) >
            Number(counts.attention_clusters || 0)
          ) {
            throw new Error("Cosmos State cross-family cluster count invalid");
          }

          if (
            Number(counts.attention_clusters_with_impact || 0) !==
            Number(counts.attention_clusters || 0)
          ) {
            throw new Error(
              `Cosmos State v0.6 requires every retained system to contain Impact; ` +
              `with-impact=${counts.attention_clusters_with_impact}, ` +
              `clusters=${counts.attention_clusters}`
            );
          }

          if (
            Number(counts.attention_cluster_emergence_members_max || 0) > 3
          ) {
            throw new Error(
              "Cosmos State v0.6 attention_cluster_emergence_members_max exceeds 3"
            );
          }

          if (
            Number(counts.attention_patterns || 0) > 8 ||
            Number(counts.attention_emergences || 0) > 6 ||
            Number(counts.attention_impacts || 0) > 6
          ) {
            throw new Error("Cosmos State attention diversity quota invalid");
          }

          console.log("");
          console.log("Real Cosmos State output created.");
          console.log(`Date:       ${payload.date_utc}`);
          console.log(`Attention:  ${payload.counts?.attention_retained ?? 0}`);
          console.log(`Clusters:   ${payload.counts?.attention_clusters ?? 0}`);
          console.log(`With Impact:${payload.counts?.attention_clusters_with_impact ?? 0}`);
          console.log(`Max Emerg.: ${payload.counts?.attention_cluster_emergence_members_max ?? 0}`);
          console.log(`Output:     ${file}`);
          NODE


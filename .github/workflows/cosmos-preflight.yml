            );
          }

          const state = payload.validation_state || {};
          const targets = payload.validation_targets || [];
          const queue = payload.future_evidence_queue || [];

          if (!Array.isArray(targets) || targets.length < 1) {
            errors.push("Candidate Validation Planner produced no validation_targets[]");
          }

          if (!Array.isArray(queue) || queue.length < 1) {
            errors.push("Candidate Validation Planner future_evidence_queue[] missing or empty");
          }

          if (queue.length !== targets.length) {
            errors.push(
              `Candidate Validation target/evidence queue mismatch: ${targets.length} vs ${queue.length}`
            );
          }

          if (Number(state.raw_candidate_count) !== 21) {
            errors.push(
              `Controlled Candidate Validation test expected 21 raw candidates; got ${state.raw_candidate_count}`
            );
          }

          if (Number(state.unique_validation_target_count) !== 7) {
            errors.push(
              `Controlled Candidate Validation test expected 7 unique validation targets; got ${state.unique_validation_target_count}`
            );
          }

          if (Number(state.duplicate_candidate_count) !== 14) {
            errors.push(
              `Controlled Candidate Validation test expected 14 duplicate candidates; got ${state.duplicate_candidate_count}`
            );
          }

          if (Number(state.validated_target_count) !== 0 ||
              Number(state.executable_target_count) !== 0) {
            errors.push(
              "Candidate Validation Planner v0.1 must not validate or execute targets"
            );
          }

          if (state.external_execution_connected !== false) {
            errors.push(
              "Candidate Validation Planner v0.1 must not connect external execution"
            );
          }

          if (state.conceptual_distance_limit !== null) {
            errors.push(
              "Candidate Validation conceptual distance must remain unlimited/null"
            );
          }

          if (state.continuation_possible !== true) {
            errors.push(
              "Candidate Validation must preserve Cosmos continuation"
            );
          }

          const targetIds = new Set();

          for (const target of targets) {
            if (!target.validation_target_id ||
                !target.abstract_subject ||
                !target.candidate_label ||
                !target.candidate_class) {
              errors.push(
                "Candidate Validation target missing identity/context"
              );
              continue;
            }

            if (targetIds.has(target.validation_target_id)) {
              errors.push(
                `Duplicate validation_target_id ${target.validation_target_id}`
              );
            }
            targetIds.add(target.validation_target_id);

            if (target.epistemic_status !== "provisional_candidate" ||
                target.validation_status !== "not_started" ||
                target.executable !== false ||
                target.knowledge_status !== "not_admitted") {
              errors.push(
                `Validation target ${target.validation_target_id} crossed epistemic/execution boundary`
              );
            }

            if (!Array.isArray(target.source_candidate_ids) ||
                target.source_candidate_ids.length < 1 ||
                !Array.isArray(target.parent_acquisition_plan_ids) ||
                target.parent_acquisition_plan_ids.length < 1 ||
                !Array.isArray(target.parent_discovery_target_ids) ||
                target.parent_discovery_target_ids.length < 1) {

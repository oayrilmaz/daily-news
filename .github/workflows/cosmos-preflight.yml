          if ((active.primary_pathways || []).length < 1 ||
              (active.primary_pathways || []).length >
                Number(budget.primary_pathways || 0)) {
            throw new Error("Cosmos Attention primary pathway count invalid");
          }

          const primaryPathways = active.primary_pathways || [];
          const rawEntityPattern = /^ent_[a-z0-9]+$/i;

          for (const pathway of primaryPathways) {
            const fromName = String(pathway.from?.name || "").trim();
            const toName = String(pathway.to?.name || "").trim();

            if (!fromName || !toName ||
                rawEntityPattern.test(fromName) ||
                rawEntityPattern.test(toName) ||
                fromName === pathway.from?.entity_id ||
                toName === pathway.to?.entity_id) {
              throw new Error(
                `Cosmos Attention v0.2 primary pathway exposes unresolved entity: ${pathway.pathway_id || "unknown"}`
              );
            }

            if (!Number.isFinite(Number(pathway.relationship?.semantic_adjustment))) {
              throw new Error(
                `Cosmos Attention v0.2 pathway missing semantic adjustment: ${pathway.pathway_id || "unknown"}`
              );
            }
          }

          const locatedInPrimary = primaryPathways.filter(
            pathway =>
              String(pathway.relationship?.type || "").toUpperCase() === "LOCATED_IN"
          );

          const consequencePrimary = primaryPathways.filter(pathway =>
            ["AFFECTS", "IMPACTS", "DRIVES", "REQUIRES", "DEPENDS_ON",
             "CONSTRAINS", "ENABLES", "CAUSES", "INCREASES", "DECREASES",
             "SUPPLIES", "SUPPORTS"].includes(
              String(pathway.relationship?.type || "").toUpperCase()
            )
          );

          if (locatedInPrimary.length > 0 && consequencePrimary.length > 0) {
            const bestLocated = Math.max(
              ...locatedInPrimary.map(x => Number(x.score || 0))
            );
            const bestConsequence = Math.max(
              ...consequencePrimary.map(x => Number(x.score || 0))
            );

            if (bestLocated >= bestConsequence) {
              throw new Error(
                "Cosmos Attention v0.2 LOCATED_IN pathway outranks consequence pathway for impact question"
              );
            }
          }

          if ((active.patterns || []).length > Number(budget.patterns || 0) ||
              (active.emergences || []).length > Number(budget.emergences || 0) ||
              (active.impacts || []).length > Number(budget.impacts || 0) ||
              (active.relationships || []).length > Number(budget.relationships || 0)) {
            throw new Error(
              "Cosmos Attention active context exceeds configured budget"
            );
          }

          for (const key of ["patterns", "emergences", "impacts", "relationships"]) {
            const discovered = Number(suppressed[key]?.discovered || 0);
            const activeCount = Number(suppressed[key]?.active || 0);
            const expandable =
              Number(suppressed[key]?.available_for_expansion || 0);

            if (activeCount + expandable !== discovered) {
              throw new Error(
                `Cosmos Attention ${key} existence-preservation invariant failed`
              );
            }
          }

          if (payload.infinite_state?.terminal !== false ||
              payload.infinite_state?.continuation_allowed !== true ||
              payload.infinite_state?.attention_can_move !== true ||
              payload.infinite_state?.underlying_context_preserved !== true) {
            throw new Error("Cosmos Attention Infinite State safeguards invalid");
          }

          if (payload.safeguards?.creates_new_causal_claims !== false ||
              payload.safeguards?.upgrades_evidence_quality !== false ||
              payload.safeguards?.forecast_generated !== false ||
              payload.safeguards?.sector_whitelist_present !== false ||
              payload.safeguards?.visibility_suppression_only !== true ||
              payload.safeguards?.existence_preserved !== true ||
              payload.safeguards?.primary_pathways_require_resolved_entities !== true ||
              payload.safeguards?.descriptive_relationships_are_intent_weighted !== true ||
              payload.safeguards?.source_lineage_preserved !== true) {
            throw new Error("Cosmos Attention safeguards invalid");
          }

          console.log("");
          console.log("Real controlled Cosmos Attention v0.2 output created.");
          console.log(`Status:           ${payload.status}`);
          console.log(`Primary paths:    ${(active.primary_pathways || []).length}`);
          console.log(
            `Patterns:         ${suppressed.patterns?.discovered || 0} -> ${(active.patterns || []).length}`
          );
          console.log(
            `Emergences:       ${suppressed.emergences?.discovered || 0} -> ${(active.emergences || []).length}`
          );
          console.log(
            `Impacts:          ${suppressed.impacts?.discovered || 0} -> ${(active.impacts || []).length}`
          );
          console.log(
            `Relationships:    ${suppressed.relationships?.discovered || 0} -> ${(active.relationships || []).length}`
          );
          console.log(`Output:           ${file}`);
          NODE

      - name: Commit Real Cosmos Attention v0.2 Test Output
        if: ${{ inputs.write_cosmos_attention_test == true }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add knowledge/cosmos/attention-test-v0.2.json

          if git diff --cached --quiet; then
            echo "No Cosmos Attention test changes to commit."
          else
            git commit -m "Add Cosmos Attention v0.2 controlled test output"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          echo ""
          echo "Controlled Cosmos Attention v0.2 output is now committed."
          echo "No OpenAI generation was executed."

      - name: Generate Real Emergence Output
        if: ${{ inputs.write_emergence == true }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Generating real Emergence output from the current committed Cosmos data."
          echo "No OpenAI/API generation is executed by this step."

          node scripts/cosmos_emergence_engine.cjs

          test -f knowledge/cosmos/emergence-current.json

          node <<'NODE'
          const fs = require("fs");

          const file = "knowledge/cosmos/emergence-current.json";
          const payload = JSON.parse(fs.readFileSync(file, "utf8"));

          if (payload.schema_version !== "0.1") {
            throw new Error(
              `Unexpected emergence schema_version: ${payload.schema_version}`
            );
          }

          if (
            !["ready", "no_emergence_above_threshold"].includes(payload.status)
          ) {
            throw new Error(
              `Invalid emergence status: ${payload.status}`
            );
          }

          if (!Array.isArray(payload.emergences)) {
            throw new Error("emergence-current.json: emergences[] missing");
          }

          console.log("");
          console.log("Real Emergence output created.");
          console.log(`Date:       ${payload.date_utc}`);
          console.log(`Status:     ${payload.status}`);
          console.log(`Emergences: ${payload.summary?.emergence_count ?? payload.emergences.length}`);
          console.log(`Output:     ${file}`);
          NODE

      - name: Commit Real Emergence Output
        if: ${{ inputs.write_emergence == true }}
        shell: bash
        run: |
          set -euo pipefail

          DATE_UTC="$(node -p "require('./knowledge/cosmos/emergence-current.json').date_utc")"
          HISTORY_FILE="knowledge/cosmos/emergence-history/${DATE_UTC}.json"

          if [ ! -f "$HISTORY_FILE" ]; then
            echo "ERROR: Expected emergence history file was not generated: $HISTORY_FILE"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            knowledge/cosmos/emergence-current.json \
            "$HISTORY_FILE"

          if git diff --cached --quiet; then
            echo "No Emergence changes to commit."
          else
            git commit -m "Update Cosmos emergence ${DATE_UTC}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          echo ""
          echo "Real Emergence output is now committed to the repository."
          echo "No OpenAI generation was executed."

      - name: Preflight Complete
        run: |
          echo "======================================================"
          echo "COSMOS PREFLIGHT PASSED"
          echo "No OpenAI generation was executed by this workflow."
          if [ "${{ inputs.write_emergence }}" = "true" ]; then
            echo "Real emergence-current.json was generated and committed."
          fi
          if [ "${{ inputs.write_cosmos_state }}" = "true" ]; then
            echo "Real cosmos-state-current.json was generated and committed."
          fi
          if [ "${{ inputs.write_cosmos_core_test }}" = "true" ]; then
            echo "Controlled core-test-v0.1.json was generated and committed."
          fi
          if [ "${{ inputs.write_cosmos_attention_test }}" = "true" ]; then
            echo "Controlled attention-test-v0.2.json was generated and committed."
          fi
          if [ "${{ inputs.write_emergence }}" != "true" ] && \
             [ "${{ inputs.write_cosmos_state }}" != "true" ] && \
             [ "${{ inputs.write_cosmos_core_test }}" != "true" ] && \
             [ "${{ inputs.write_cosmos_attention_test }}" != "true" ]; then
            echo "Isolated validation only; repository intelligence files were not changed."
          else
            echo "Upload the newly generated output file(s) to ChatGPT for inspection before production integration."
          fi
          echo "======================================================"

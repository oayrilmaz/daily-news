name: Cosmos Preflight (No OpenAI)

on:
  workflow_dispatch:
    inputs:
      write_emergence:
        description: "Generate and commit real emergence-current.json from current committed Cosmos data"
        required: false
        default: false
        type: boolean
      write_cosmos_state:
        description: "Generate and commit real cosmos-state-current.json from current committed Cosmos data"
        required: false
        default: false
        type: boolean
      write_cosmos_core_test:
        description: "Generate and commit controlled Cosmos Core v0.1 test output"
        required: false
        default: false
        type: boolean
      write_cosmos_attention_test:
        description: "Generate and commit controlled Cosmos Attention v0.2 test output"
        required: false
        default: false
        type: boolean
      write_cosmos_consequence_test:
        description: "Generate and commit controlled Cosmos Consequence v0.1 test output"
        required: false
        default: false
        type: boolean
      write_cosmos_discovery_test:
        description: "Generate and commit controlled Cosmos Discovery v0.1 test output"
        required: false
        default: false
        type: boolean
      write_cosmos_acquisition_test:
        description: "Generate and commit controlled Cosmos Acquisition v0.1 test output"
        required: false
        default: false
        type: boolean
      write_cosmos_applicability_test:
        description: "Generate and commit controlled Cosmos Acquisition Applicability v0.1 test output"
        required: false
        default: false
        type: boolean
      write_cosmos_decomposition_test:
        description: "Generate and commit controlled Cosmos Decomposition v0.1 test output"
        required: false
        default: false
        type: boolean
      write_cosmos_candidate_validation_test:
        description: "Generate and commit controlled Cosmos Candidate Validation Planner v0.1 test output"
        required: false
        default: false
        type: boolean
      write_cosmos_evidence_strategy_test:
        description: "Generate and commit controlled Cosmos Evidence Strategy v0.1 test output"
        required: false
        default: false
        type: boolean
      write_cosmos_evidence_executor_test:
        description: "Generate and commit controlled Cosmos Evidence Executor v0.1 test output"
        required: false
        default: false
        type: boolean
      write_cosmos_evidence_validator_test:
        description: "Generate and commit controlled Cosmos Evidence Validator v0.1 test output"
        required: false
        default: false
        type: boolean
      write_cosmos_knowledge_admission_test:
        description: "Generate and commit controlled Cosmos Knowledge Admission v0.1 test output"
        required: false
        default: false
        type: boolean
      write_cosmos_graph_writer_test:
        description: "Generate and commit controlled Cosmos Graph Writer v0.1 snapshot and report"
        required: false
        default: false
        type: boolean
      write_cosmos_graph_integrity_test:
        description: "Generate and commit controlled Cosmos Graph Integrity v0.1 report"
        required: false
        default: false
        type: boolean
      write_cosmos_graph_reversal_test:
        description: "Generate and commit controlled Cosmos Graph Reversal v0.1 snapshot, report and post-reversal integrity report"
        required: false
        default: false
        type: boolean
      write_cosmos_causal_narrative_test:
        description: "Generate and commit controlled Cosmos Causal Narrative v0.1 output"
        required: false
        default: false
        type: boolean
      write_cosmos_graph_evolution_test:
        description: "Generate and commit controlled Cosmos Graph Evolution v0.1 planning output"
        required: false
        default: false
        type: boolean
      write_cosmos_temporal_knowledge_test:
        description: "Generate and commit controlled Cosmos Temporal Knowledge v0.1 output"
        required: false
        default: false
        type: boolean
      write_cosmos_first_party_identity_test:
        description: "Generate and commit controlled Cosmos First-Party Identity v0.1 output"
        required: false
        default: false
        type: boolean
      write_cosmos_article_presentation_test:
        description: "Write controlled Cosmos Article Presentation v0.1 HTML test output"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  # New modular namespace. Old orphaned monolithic runs cannot block this workflow.
  group: cosmos-preflight-ptdtoday-modular-v1
  cancel-in-progress: true

jobs:
  validate-foundation:
    name: Foundation / Intelligence Validation
    uses: ./.github/workflows/cosmos-preflight-validation-a.yml

  validate-knowledge:
    name: Knowledge / Graph / Temporal Validation
    needs: validate-foundation
    uses: ./.github/workflows/cosmos-preflight-validation-b.yml

  controlled-outputs:
    name: Controlled Output Generation
    needs: validate-knowledge
    uses: ./.github/workflows/cosmos-preflight-controlled-outputs.yml
    with:
      write_emergence: ${{ inputs.write_emergence }}
      write_cosmos_state: ${{ inputs.write_cosmos_state }}
      write_cosmos_core_test: ${{ inputs.write_cosmos_core_test }}
      write_cosmos_attention_test: ${{ inputs.write_cosmos_attention_test }}
      write_cosmos_consequence_test: ${{ inputs.write_cosmos_consequence_test }}
      write_cosmos_discovery_test: ${{ inputs.write_cosmos_discovery_test }}
      write_cosmos_acquisition_test: ${{ inputs.write_cosmos_acquisition_test }}
      write_cosmos_applicability_test: ${{ inputs.write_cosmos_applicability_test }}
      write_cosmos_decomposition_test: ${{ inputs.write_cosmos_decomposition_test }}
      write_cosmos_candidate_validation_test: ${{ inputs.write_cosmos_candidate_validation_test }}
      write_cosmos_evidence_strategy_test: ${{ inputs.write_cosmos_evidence_strategy_test }}
      write_cosmos_evidence_executor_test: ${{ inputs.write_cosmos_evidence_executor_test }}
      write_cosmos_evidence_validator_test: ${{ inputs.write_cosmos_evidence_validator_test }}
      write_cosmos_knowledge_admission_test: ${{ inputs.write_cosmos_knowledge_admission_test }}
      write_cosmos_graph_writer_test: ${{ inputs.write_cosmos_graph_writer_test }}
      write_cosmos_graph_integrity_test: ${{ inputs.write_cosmos_graph_integrity_test }}
      write_cosmos_graph_reversal_test: ${{ inputs.write_cosmos_graph_reversal_test }}
      write_cosmos_causal_narrative_test: ${{ inputs.write_cosmos_causal_narrative_test }}
      write_cosmos_graph_evolution_test: ${{ inputs.write_cosmos_graph_evolution_test }}
      write_cosmos_temporal_knowledge_test: ${{ inputs.write_cosmos_temporal_knowledge_test }}
      write_cosmos_first_party_identity_test: ${{ inputs.write_cosmos_first_party_identity_test }}
      write_cosmos_article_presentation_test: ${{ inputs.write_cosmos_article_presentation_test }}

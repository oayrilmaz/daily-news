          node <<'NODE'
          const fs = require("fs");
          const file = "knowledge/cosmos/discovery-test-v0.1.json";
          const payload = JSON.parse(fs.readFileSync(file, "utf8"));

          if (payload.schema_version !== "0.1") {
            throw new Error(
              `Unexpected Cosmos Discovery schema_version: ${payload.schema_version}`
            );
          }

          if (payload.status !== "discovery_targets_resolved") {
            throw new Error(
              `Cosmos Discovery failed: ${payload.status}`
            );
          }

          if (payload.source_consequence?.schema_version !== "0.1") {
            throw new Error(
              "Cosmos Discovery did not consume Consequence v0.1"
            );
          }

          const targets =
            payload.discovery_targets?.items ||
            payload.discovery_targets ||
            [];

          const queue = payload.next_acquisition_queue || [];

          if (!Array.isArray(targets) || targets.length < 1) {
            throw new Error("Controlled Discovery output produced no discovery targets");
          }

          if (!Array.isArray(queue) || queue.length < 1) {
            throw new Error("Controlled Discovery output produced no acquisition queue");
          }

          if (payload.curiosity_state?.continuation_possible !== true) {
            throw new Error(
              "Cosmos Discovery did not preserve consequence continuation"
            );
          }

          if (payload.curiosity_state?.conceptual_distance_limit !== null) {
            throw new Error(
              "Cosmos Discovery imposed a conceptual distance limit"
            );
          }

          const reopenableTargets = targets.filter(
            x => x.reopens_frontier_if_resolved === true
          );

          if (reopenableTargets.length < 1) {
            throw new Error(
              "Controlled Discovery output produced no frontier-reopening target"
            );

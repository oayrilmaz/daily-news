          if (rejected.length !== 6) {
            errors.push(
              `Expected exactly 6 reject_for_now decisions; got ${rejected.length}`
            );
          }

          if (Number(state.by_decision?.admit_with_qualification || 0) !== 1 ||
              Number(state.by_decision?.reject_for_now || 0) !== 6) {
            errors.push(
              "Knowledge Admission decision summary invalid"
            );

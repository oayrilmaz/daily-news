








name: Cosmos Preflight (No OpenAI)

on:
  workflow_dispatch:
    inputs:
      write_emergence:
        description: "Generate and commit real emergence-current.json from current committed Cosmos data"
        required: false
        default: false
        type: boolean
      write_cosmos_state:
        description: "Generate and commit real cosmos-state-current.json from current committed Cosmos data"
        required: false
        default: false
        type: boolean
      write_cosmos_core_test:
        description: "Generate and commit controlled Cosmos Core v0.1 test output"
        required: false
        default: false
        type: boolean
      write_cosmos_attention_test:
        description: "Generate and commit controlled Cosmos Attention v0.2 test output"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: cosmos-preflight-ptdtoday
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cosmos Source Files
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "scripts/generate_ai_news.js"
            "scripts/resolve_entities.js"
            "scripts/update_entity_lifecycle.js"
            "scripts/normalize_map_signals.cjs"
            "scripts/validate_intelligence.cjs"
            "scripts/cosmos_state_delta.cjs"
            "scripts/cosmos_impact_engine.cjs"
            "scripts/cosmos_pattern_engine.cjs"
            "scripts/cosmos_emergence_engine.cjs"
            "scripts/cosmos_state_builder.cjs"
            "scripts/cosmos_core.cjs"
            "scripts/cosmos_attention.cjs"
            "scripts/backfill_history_from_articles.js"
            "package.json"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required file: $file"
              exit 1
            fi
            echo "OK: $file"
          done

      - name: Check JavaScript Syntax
        run: |
          set -e
          node --check scripts/generate_ai_news.js
          node --check scripts/resolve_entities.js
          node --check scripts/update_entity_lifecycle.js
          node --check scripts/normalize_map_signals.cjs
          node --check scripts/validate_intelligence.cjs
          node --check scripts/cosmos_state_delta.cjs
          node --check scripts/cosmos_impact_engine.cjs
          node --check scripts/cosmos_pattern_engine.cjs
          node --check scripts/cosmos_emergence_engine.cjs
          node --check scripts/cosmos_state_builder.cjs
          node --check scripts/cosmos_core.cjs
          node --check scripts/cosmos_attention.cjs
          node --check scripts/backfill_history_from_articles.js
          echo "All Cosmos JavaScript files passed syntax validation."

      - name: Verify package.json
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          if (!pkg.scripts || !pkg.scripts["generate:ai"]) {
            throw new Error(
              'package.json is missing scripts["generate:ai"].'
            );
          }

          if (!pkg.dependencies || !pkg.dependencies.openai) {
            throw new Error(
              'package.json is missing the "openai" dependency.'
            );
          }

          console.log("generate:ai:", pkg.scripts["generate:ai"]);
          console.log("OpenAI dependency:", pkg.dependencies.openai);
          console.log("package.json validation passed.");
          NODE

      - name: Validate Existing JSON Files
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          const required = [
            "briefs/daily-ai.json",
            "briefs/map-signals.json",
            "briefs/trends.json",
            "briefs/outlook.json",
            "knowledge/developments.json",
            "knowledge/entities.json",
            "knowledge/relationships.json",
            "knowledge/timeline-events.json",
            "knowledge/entity-lifecycle.json"
          ];

          let failed = false;

          for (const file of required) {
            if (!fs.existsSync(file)) {
              console.error(`ERROR: Missing ${file}`);
              failed = true;
              continue;
            }

            try {
              JSON.parse(fs.readFileSync(file, "utf8"));
              console.log(`OK JSON: ${file}`);
            } catch (error) {
              console.error(
                `ERROR: Invalid JSON in ${file}: ${error.message}`
              );
              failed = true;
            }
          }

          if (failed) process.exit(1);

          console.log(
            "All currently committed critical JSON files parse correctly."
          );
          NODE

      - name: Verify Current Knowledge Structure
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          function read(file) {
            return JSON.parse(fs.readFileSync(file, "utf8"));
          }

          const daily = read("briefs/daily-ai.json");
          const map = read("briefs/map-signals.json");
          const developments = read("knowledge/developments.json");
          const entities = read("knowledge/entities.json");
          const relationships = read("knowledge/relationships.json");
          const timeline = read("knowledge/timeline-events.json");
          const lifecycle = read("knowledge/entity-lifecycle.json");

          const errors = [];

          if (!Array.isArray(daily.items)) {
            errors.push("briefs/daily-ai.json: items[] missing");
          }

          if (!Array.isArray(map.signals)) {
            errors.push("briefs/map-signals.json: signals[] missing");
          }

          if (!Array.isArray(developments.developments)) {
            errors.push(
              "knowledge/developments.json: developments[] missing"
            );
          }

          if (!Array.isArray(entities.entities)) {
            errors.push("knowledge/entities.json: entities[] missing");
          }

          if (!Array.isArray(relationships.relationships)) {
            errors.push(
              "knowledge/relationships.json: relationships[] missing"
            );
          }

          if (!Array.isArray(timeline.events)) {
            errors.push(
              "knowledge/timeline-events.json: events[] missing"
            );
          }

          if (
            !lifecycle ||
            typeof lifecycle !== "object" ||
            !lifecycle.rankings
          ) {
            errors.push(
              "knowledge/entity-lifecycle.json: lifecycle structure missing"
            );
          }

          if (errors.length) {
            console.error("\nCompatibility errors:");
            for (const error of errors) {
              console.error(`- ${error}`);
            }
            process.exit(1);
          }

          console.log("\nCurrent committed data structure:");
          console.log(`Daily items:      ${daily.items.length}`);
          console.log(`Map signals:      ${map.signals.length}`);
          console.log(`Developments:     ${developments.developments.length}`);
          console.log(`Entities:         ${entities.entities.length}`);
          console.log(`Relationships:    ${relationships.relationships.length}`);
          console.log(`Timeline events:  ${timeline.events.length}`);

          if (Array.isArray(lifecycle.entities)) {
            console.log(`Lifecycle registry: ${lifecycle.entities.length}`);
          } else {
            console.log(
              "Lifecycle registry: legacy format currently committed " +
              "(File 5 will create lifecycle.entities[] on the next production run)"
            );
          }

          console.log("\nCosmos source/data compatibility checks passed.");
          NODE

      - name: Test Cosmos Impact Engine In Isolated Workspace
        shell: bash
        run: |
          set -euo pipefail

          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEST_DIR"' EXIT

          mkdir -p "$TEST_DIR/scripts"
          mkdir -p "$TEST_DIR/knowledge/cosmos"

          cp scripts/cosmos_impact_engine.cjs "$TEST_DIR/scripts/"
          cp scripts/cosmos_pattern_engine.cjs "$TEST_DIR/scripts/"
          cp scripts/cosmos_emergence_engine.cjs "$TEST_DIR/scripts/"
          cp knowledge/relationships.json "$TEST_DIR/knowledge/"
          cp knowledge/developments.json "$TEST_DIR/knowledge/"

          if [ -f "knowledge/cosmos/state-current.json" ] && \
             [ -f "knowledge/cosmos/delta-current.json" ]; then
            cp knowledge/cosmos/state-current.json \
              "$TEST_DIR/knowledge/cosmos/state-current.json"
            cp knowledge/cosmos/delta-current.json \
              "$TEST_DIR/knowledge/cosmos/delta-current.json"
          else
            echo "Committed Cosmos state/delta not found."
            echo "Creating a minimal deterministic fixture for the impact-engine test."

            node - "$TEST_DIR" <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const root = process.argv[2];
          const relationships = JSON.parse(
            fs.readFileSync(
              path.join(root, "knowledge/relationships.json"),
              "utf8"
            )
          );

          const usable = (relationships.relationships || []).find((rel) => {
            const type = String(rel.relationship_type || "").toUpperCase();
            return (
              rel.from_entity_id &&
              rel.to_entity_id &&
              rel.from_entity_id !== rel.to_entity_id &&
              type !== "LOCATED_IN" &&
              Number(rel.strength || 0) >= 65 &&
              Number(rel.confidence || 0) >= 0.65
            );
          });

          if (!usable) {
            throw new Error(
              "No relationship is strong enough to build the preflight fixture."
            );
          }

          const ids = [usable.from_entity_id, usable.to_entity_id];

          const state = {
            schema_version: "preflight-fixture",
            generated_at: new Date().toISOString(),
            date_utc: "2099-01-01",
            entities: Object.fromEntries(
              ids.map((id, index) => [
                id,
                {
                  entity_id: id,
                  name: `Preflight Entity ${index + 1}`,
                  type: "Concept",
                  lifecycle_status: "active",
                  importance_score: 80,
                  momentum_score: null,
                  momentum_status: "insufficient_history",
                  last_seen_at: new Date().toISOString(),
                  relationship_degree: 1,
                  linked_development_count: 1
                }
              ])
            )
          };

          const delta = {
            schema_version: "preflight-fixture",
            generated_at: new Date().toISOString(),
            date_utc: "2099-01-01",
            cold_start: false,
            added_entities: [
              {
                entity_id: usable.from_entity_id,
                name: "Preflight Entity 1",
                type: "Concept"
              }
            ],
            removed_entities: [],
            changed_entities: []
          };

          fs.writeFileSync(
            path.join(root, "knowledge/cosmos/state-current.json"),
            JSON.stringify(state, null, 2)
          );

          fs.writeFileSync(
            path.join(root, "knowledge/cosmos/delta-current.json"),
            JSON.stringify(delta, null, 2)
          );
          NODE
          fi

          (
            cd "$TEST_DIR"
            node scripts/cosmos_impact_engine.cjs
          )

          TEST_DIR="$TEST_DIR" node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const root = process.env.TEST_DIR;
          const outputPath = path.join(
            root,
            "knowledge/cosmos/impact-current.json"
          );

          if (!fs.existsSync(outputPath)) {
            throw new Error(
              "Impact engine did not create knowledge/cosmos/impact-current.json"
            );
          }

          const impact = JSON.parse(
            fs.readFileSync(outputPath, "utf8")
          );

          const errors = [];

          if (impact.schema_version !== "0.2") {
            errors.push(
              `Unexpected impact schema_version: ${impact.schema_version}`
            );
          }

          if (!impact.seeds || !Array.isArray(impact.seeds.items)) {
            errors.push("impact-current.json: seeds.items[] missing");
          }

          if (!Array.isArray(impact.seeds?.observed_deltas)) {
            errors.push("impact-current.json: seeds.observed_deltas[] missing");
          }

          if (!Number.isInteger(impact.seeds?.observed_delta_count) ||
              impact.seeds.observed_delta_count < 0) {
            errors.push("impact-current.json: invalid seeds.observed_delta_count");
          }

          if (!Number.isInteger(impact.seeds?.evidence_indexed_entities) ||
              impact.seeds.evidence_indexed_entities < 0) {
            errors.push("impact-current.json: invalid seeds.evidence_indexed_entities");
          }

          for (const seed of impact.seeds?.items || []) {
            if (seed.propagation_eligible !== true) {
              errors.push(`Seed ${seed.entity_id || "(unknown)"} is not propagation eligible`);
            }
            if (!Array.isArray(seed.evidence_development_ids)) {
              errors.push(`Seed ${seed.entity_id || "(unknown)"} is missing evidence_development_ids[]`);
            }
            if (!["strong", "medium", "baseline"].includes(seed.significance)) {
              errors.push(`Seed ${seed.entity_id || "(unknown)"} has invalid significance`);
            }
          }

          for (const seed of impact.seeds?.observed_deltas || []) {
            if (seed.propagation_eligible !== false) {
              errors.push(`Observed delta ${seed.entity_id || "(unknown)"} should not propagate`);
            }
            if (seed.significance !== "contextual") {
              errors.push(`Observed delta ${seed.entity_id || "(unknown)"} should be contextual`);
            }
          }

          if (!impact.summary || typeof impact.summary !== "object") {
            errors.push("impact-current.json: summary missing");
          }

          if (!Array.isArray(impact.impacts)) {
            errors.push("impact-current.json: impacts[] missing");
          }

          if (
            !["ready", "no_significant_seed", "no_paths_above_threshold"].includes(
              impact.status
            )
          ) {
            errors.push(
              `impact-current.json: invalid status "${impact.status}"`
            );
          }

          for (const row of impact.impacts || []) {
            if (row.reasoning_mode !== "graph_propagation") {
              errors.push(
                `Impact ${row.impact_id || "(unknown)"} has invalid reasoning_mode`
              );
            }

            if (!Array.isArray(row.seed_evidence_development_ids)) {
              errors.push(
                `Impact ${row.impact_id || "(unknown)"} is missing seed evidence lineage`
              );
            }

            if (!["strong", "medium", "baseline"].includes(row.seed_significance)) {
              errors.push(
                `Impact ${row.impact_id || "(unknown)"} has invalid seed significance`
              );
            }

            if (
              !row.path ||
              !Array.isArray(row.path.entity_ids) ||
              !Array.isArray(row.path.steps) ||
              row.path.steps.length !== row.propagation_depth
            ) {
              errors.push(
                `Impact ${row.impact_id || "(unknown)"} has an invalid path`
              );
            }

            if (
              !Number.isInteger(row.propagation_depth) ||
              row.propagation_depth < 1 ||
              row.propagation_depth > 3
            ) {
              errors.push(
                `Impact ${row.impact_id || "(unknown)"} has invalid propagation depth`
              );
            }
          }

          if (errors.length) {
            console.error("\nImpact Engine preflight errors:");
            for (const error of errors) {
              console.error(`- ${error}`);
            }
            process.exit(1);
          }

          console.log("\nImpact Engine isolated test passed.");
          console.log(`Status:  ${impact.status}`);
          console.log(`Propagating seeds: ${impact.seeds.count}`);
          console.log(`Contextual deltas: ${impact.seeds.observed_delta_count}`);
          console.log(
            `Seeds with direct evidence: ${impact.summary.seeds_with_direct_development_evidence}`
          );
          console.log(`Impacts: ${impact.summary.impact_count}`);
          console.log(
            "Repository files were not modified by the isolated test."
          );
          NODE

          (
            cd "$TEST_DIR"
            node scripts/cosmos_pattern_engine.cjs
          )

          TEST_DIR="$TEST_DIR" node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const root = process.env.TEST_DIR;
          const outputPath = path.join(
            root,
            "knowledge/cosmos/patterns-current.json"
          );

          if (!fs.existsSync(outputPath)) {
            throw new Error(
              "Pattern engine did not create knowledge/cosmos/patterns-current.json"
            );
          }

          const patterns = JSON.parse(
            fs.readFileSync(outputPath, "utf8")
          );

          const errors = [];

          if (patterns.schema_version !== "0.2") {
            errors.push(
              `Unexpected pattern schema_version: ${patterns.schema_version}`
            );
          }

          if (
            !["ready", "no_patterns_above_threshold"].includes(
              patterns.status
            )
          ) {
            errors.push(
              `patterns-current.json: invalid status "${patterns.status}"`
            );
          }

          if (!patterns.methodology ||
              patterns.methodology.reasoning_mode !== "deterministic_pattern_detection") {
            errors.push(
              "patterns-current.json: deterministic_pattern_detection methodology missing"
            );
          }

          const calibration = patterns.methodology?.cross_domain_calibration;

          if (!calibration || typeof calibration !== "object") {
            errors.push(
              "patterns-current.json: cross_domain_calibration methodology missing"
            );
          } else {
            if (Number(calibration.max_results) !== 30) {
              errors.push(
                `patterns-current.json: expected cross-domain max_results 30, got ${calibration.max_results}`
              );
            }

            if (Number(calibration.max_score) !== 96) {
              errors.push(
                `patterns-current.json: expected cross-domain max_score 96, got ${calibration.max_score}`
              );
            }

            if (!String(calibration.dynamic_gate || "").includes("meaningful delta")) {
              errors.push(
                "patterns-current.json: calibrated dynamic gate missing"
              );
            }
          }

          if (!patterns.summary || typeof patterns.summary !== "object") {
            errors.push("patterns-current.json: summary missing");
          }

          if (!Array.isArray(patterns.patterns)) {
            errors.push("patterns-current.json: patterns[] missing");
          }

          if (!patterns.diagnostics || typeof patterns.diagnostics !== "object") {
            errors.push("patterns-current.json: diagnostics missing");
          }

          const allowedFamilies = new Set([
            "impact_convergence",
            "evidence_reinforcement",
            "structural_acceleration",
            "cross_domain_coupling"
          ]);

          const allowedEvidenceQuality = new Set([
            "strong",
            "moderate",
            "weak",
            "unknown"
          ]);

          const allowedPersistence = new Set([
            "insufficient_history",
            "new",
            "recurring",
            "persistent"
          ]);

          let crossDomainCount = 0;

          for (const row of patterns.patterns || []) {
            if (!row.pattern_id) {
              errors.push("Pattern missing pattern_id");
            }

            if (!allowedFamilies.has(row.pattern_family)) {
              errors.push(
                `Pattern ${row.pattern_id || "(unknown)"} has invalid pattern_family`
              );
            }

            if (!Number.isFinite(Number(row.pattern_score)) ||
                Number(row.pattern_score) < 0 ||
                Number(row.pattern_score) > 100) {
              errors.push(
                `Pattern ${row.pattern_id || "(unknown)"} has invalid pattern_score`
              );
            }

            if (!Number.isFinite(Number(row.structural_strength_score)) ||
                Number(row.structural_strength_score) < 0 ||
                Number(row.structural_strength_score) > 100) {
              errors.push(
                `Pattern ${row.pattern_id || "(unknown)"} has invalid structural_strength_score`
              );
            }

            if (!Number.isFinite(Number(row.evidence_quality_score)) ||
                Number(row.evidence_quality_score) < 0 ||
                Number(row.evidence_quality_score) > 100) {
              errors.push(
                `Pattern ${row.pattern_id || "(unknown)"} has invalid evidence_quality_score`
              );
            }

            if (!allowedEvidenceQuality.has(row.evidence_quality_label)) {
              errors.push(
                `Pattern ${row.pattern_id || "(unknown)"} has invalid evidence_quality_label`
              );
            }

            if (!row.evidence ||
                !Array.isArray(row.evidence.development_ids)) {
              errors.push(
                `Pattern ${row.pattern_id || "(unknown)"} is missing evidence lineage`
              );
            }

            if (!row.persistence ||
                !allowedPersistence.has(row.persistence.status)) {
              errors.push(
                `Pattern ${row.pattern_id || "(unknown)"} has invalid persistence status`
              );
            }

            if (!Array.isArray(row.supporting_entities) ||
                !Array.isArray(row.supporting_impact_ids) ||
                !Array.isArray(row.supporting_relationship_ids)) {
              errors.push(
                `Pattern ${row.pattern_id || "(unknown)"} has invalid support lineage`
              );
            }

            if (row.pattern_family === "cross_domain_coupling") {
              crossDomainCount += 1;

              if (Number(row.pattern_score) > 96) {
                errors.push(
                  `Pattern ${row.pattern_id || "(unknown)"} exceeds calibrated cross-domain score ceiling`
                );
              }

              const details = Array.isArray(row.signal_details)
                ? row.signal_details[0]
                : null;

              if (!details ||
                  !Number.isFinite(Number(details.strong_relationship_count)) ||
                  Number(details.strong_relationship_count) < 1) {
                errors.push(
                  `Pattern ${row.pattern_id || "(unknown)"} lacks strong resolved relationship support`
                );
              }

              const hasDynamicSupport =
                details?.meaningful_delta_support === true ||
                Number(details?.origin_impact_count || 0) > 0 ||
                Number(details?.affected_impact_count || 0) > 0;

              if (!hasDynamicSupport) {
                errors.push(
                  `Pattern ${row.pattern_id || "(unknown)"} lacks calibrated dynamic support`
                );
              }
            }
          }

          if (crossDomainCount > 30) {
            errors.push(
              `patterns-current.json: cross-domain pattern count ${crossDomainCount} exceeds calibrated cap 30`
            );
          }

          if (errors.length) {
            console.error("\nPattern Engine preflight errors:");
            for (const error of errors) {
              console.error(`- ${error}`);
            }
            process.exit(1);
          }

          console.log("\nPattern Engine isolated test passed.");
          console.log(`Status:   ${patterns.status}`);
          console.log(`Patterns: ${patterns.summary.pattern_count}`);
          console.log(
            `Convergence: ${patterns.summary.by_family?.impact_convergence || 0}`
          );
          console.log(
            `Reinforcement: ${patterns.summary.by_family?.evidence_reinforcement || 0}`
          );
          console.log(
            `Acceleration: ${patterns.summary.by_family?.structural_acceleration || 0}`
          );
          console.log(
            `Cross-domain: ${patterns.summary.by_family?.cross_domain_coupling || 0}`
          );
          console.log(
            "Pattern structural strength and evidence quality remain independently validated."
          );
          console.log(
            "Repository files were not modified by the isolated test."
          );
          NODE

      - name: Test Cosmos Emergence Engine In Isolated Workspace
        shell: bash
        run: |
          set -euo pipefail

          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEST_DIR"' EXIT

          mkdir -p "$TEST_DIR/scripts"
          mkdir -p "$TEST_DIR/knowledge/cosmos"

          cp scripts/cosmos_emergence_engine.cjs "$TEST_DIR/scripts/"
          cp knowledge/cosmos/patterns-current.json \
            "$TEST_DIR/knowledge/cosmos/patterns-current.json"

          if [ -f "knowledge/cosmos/impact-current.json" ]; then
            cp knowledge/cosmos/impact-current.json \
              "$TEST_DIR/knowledge/cosmos/impact-current.json"
          fi

          if [ -f "knowledge/cosmos/delta-current.json" ]; then
            cp knowledge/cosmos/delta-current.json \
              "$TEST_DIR/knowledge/cosmos/delta-current.json"
          fi

          if [ -f "knowledge/cosmos/state-current.json" ]; then
            cp knowledge/cosmos/state-current.json \
              "$TEST_DIR/knowledge/cosmos/state-current.json"
          fi

          (
            cd "$TEST_DIR"
            node scripts/cosmos_emergence_engine.cjs
          )

          TEST_DIR="$TEST_DIR" node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const root = process.env.TEST_DIR;
          const outputPath = path.join(
            root,
            "knowledge/cosmos/emergence-current.json"
          );
          const patternPath = path.join(
            root,
            "knowledge/cosmos/patterns-current.json"
          );

          if (!fs.existsSync(outputPath)) {
            throw new Error(
              "Emergence engine did not create knowledge/cosmos/emergence-current.json"
            );
          }

          const emergence = JSON.parse(
            fs.readFileSync(outputPath, "utf8")
          );
          const patterns = JSON.parse(
            fs.readFileSync(patternPath, "utf8")
          );

          const patternById = new Map(
            (patterns.patterns || []).map(row => [row.pattern_id, row])
          );

          const errors = [];

          if (emergence.schema_version !== "0.1") {
            errors.push(
              `Unexpected emergence schema_version: ${emergence.schema_version}`
            );
          }

          if (
            !["ready", "no_emergence_above_threshold"].includes(
              emergence.status
            )
          ) {
            errors.push(
              `emergence-current.json: invalid status "${emergence.status}"`
            );
          }

          if (!emergence.methodology ||
              emergence.methodology.reasoning_mode !==
                "deterministic_higher_order_pattern_synthesis") {
            errors.push(
              "emergence-current.json: deterministic higher-order methodology missing"
            );
          }

          if (!emergence.summary || typeof emergence.summary !== "object") {
            errors.push("emergence-current.json: summary missing");
          }

          if (!emergence.diagnostics ||
              typeof emergence.diagnostics !== "object") {
            errors.push("emergence-current.json: diagnostics missing");
          }

          if (!Array.isArray(emergence.emergences)) {
            errors.push("emergence-current.json: emergences[] missing");
          }

          const allowedFamilies = new Set([
            "acceleration_convergence",
            "reinforced_coupling",
            "multi_family_emergence",
            "systemic_emergence",
            "multi_pattern_convergence"
          ]);

          const allowedEvidenceQuality = new Set([
            "strong",
            "moderate",
            "weak",
            "unknown"
          ]);

          const allowedPersistence = new Set([
            "insufficient_history",
            "new",
            "recurring",
            "persistent"
          ]);

          for (const row of emergence.emergences || []) {
            if (!row.emergence_id) {
              errors.push("Emergence missing emergence_id");
            }

            if (!allowedFamilies.has(row.emergence_family)) {
              errors.push(
                `Emergence ${row.emergence_id || "(unknown)"} has invalid emergence_family`
              );
            }

            if (!Number.isFinite(Number(row.emergence_score)) ||
                Number(row.emergence_score) < 0 ||
                Number(row.emergence_score) > 98) {
              errors.push(
                `Emergence ${row.emergence_id || "(unknown)"} has invalid emergence_score`
              );
            }

            if (!Array.isArray(row.supporting_pattern_ids) ||
                row.supporting_pattern_ids.length < 3) {
              errors.push(
                `Emergence ${row.emergence_id || "(unknown)"} must have at least 3 supporting patterns`
              );
            }

            if (!Array.isArray(row.pattern_families) ||
                row.pattern_families.length < 2) {
              errors.push(
                `Emergence ${row.emergence_id || "(unknown)"} must have at least 2 pattern families`
              );
            }

            const distinctFamilies = new Set(row.pattern_families || []);
            if (distinctFamilies.size !== (row.pattern_families || []).length) {
              errors.push(
                `Emergence ${row.emergence_id || "(unknown)"} has duplicate pattern families`
              );
            }

            for (const patternId of row.supporting_pattern_ids || []) {
              if (!patternById.has(patternId)) {
                errors.push(
                  `Emergence ${row.emergence_id || "(unknown)"} references unknown pattern ${patternId}`
                );
              }
            }

            const underlyingEvidenceScores =
              (row.supporting_pattern_ids || [])
                .map(id => patternById.get(id))
                .filter(Boolean)
                .map(p => Number(p.evidence_quality_score))
                .filter(Number.isFinite);

            const strongestUnderlyingEvidence = underlyingEvidenceScores.length
              ? Math.max(...underlyingEvidenceScores)
              : 0;

            if (Number(row.evidence_quality_score) >
                strongestUnderlyingEvidence + 1e-9) {
              errors.push(
                `Emergence ${row.emergence_id || "(unknown)"} improperly upgrades evidence quality`
              );
            }

            if (!allowedEvidenceQuality.has(row.evidence_quality_label)) {
              errors.push(
                `Emergence ${row.emergence_id || "(unknown)"} has invalid evidence_quality_label`
              );
            }

            if (!Array.isArray(row.shared_entities) ||
                row.shared_entities.length < 1) {
              errors.push(
                `Emergence ${row.emergence_id || "(unknown)"} lacks shared entity support`
              );
            }

            if (!Array.isArray(row.supporting_impact_ids) ||
                !Array.isArray(row.supporting_relationship_ids) ||
                !Array.isArray(row.supporting_development_ids)) {
              errors.push(
                `Emergence ${row.emergence_id || "(unknown)"} has invalid lineage arrays`
              );
            }

            if (!row.persistence ||
                !allowedPersistence.has(row.persistence.status)) {
              errors.push(
                `Emergence ${row.emergence_id || "(unknown)"} has invalid persistence status`
              );
            }

            if (!row.interpretation ||
                row.interpretation.claim_class !==
                  "higher_order_structural_signal" ||
                row.interpretation.causality !== "not_established" ||
                row.interpretation.forecast !== false) {
              errors.push(
                `Emergence ${row.emergence_id || "(unknown)"} has invalid interpretation safeguards`
              );
            }

            if (!row.signal_details ||
                Number(row.signal_details.pattern_count) < 3 ||
                Number(row.signal_details.family_count) < 2 ||
                Number(row.signal_details.shared_entity_count) < 1) {
              errors.push(
                `Emergence ${row.emergence_id || "(unknown)"} has invalid cluster diagnostics`
              );
            }
          }

          if (errors.length) {
            console.error("\nEmergence Engine preflight errors:");
            for (const error of errors) {
              console.error(`- ${error}`);
            }
            process.exit(1);
          }

          console.log("\nEmergence Engine isolated test passed.");
          console.log(`Status:      ${emergence.status}`);
          console.log(`Emergences: ${emergence.summary.emergence_count}`);
          console.log(
            `Systemic: ${emergence.summary.by_family?.systemic_emergence || 0}`
          );
          console.log(
            `Multi-family: ${emergence.summary.by_family?.multi_family_emergence || 0}`
          );
          console.log(
            `Acceleration + convergence: ${emergence.summary.by_family?.acceleration_convergence || 0}`
          );
          console.log(
            `Reinforced coupling: ${emergence.summary.by_family?.reinforced_coupling || 0}`
          );
          console.log(
            `Multi-pattern convergence: ${emergence.summary.by_family?.multi_pattern_convergence || 0}`
          );
          console.log(
            `Pattern graph edges: ${emergence.diagnostics.pattern_graph_edge_count}`
          );
          console.log(
            `Raw emergences: ${emergence.diagnostics.raw_emergence_count}`
          );
          console.log(
            "Evidence inheritance and higher-order safeguards passed."
          );
          console.log(
            "Repository files were not modified by the isolated test."
          );
          NODE

      - name: Test Cosmos State Builder In Isolated Workspace
        shell: bash
        run: |
          set -euo pipefail

          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEST_DIR"' EXIT

          mkdir -p "$TEST_DIR/scripts"
          mkdir -p "$TEST_DIR/knowledge/cosmos"

          cp scripts/cosmos_state_builder.cjs "$TEST_DIR/scripts/"
          cp knowledge/developments.json "$TEST_DIR/knowledge/"
          cp knowledge/relationships.json "$TEST_DIR/knowledge/"

          for file in \
            state-current.json \
            delta-current.json \
            impact-current.json \
            patterns-current.json \
            emergence-current.json
          do
            if [ ! -f "knowledge/cosmos/$file" ]; then
              echo "ERROR: Missing committed Cosmos input: knowledge/cosmos/$file"
              exit 1
            fi
            cp "knowledge/cosmos/$file" "$TEST_DIR/knowledge/cosmos/$file"
          done

          (
            cd "$TEST_DIR"
            node scripts/cosmos_state_builder.cjs
          )

          TEST_DIR="$TEST_DIR" node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const root = process.env.TEST_DIR;
          const file = path.join(
            root,
            "knowledge/cosmos/cosmos-state-current.json"
          );

          if (!fs.existsSync(file)) {
            throw new Error(
              "Cosmos State Builder did not create knowledge/cosmos/cosmos-state-current.json"
            );
          }

          const payload = JSON.parse(fs.readFileSync(file, "utf8"));
          const errors = [];

          if (payload.schema_version !== "0.6") {
            errors.push(
              `Unexpected Cosmos State schema_version: ${payload.schema_version}`
            );
          }

          if (payload.status !== "ready") {
            errors.push(`Invalid Cosmos State status: ${payload.status}`);
          }

          if (
            payload.methodology?.reasoning_mode !==
            "deterministic_cosmos_state_synthesis"
          ) {
            errors.push(
              "Cosmos State deterministic synthesis methodology missing"
            );
          }

          if (payload.methodology?.no_new_claims !== true) {
            errors.push("Cosmos State must enforce no_new_claims=true");
          }

          const freshnessKeys = [
            "state",
            "delta",
            "impact",
            "patterns",
            "emergence",
            "developments",
            "relationships"
          ];

          for (const key of freshnessKeys) {
            if (!payload.source_freshness?.[key]) {
              errors.push(`Cosmos State source_freshness.${key} missing`);
            }
          }

          if (!Array.isArray(payload.now?.entities)) {
            errors.push("Cosmos State now.entities[] missing");
          }

          if (!Array.isArray(payload.now?.developments)) {
            errors.push("Cosmos State now.developments[] missing");
          }

          if (!Array.isArray(payload.graph?.relationships)) {
            errors.push("Cosmos State graph.relationships[] missing");
          }

          if (!Array.isArray(payload.impact?.signals)) {
            errors.push("Cosmos State impact.signals[] missing");
          }

          if (!Array.isArray(payload.patterns?.signals)) {
            errors.push("Cosmos State patterns.signals[] missing");
          }

          if (!Array.isArray(payload.emergence?.signals)) {
            errors.push("Cosmos State emergence.signals[] missing");
          }

          if (!Array.isArray(payload.attention?.signals)) {
            errors.push("Cosmos State attention.signals[] missing");
          }

          if (!Array.isArray(payload.attention?.clusters)) {
            errors.push("Cosmos State attention.clusters[] missing");
          }

          const attentionTypeCounts = {
            pattern: 0,
            emergence: 0,
            impact: 0
          };

          for (const row of payload.attention?.signals || []) {
            if (Object.prototype.hasOwnProperty.call(attentionTypeCounts, row.attention_type)) {
              attentionTypeCounts[row.attention_type] += 1;
            }
          }

          if ((payload.attention?.signals || []).length >= 20) {
            if (attentionTypeCounts.pattern > 8) {
              errors.push(
                `Cosmos State attention pattern quota exceeded: ${attentionTypeCounts.pattern}`
              );
            }
            if (attentionTypeCounts.emergence > 6) {
              errors.push(
                `Cosmos State attention emergence quota exceeded: ${attentionTypeCounts.emergence}`
              );
            }
            if (attentionTypeCounts.impact > 6) {
              errors.push(
                `Cosmos State attention impact quota exceeded: ${attentionTypeCounts.impact}`
              );
            }
          }

          for (const cluster of payload.attention?.clusters || []) {
            if (!cluster.cluster_id || !Array.isArray(cluster.member_attention_ids)) {
              errors.push("Cosmos State attention cluster missing identity/member references");
              continue;
            }

            if (cluster.member_attention_ids.length < 2) {
              errors.push(
                `Attention cluster ${cluster.cluster_id} must contain at least 2 members`
              );
            }

            if (cluster.member_attention_ids.length > 7) {
              errors.push(
                `Attention cluster ${cluster.cluster_id} exceeds v0.6 member cap: ${cluster.member_attention_ids.length}`
              );
            }

            if (
              !cluster.anchor_attention_id ||
              !cluster.anchor_type ||
              !cluster.anchor_ref_id ||
              !Array.isArray(cluster.anchor_entity_ids) ||
              cluster.anchor_entity_ids.length < 1
            ) {
              errors.push(
                `Attention cluster ${cluster.cluster_id} missing v0.6 anchor identity fields`
              );
            }

            if (!["emergence", "pattern"].includes(cluster.anchor_type)) {
              errors.push(
                `Attention cluster ${cluster.cluster_id} has invalid anchor_type ${cluster.anchor_type}`
              );
            }

            if (!Array.isArray(cluster.member_types) || cluster.member_types.length < 1) {
              errors.push(
                `Attention cluster ${cluster.cluster_id} missing member_types[]`
              );
            }

            if (typeof cluster.cross_family !== "boolean") {
              errors.push(
                `Attention cluster ${cluster.cluster_id} missing cross_family boolean`
              );
            }

            if (
              !cluster.member_type_counts ||
              typeof cluster.member_type_counts !== "object"
            ) {
              errors.push(
                `Attention cluster ${cluster.cluster_id} missing member_type_counts`
              );
            } else {
              if (Number(cluster.member_type_counts.impact || 0) < 1) {
                errors.push(
                  `Attention cluster ${cluster.cluster_id} must contain at least 1 Impact member in v0.6`
                );
              }

              if (Number(cluster.member_type_counts.emergence || 0) > 3) {
                errors.push(
                  `Attention cluster ${cluster.cluster_id} exceeds v0.6 Emergence cap`
                );
              }
            }

            const interpretation = String(cluster.interpretation || "").toLowerCase();

            if (
              !interpretation.includes("qualifies directly against the original anchor") ||
              !interpretation.includes("membership is not transitive") ||
              !interpretation.includes("anchor identity is preserved") ||
              !interpretation.includes("relevant impact signals are explicitly admitted") ||
              !interpretation.includes("near-duplicate emergence signals are suppressed") ||
              !interpretation.includes("does not establish new causality") ||
              !interpretation.includes("verification") ||
              !interpretation.includes("forecast")
            ) {
              errors.push(
                `Attention cluster ${cluster.cluster_id} missing v0.6 bounded-system safeguard`
              );
            }
          }

          if ((payload.attention?.clusters || []).length > 5) {
            errors.push(
              `Cosmos State must retain at most 5 distinct bounded systems; found ${(payload.attention?.clusters || []).length}`
            );
          }

          if (
            Number(payload.counts?.attention_cluster_members_max || 0) > 7
          ) {
            errors.push(
              `Cosmos State attention_cluster_members_max exceeds 7: ${payload.counts?.attention_cluster_members_max}`
            );
          }

          if (
            Number(payload.counts?.attention_distinct_system_target_max || 0) !== 5
          ) {
            errors.push(
              `Cosmos State distinct-system target max must be 5; found ${payload.counts?.attention_distinct_system_target_max}`
            );
          }

          if (
            Number(payload.counts?.attention_cross_family_clusters || 0) >
            Number(payload.counts?.attention_clusters || 0)
          ) {
            errors.push(
              "Cosmos State cross-family cluster count exceeds total cluster count"
            );
          }

          if (
            Number(payload.counts?.attention_clusters_with_impact || 0) !==
            Number(payload.counts?.attention_clusters || 0)
          ) {
            errors.push(
              `Cosmos State v0.6 requires every retained system to contain Impact; ` +
              `with-impact=${payload.counts?.attention_clusters_with_impact}, ` +
              `clusters=${payload.counts?.attention_clusters}`
            );
          }

          if (
            Number(payload.counts?.attention_cluster_emergence_members_max || 0) > 3
          ) {
            errors.push(
              `Cosmos State v0.6 emergence-member max exceeds 3: ` +
              `${payload.counts?.attention_cluster_emergence_members_max}`
            );
          }

          if (payload.safeguards?.forecast !== false) {
            errors.push("Cosmos State must keep forecast=false");
          }

          if (payload.safeguards?.evidence_quality_upgraded !== false) {
            errors.push(
              "Cosmos State must keep evidence_quality_upgraded=false"
            );
          }

          for (const row of payload.impact?.signals || []) {
            if (!row.impact_id) {
              errors.push("Cosmos State impact signal missing impact_id");
              continue;
            }

            if (!Array.isArray(row.entity_ids) || row.entity_ids.length < 2) {
              errors.push(
                `Cosmos State impact ${row.impact_id} missing propagated entity lineage`
              );
            }

            if (!row.path || !Array.isArray(row.path.entity_ids)) {
              errors.push(
                `Cosmos State impact ${row.impact_id} missing preserved path`
              );
            }

            if (!Array.isArray(row.supporting_development_ids)) {
              errors.push(
                `Cosmos State impact ${row.impact_id} missing development lineage`
              );
            }

            if (!Array.isArray(row.supporting_relationship_ids)) {
              errors.push(
                `Cosmos State impact ${row.impact_id} missing relationship lineage`
              );
            }

            if (!Array.isArray(row.evidence_modes)) {
              errors.push(
                `Cosmos State impact ${row.impact_id} missing evidence_modes[]`
              );
            }
          }

          const impactIds = new Set(
            (payload.impact?.signals || []).map(x => x.impact_id)
          );
          const patternIds = new Set(
            (payload.patterns?.signals || []).map(x => x.pattern_id)
          );
          const emergenceIds = new Set(
            (payload.emergence?.signals || []).map(x => x.emergence_id)
          );

          for (const row of payload.attention?.signals || []) {
            if (!row.attention_id || !row.attention_type || !row.ref_id) {
              errors.push("Attention signal missing identity fields");
              continue;
            }

            let exists = false;

            if (row.attention_type === "impact") {
              exists = impactIds.has(row.ref_id);
            } else if (row.attention_type === "pattern") {
              exists = patternIds.has(row.ref_id);
            } else if (row.attention_type === "emergence") {
              exists = emergenceIds.has(row.ref_id);
            } else {
              errors.push(
                `Attention ${row.attention_id} has invalid type ${row.attention_type}`
              );
              continue;
            }

            if (!exists) {
              errors.push(
                `Attention ${row.attention_id} references missing upstream ${row.attention_type} ${row.ref_id}`
              );
            }

            if (
              !Number.isFinite(Number(row.evidence_quality_score)) ||
              Number(row.evidence_quality_score) < 0 ||
              Number(row.evidence_quality_score) > 100
            ) {
              errors.push(
                `Attention ${row.attention_id} has invalid evidence quality`
              );
            }
          }

          const expectedHistory = path.join(
            root,
            "knowledge/cosmos/cosmos-state-history",
            `${payload.date_utc}.json`
          );

          if (!fs.existsSync(expectedHistory)) {
            errors.push(
              `Cosmos State history snapshot missing for ${payload.date_utc}`
            );
          }

          if (errors.length) {
            console.error("\nCosmos State preflight errors:");
            for (const error of errors) {
              console.error(`- ${error}`);
            }
            process.exit(1);
          }

          console.log("\nCosmos State isolated test passed.");
          console.log(`Date:          ${payload.date_utc}`);
          console.log(`Entities:      ${payload.counts.entities_available}`);
          console.log(`Relationships: ${payload.counts.relationships_available}`);
          console.log(`Developments:  ${payload.counts.developments_available}`);
          console.log(`Impacts:       ${payload.counts.impacts_available}`);
          console.log(`Patterns:      ${payload.counts.patterns_available}`);
          console.log(`Emergences:    ${payload.counts.emergences_available}`);
          console.log(`Attention:     ${payload.counts.attention_retained}`);
          console.log(`  Patterns:    ${payload.counts.attention_patterns ?? 0}`);
          console.log(`  Emergences:  ${payload.counts.attention_emergences ?? 0}`);
          console.log(`  Impacts:     ${payload.counts.attention_impacts ?? 0}`);
          console.log(`Clusters:      ${payload.counts.attention_clusters ?? 0}`);
          console.log(`  With Impact: ${payload.counts.attention_clusters_with_impact ?? 0}`);
          console.log(`  Max Emergence: ${payload.counts.attention_cluster_emergence_members_max ?? 0}`);
          console.log(
            "Freshness, Impact-aware composition, Emergence deduplication, anchor-preserving system diversity, evidence and no-new-claims safeguards passed."
          );
          console.log(
            "Repository files were not modified by the isolated test."
          );
          NODE

      - name: Test Cosmos Core v0.1 In Isolated Workspace
        shell: bash
        run: |
          set -euo pipefail

          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEST_DIR"' EXIT

          mkdir -p "$TEST_DIR/scripts"
          mkdir -p "$TEST_DIR/knowledge/cosmos"

          cp scripts/cosmos_core.cjs "$TEST_DIR/scripts/cosmos_core.cjs"
          cp knowledge/cosmos/cosmos-state-current.json \
            "$TEST_DIR/knowledge/cosmos/cosmos-state-current.json"

          cat > "$TEST_DIR/core-input.json" <<'JSON'
          {
            "text": "What could AI data-center growth affect?",
            "language": "en",
            "entity_hints": [
              "Artificial Intelligence",
              "Data Centers"
            ],
            "mode": "open",
            "metadata": {
              "purpose": "cosmos_core_v0.1_preflight"
            }
          }
          JSON

          (
            cd "$TEST_DIR"
            node scripts/cosmos_core.cjs \
              --input core-input.json \
              --out knowledge/cosmos/core-test-v0.1.json
          )

          TEST_DIR="$TEST_DIR" node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const root = process.env.TEST_DIR;
          const file = path.join(
            root,
            "knowledge/cosmos/core-test-v0.1.json"
          );

          if (!fs.existsSync(file)) {
            throw new Error(
              "Cosmos Core did not create knowledge/cosmos/core-test-v0.1.json"
            );
          }

          const payload = JSON.parse(fs.readFileSync(file, "utf8"));
          const errors = [];

          if (payload.schema_version !== "0.1") {
            errors.push(
              `Unexpected Cosmos Core schema_version: ${payload.schema_version}`
            );
          }

          if (payload.status !== "context_resolved") {
            errors.push(
              `Cosmos Core failed to resolve controlled context: ${payload.status}`
            );
          }

          if (payload.knowledge_state?.cosmos_state_schema_version !== "0.6") {
            errors.push(
              `Cosmos Core must consume frozen Cosmos State v0.6; got ${payload.knowledge_state?.cosmos_state_schema_version}`
            );
          }

          const starts = payload.resolution?.starting_points || [];
          const startNames = new Set(
            starts.map(row => String(row.name || "").toLowerCase())
          );

          if (starts.length < 2) {
            errors.push(
              `Cosmos Core controlled test expected at least 2 starting points; got ${starts.length}`
            );
          }

          if (!startNames.has("artificial intelligence")) {
            errors.push(
              "Cosmos Core did not resolve Artificial Intelligence starting point"
            );
          }

          if (!startNames.has("data centers")) {
            errors.push(
              "Cosmos Core did not resolve Data Centers starting point"
            );
          }

          const context = payload.selected_context || {};

          for (const key of [
            "systems",
            "attention",
            "patterns",
            "emergences",
            "impacts",
            "developments",
            "relationships",
            "entities"
          ]) {
            if (!Array.isArray(context[key])) {
              errors.push(`Cosmos Core selected_context.${key}[] missing`);
            }
          }

          if ((context.relationships || []).length < 1) {
            errors.push(
              "Cosmos Core controlled test produced no graph relationships"
            );
          }

          if ((context.impacts || []).length < 1) {
            errors.push(
              "Cosmos Core controlled test produced no relevant Impact context"
            );
          }

          if ((context.patterns || []).length < 1) {
            errors.push(
              "Cosmos Core controlled test produced no relevant Pattern context"
            );
          }

          if ((context.emergences || []).length < 1) {
            errors.push(
              "Cosmos Core controlled test produced no relevant Emergence context"
            );
          }

          if (
            Number(payload.navigation?.max_depth || 0) < 1 ||
            Number(payload.navigation?.max_depth || 0) > 3
          ) {
            errors.push(
              `Cosmos Core max_depth outside v0.1 bound: ${payload.navigation?.max_depth}`
            );
          }

          if (
            Number(payload.navigation?.max_branches || 0) < 1 ||
            Number(payload.navigation?.max_branches || 0) > 5
          ) {
            errors.push(
              `Cosmos Core max_branches outside v0.1 bound: ${payload.navigation?.max_branches}`
            );
          }

          if (payload.infinite_state?.terminal !== false) {
            errors.push(
              "Cosmos Core Infinite State must remain non-terminal"
            );
          }

          if (payload.infinite_state?.continuation_allowed !== true) {
            errors.push(
              "Cosmos Core must allow continuation"
            );
          }

          const safeguards = payload.safeguards || {};

          if (safeguards.creates_new_causal_claims !== false) {
            errors.push(
              "Cosmos Core must not create new causal claims"
            );
          }

          if (safeguards.upgrades_evidence_quality !== false) {
            errors.push(
              "Cosmos Core must not upgrade evidence quality"
            );
          }

          if (safeguards.forecast_generated !== false) {
            errors.push(
              "Cosmos Core v0.1 must not generate forecasts"
            );
          }

          if (safeguards.sector_whitelist_present !== false) {
            errors.push(
              "Cosmos Core must remain domain-neutral with no sector whitelist"
            );
          }

          if (safeguards.traversal_bounded_for_response !== true) {
            errors.push(
              "Cosmos Core response traversal must remain bounded"
            );
          }

          if (safeguards.source_lineage_preserved !== true) {
            errors.push(
              "Cosmos Core must preserve source lineage"
            );
          }

          if (errors.length) {
            console.error("\nCosmos Core v0.1 preflight errors:");
            for (const error of errors) {
              console.error(`- ${error}`);
            }
            process.exit(1);
          }

          console.log("");
          console.log("Cosmos Core v0.1 isolated test passed.");
          console.log(`Status:          ${payload.status}`);
          console.log(`Starting points: ${starts.length}`);

                row.graph_write_status !== "not_started") {
              errors.push(
                "Qualified admission graph-write boundary invalid"
              );
            }
          }

          for (const row of rejected) {
            if (row.validation_disposition !== "insufficient_evidence" ||
                row.persistence_level !== "none" ||
                row.graph_write_eligibility !== false ||
                row.graph_write_status !== "not_started") {
              errors.push(
                `Insufficient-evidence admission ${row.knowledge_admission_id || "(unknown)"} improperly became graph eligible`

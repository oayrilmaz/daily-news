          test -f knowledge/cosmos/emergence-current.json

          node <<'NODE'
          const fs = require("fs");

          const file = "knowledge/cosmos/emergence-current.json";
          const payload = JSON.parse(fs.readFileSync(file, "utf8"));

          if (payload.schema_version !== "0.1") {
            throw new Error(
              `Unexpected emergence schema_version: ${payload.schema_version}`
            );
          }

          if (
            !["ready", "no_emergence_above_threshold"].includes(payload.status)
          ) {
            throw new Error(
              `Invalid emergence status: ${payload.status}`
            );
          }

          if (!Array.isArray(payload.emergences)) {
            throw new Error("emergence-current.json: emergences[] missing");
          }

          console.log("");
          console.log("Real Emergence output created.");
          console.log(`Date:       ${payload.date_utc}`);
          console.log(`Status:     ${payload.status}`);
          console.log(`Emergences: ${payload.summary?.emergence_count ?? payload.emergences.length}`);
          console.log(`Output:     ${file}`);
          NODE

      - name: Commit Real Emergence Output
        if: ${{ inputs.write_emergence == true }}
        shell: bash
        run: |
          set -euo pipefail

          DATE_UTC="$(node -p "require('./knowledge/cosmos/emergence-current.json').date_utc")"
          HISTORY_FILE="knowledge/cosmos/emergence-history/${DATE_UTC}.json"

          if [ ! -f "$HISTORY_FILE" ]; then
            echo "ERROR: Expected emergence history file was not generated: $HISTORY_FILE"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            knowledge/cosmos/emergence-current.json \
            "$HISTORY_FILE"

          if git diff --cached --quiet; then
            echo "No Emergence changes to commit."
          else
            git commit -m "Update Cosmos emergence ${DATE_UTC}"
            # Another workflow may have updated main while this job was running.
            # Rebase this generated-output commit onto the latest remote tip before pushing.
            pushed=false
            for attempt in 1 2 3; do
              echo "Synchronizing with origin/${GITHUB_REF_NAME} before push (attempt ${attempt}/3)..."
              git fetch origin "${GITHUB_REF_NAME}"

              if ! git rebase "origin/${GITHUB_REF_NAME}"; then
                echo "ERROR: Could not rebase generated Cosmos output onto latest ${GITHUB_REF_NAME}."
                git rebase --abort || true
                exit 1
              fi

              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                pushed=true
                break
              fi

              echo "Remote changed again before push; retrying..."
              sleep $((attempt * 2))
            done

            if [ "$pushed" != "true" ]; then
              echo "ERROR: Could not push after 3 synchronization attempts."
              exit 1
            fi
          fi

          echo ""
          echo "Real Emergence output is now committed to the repository."
          echo "No OpenAI generation was executed."

      - name: Preflight Complete
        run: |
          echo "======================================================"
          echo "COSMOS PREFLIGHT PASSED"
          echo "No OpenAI generation was executed by this workflow."
          if [ "${{ inputs.write_emergence }}" = "true" ]; then
            echo "Real emergence-current.json was generated and committed."
          fi
          if [ "${{ inputs.write_cosmos_state }}" = "true" ]; then
            echo "Real cosmos-state-current.json was generated and committed."
          fi
          if [ "${{ inputs.write_cosmos_core_test }}" = "true" ]; then
            echo "Controlled core-test-v0.1.json was generated and committed."
          fi
          if [ "${{ inputs.write_cosmos_attention_test }}" = "true" ]; then
            echo "Controlled attention-test-v0.2.json was generated and committed."
          fi
          if [ "${{ inputs.write_cosmos_consequence_test }}" = "true" ]; then
            echo "Controlled consequence-test-v0.1.json was generated and committed."
          fi
          if [ "${{ inputs.write_cosmos_discovery_test }}" = "true" ]; then
            echo "Controlled discovery-test-v0.1.json was generated and committed."
          fi
          if [ "${{ inputs.write_cosmos_acquisition_test }}" = "true" ]; then
            echo "Controlled acquisition-test-v0.1.json was generated and committed."
          fi
          if [ "${{ inputs.write_cosmos_applicability_test }}" = "true" ]; then
            echo "Controlled applicability-test-v0.1.json was generated and committed."
          fi
          if [ "${{ inputs.write_cosmos_decomposition_test }}" = "true" ]; then
            echo "Controlled decomposition-test-v0.1.json was generated and committed."
          fi
          if [ "${{ inputs.write_cosmos_candidate_validation_test }}" = "true" ]; then
            echo "Controlled candidate-validation-test-v0.1.json was generated and committed."
          fi
          if [ "${{ inputs.write_cosmos_evidence_strategy_test }}" = "true" ]; then
            echo "Controlled evidence-strategy-test-v0.1.json was generated and committed."
          fi
          if [ "${{ inputs.write_cosmos_evidence_executor_test }}" = "true" ]; then
            echo "Controlled evidence-executor-test-v0.1.json was generated and committed."
          fi
          if [ "${{ inputs.write_cosmos_evidence_validator_test }}" = "true" ]; then
            echo "Controlled evidence-validator-test-v0.1.json was generated and committed."
          fi
          if [ "${{ inputs.write_cosmos_knowledge_admission_test }}" = "true" ]; then
            echo "Controlled knowledge-admission-test-v0.1.json was generated and committed."
          fi
          if [ "${{ inputs.write_emergence }}" != "true" ] && \
             [ "${{ inputs.write_cosmos_state }}" != "true" ] && \
             [ "${{ inputs.write_cosmos_core_test }}" != "true" ] && \
             [ "${{ inputs.write_cosmos_attention_test }}" != "true" ] && \
             [ "${{ inputs.write_cosmos_consequence_test }}" != "true" ] && \
             [ "${{ inputs.write_cosmos_discovery_test }}" != "true" ] && \
             [ "${{ inputs.write_cosmos_acquisition_test }}" != "true" ] && \
             [ "${{ inputs.write_cosmos_applicability_test }}" != "true" ] && \
             [ "${{ inputs.write_cosmos_decomposition_test }}" != "true" ] && \
             [ "${{ inputs.write_cosmos_candidate_validation_test }}" != "true" ] && \
             [ "${{ inputs.write_cosmos_evidence_strategy_test }}" != "true" ] && \
             [ "${{ inputs.write_cosmos_evidence_executor_test }}" != "true" ] && \
             [ "${{ inputs.write_cosmos_evidence_validator_test }}" != "true" ] && \
             [ "${{ inputs.write_cosmos_knowledge_admission_test }}" != "true" ]; then
            echo "Isolated validation only; repository intelligence files were not changed."
          else
            echo "Upload the newly generated output file(s) to ChatGPT for inspection before production integration."
          fi
          echo "======================================================"


            node scripts/cosmos_discovery.cjs \
              --input knowledge/cosmos/consequence-test-v0.1.json \
              --out knowledge/cosmos/discovery-test-v0.1.json
          )

          TEST_DIR="$TEST_DIR" node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const root = process.env.TEST_DIR;
          const file = path.join(
            root,
            "knowledge/cosmos/discovery-test-v0.1.json"
          );

          if (!fs.existsSync(file)) {
            throw new Error(
              "Cosmos Discovery did not create knowledge/cosmos/discovery-test-v0.1.json"
            );
          }

          const payload = JSON.parse(fs.readFileSync(file, "utf8"));
          const errors = [];

          if (payload.schema_version !== "0.1") {
            errors.push(
              `Unexpected Cosmos Discovery schema_version: ${payload.schema_version}`
            );
          }

          if (payload.status !== "discovery_targets_resolved") {
            errors.push(
              `Cosmos Discovery failed to resolve targets: ${payload.status}`
            );
          }

          if (payload.source_consequence?.schema_version !== "0.1") {
            errors.push(
              `Cosmos Discovery must consume Consequence v0.1; got ${payload.source_consequence?.schema_version}`
            );
          }

          const targets =
            payload.discovery_targets?.items ||
            payload.discovery_targets ||
            [];

          if (!Array.isArray(targets) || targets.length < 1) {
            errors.push("Cosmos Discovery produced no discovery_targets");
          }

          const queue = payload.next_acquisition_queue || [];

          if (!Array.isArray(queue) || queue.length < 1) {
            errors.push("Cosmos Discovery next_acquisition_queue[] missing or empty");
          }

          const allowedActions = new Set([
            "resolve_entity",
            "validate_direction",
            "strengthen_evidence",
            "identify_suppliers",
            "identify_buyers",
            "identify_substitutes",
            "identify_capacity",
            "identify_geography",
            "identify_logistics",
            "identify_people",
            "identify_companies",
            "identify_components",
            "identify_materials",
            "identify_market_exposure",
            "extend_frontier"
          ]);

          for (const target of targets) {
            const action =
              target.discovery_action ||
              target.action ||
              target.target_type;

            if (action && !allowedActions.has(action)) {
              errors.push(
                `Discovery target ${target.discovery_target_id || target.target_id || "(unknown)"} has invalid action ${action}`
              );
            }

            if (typeof target.reopens_frontier_if_resolved !== "boolean") {
              errors.push(
                `Discovery target ${target.discovery_target_id || target.target_id || "(unknown)"} missing reopens_frontier_if_resolved boolean`
              );
            }
          }

          for (let i = 0; i < queue.length; i += 1) {
            const row = queue[i];

            if (i > 0) {
              const prev = queue[i - 1];
              const prevRank = Number(prev.queue_rank ?? i);
              const rank = Number(row.queue_rank ?? i + 1);

              if (Number.isFinite(prevRank) &&
                  Number.isFinite(rank) &&
                  rank <= prevRank) {
                errors.push("Cosmos Discovery acquisition queue is not ranked");
                break;
              }
            }
          }

          const targetTypes = new Set(
            targets.map(target =>
              target.discovery_action ||
              target.action ||
              target.target_type
            ).filter(Boolean)
          );

          if (targetTypes.size < 1) {
            errors.push(
              "Cosmos Discovery controlled test produced no classified discovery target types"
            );
          }

          const reopenableTargets = targets.filter(
            target => target.reopens_frontier_if_resolved === true
          );

          if (reopenableTargets.length < 1) {
            errors.push(
              "Cosmos Discovery controlled test produced no frontier-reopening targets"
            );
          }

          if (!targetTypes.has("extend_frontier") &&
              payload.curiosity_state?.continuation_possible === true &&
              payload.curiosity_state?.current_frontier_is_terminal === false &&
              (payload.source_consequence?.status === "consequence_frontier_resolved")) {
            // Not every deterministic run must need extend_frontier: a non-empty
            // remaining frontier can itself keep propagation open.
            const hasReopenable = reopenableTargets.length > 0;
            if (!hasReopenable) {
              errors.push(
                "Cosmos Discovery continuation is open but no extend_frontier or other reopenable target exists"
              );
            }
          }

          const curiosity = payload.curiosity_state || {};

          if (curiosity.conceptual_distance_limit !== undefined &&
              curiosity.conceptual_distance_limit !== null) {
            errors.push(
              "Cosmos Discovery conceptual distance must remain unlimited/null"
            );
          }

          if (curiosity.continuation_possible !== true) {
            errors.push(
              "Cosmos Discovery must preserve consequence continuation"
            );
          }

          const safeguards = payload.safeguards || {};

          if (safeguards.performs_external_search !== false) {
            errors.push("Cosmos Discovery v0.1 must not execute external search");
          }

          if (safeguards.calls_openai_or_external_api !== false) {
            errors.push("Cosmos Discovery v0.1 must not use OpenAI/API generation");
          }

          if (safeguards.invents_missing_entities !== false) {
            errors.push("Cosmos Discovery must not invent missing entities");
          }

          if (safeguards.upgrades_evidence_quality !== false) {
            errors.push("Cosmos Discovery must not upgrade evidence quality");
          }

          if (safeguards.converts_unknown_to_fact !== false) {
            errors.push("Cosmos Discovery must not convert unknowns into facts");
          }

          if (safeguards.acquisition_targets_are_requests_for_knowledge_not_claims !== true) {
            errors.push(
              "Cosmos Discovery acquisition targets must remain requests for knowledge, not claims"
            );
          }

          if (safeguards.source_lineage_preserved !== true) {
            errors.push("Cosmos Discovery must preserve source lineage");
          }

          if (safeguards.consequence_frontier_may_be_reopened !== true) {
            errors.push("Cosmos Discovery must preserve frontier reopening");
          }

          if (errors.length) {
            console.error("\nCosmos Discovery v0.1 preflight errors:");
            for (const error of errors) console.error(`- ${error}`);
            process.exit(1);
          }

          console.log("");
          console.log("Cosmos Discovery v0.1 isolated test passed.");
          console.log(`Status:              ${payload.status}`);
          console.log(`Discovery targets:   ${targets.length}`);
          console.log(`Acquisition queue:   ${queue.length}`);
          console.log(
            `Reopenable targets:  ${targets.filter(x => x.reopens_frontier_if_resolved === true).length}`
          );
          console.log(
            "Knowledge-gap targeting, frontier reopening, ranked acquisition and no-invention safeguards passed."
          );
          console.log(
            "Repository files were not modified by the isolated test."
          );
          NODE

      - name: Test Cosmos Acquisition v0.1 In Isolated Workspace
        shell: bash
        run: |
          set -euo pipefail

          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEST_DIR"' EXIT

          mkdir -p "$TEST_DIR/scripts"
          mkdir -p "$TEST_DIR/knowledge/cosmos"

          cp scripts/cosmos_core.cjs "$TEST_DIR/scripts/cosmos_core.cjs"
          cp scripts/cosmos_attention.cjs "$TEST_DIR/scripts/cosmos_attention.cjs"
          cp scripts/cosmos_consequence.cjs "$TEST_DIR/scripts/cosmos_consequence.cjs"
          cp scripts/cosmos_discovery.cjs "$TEST_DIR/scripts/cosmos_discovery.cjs"
          cp scripts/cosmos_acquisition.cjs "$TEST_DIR/scripts/cosmos_acquisition.cjs"
          cp knowledge/cosmos/cosmos-state-current.json \
            "$TEST_DIR/knowledge/cosmos/cosmos-state-current.json"

          cat > "$TEST_DIR/core-input.json" <<'JSON'
          {
            "text": "What could AI data-center growth affect?",
            "language": "en",
            "entity_hints": [
              "Artificial Intelligence",
              "Data Centers"
            ],
            "mode": "open",
            "metadata": {
              "purpose": "cosmos_acquisition_v0.1_preflight"
            }
          }
          JSON

          (
            cd "$TEST_DIR"

            node scripts/cosmos_core.cjs \
              --input core-input.json \
              --out knowledge/cosmos/core-test-v0.1.json

            node scripts/cosmos_attention.cjs \
              --input knowledge/cosmos/core-test-v0.1.json \
              --out knowledge/cosmos/attention-test-v0.2.json

            node scripts/cosmos_consequence.cjs \
              --input knowledge/cosmos/attention-test-v0.2.json \
              --out knowledge/cosmos/consequence-test-v0.1.json

            node scripts/cosmos_discovery.cjs \
              --input knowledge/cosmos/consequence-test-v0.1.json \
              --out knowledge/cosmos/discovery-test-v0.1.json

            node scripts/cosmos_acquisition.cjs \
              --input knowledge/cosmos/discovery-test-v0.1.json \
              --out knowledge/cosmos/acquisition-test-v0.1.json
          )

          TEST_DIR="$TEST_DIR" node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const root = process.env.TEST_DIR;
          const file = path.join(
            root,
            "knowledge/cosmos/acquisition-test-v0.1.json"
          );

          if (!fs.existsSync(file)) {
            throw new Error(
              "Cosmos Acquisition did not create knowledge/cosmos/acquisition-test-v0.1.json"
            );
          }

          const payload = JSON.parse(fs.readFileSync(file, "utf8"));
          const errors = [];

          if (payload.schema_version !== "0.1") {
            errors.push(
              `Unexpected Cosmos Acquisition schema_version: ${payload.schema_version}`
            );
          }

          if (payload.status !== "acquisition_plans_resolved") {
            errors.push(
              `Cosmos Acquisition failed to resolve plans: ${payload.status}`
            );
          }

          if (payload.source_discovery?.schema_version !== "0.1") {
            errors.push(
              `Cosmos Acquisition must consume Discovery v0.1; got ${payload.source_discovery?.schema_version}`
            );
          }

          const plans = payload.acquisition_plans || [];
          const executorQueue = payload.future_executor_queue || [];

          if (!Array.isArray(plans) || plans.length < 1) {
            errors.push("Cosmos Acquisition produced no acquisition_plans[]");
          }

          if (!Array.isArray(executorQueue) || executorQueue.length < 1) {
            errors.push("Cosmos Acquisition future_executor_queue[] missing or empty");
          }

          if (plans.length !== executorQueue.length) {
            errors.push(
              `Cosmos Acquisition plan/executor queue mismatch: ${plans.length} vs ${executorQueue.length}`
            );
          }

          const planIds = new Set();

          for (const plan of plans) {
            if (!plan.acquisition_plan_id) {
              errors.push("Acquisition plan missing acquisition_plan_id");
              continue;
            }

            if (planIds.has(plan.acquisition_plan_id)) {
              errors.push(
                `Duplicate acquisition_plan_id ${plan.acquisition_plan_id}`
              );
            }
            planIds.add(plan.acquisition_plan_id);

            if (!plan.discovery_target_id) {
              errors.push(
                `Acquisition plan ${plan.acquisition_plan_id} missing discovery_target_id`
              );
            }

            if (!plan.target_type || !plan.statement) {
              errors.push(
                `Acquisition plan ${plan.acquisition_plan_id} missing target_type/statement`
              );
            }

            if (!plan.lineage || typeof plan.lineage !== "object") {
              errors.push(
                `Acquisition plan ${plan.acquisition_plan_id} missing lineage`
              );
            } else {
              for (const key of [
                "entity_ids",
                "consequence_ids",
                "relationship_ids",
                "originating_gap_ids"
              ]) {
                if (!Array.isArray(plan.lineage[key])) {
                  errors.push(
                    `Acquisition plan ${plan.acquisition_plan_id} lineage.${key}[] missing`
                  );
                }
              }
            }

            if (!Array.isArray(plan.query_templates) ||
                plan.query_templates.length < 1) {
              errors.push(
                `Acquisition plan ${plan.acquisition_plan_id} has no query_templates`
              );
            }

            if (!Array.isArray(plan.source_strategy) ||
                plan.source_strategy.length < 1) {
              errors.push(
                `Acquisition plan ${plan.acquisition_plan_id} has no source_strategy`
              );
            } else {
              let previousAuthority = Infinity;

              for (const source of plan.source_strategy) {
                if (!source.source_type ||
                    !Number.isFinite(Number(source.authority_score))) {
                  errors.push(
                    `Acquisition plan ${plan.acquisition_plan_id} has invalid source strategy`
                  );
                  continue;
                }

                const score = Number(source.authority_score);

                if (score > previousAuthority + 1e-9) {
                  errors.push(
                    `Acquisition plan ${plan.acquisition_plan_id} source strategy is not authority-ranked`
                  );
                }

                previousAuthority = score;

                if (source.acquisition_status !== "planned" ||
                    source.execution_adapter !== "unassigned") {
                  errors.push(
                    `Acquisition plan ${plan.acquisition_plan_id} prematurely executes a source`
                  );
                }
              }
            }

            const contract = plan.evidence_contract || {};

            if (!contract.objective ||
                !Array.isArray(contract.required_fields) ||
                !Array.isArray(contract.validation_rules) ||
                !Array.isArray(contract.accepted_dispositions)) {
              errors.push(
                `Acquisition plan ${plan.acquisition_plan_id} evidence contract invalid`
              );
            }

            if (contract.evidence_is_not_knowledge_until_validated !== true ||
                contract.knowledge_admission_status !== "not_evaluated") {
              errors.push(
                `Acquisition plan ${plan.acquisition_plan_id} bypasses evidence validation`
              );
            }

            if (!plan.frontier_effect ||
                typeof plan.frontier_effect.reopens_frontier_if_resolved !== "boolean") {
              errors.push(
                `Acquisition plan ${plan.acquisition_plan_id} frontier effect invalid`
              );
            }

            if (plan.frontier_effect?.reopens_frontier_if_resolved === true &&
                plan.frontier_effect?.consequence_frontier_action !==
                  "eligible_for_repropagation_after_validation") {
              errors.push(
                `Acquisition plan ${plan.acquisition_plan_id} may reopen frontier before validation`
              );
            }

            if (plan.execution?.mode !== "planned_only" ||
                plan.execution?.network_execution_performed !== false ||
                plan.execution?.executor_status !== "not_connected" ||
                Number(plan.execution?.result_count) !== 0) {
              errors.push(
                `Acquisition plan ${plan.acquisition_plan_id} execution boundary invalid`
              );
            }
          }

          for (let i = 0; i < executorQueue.length; i += 1) {
            const row = executorQueue[i];

            if (Number(row.execution_rank) !== i + 1) {
              errors.push(
                `Future executor queue rank invalid at index ${i}`
              );
            }

            if (!planIds.has(row.acquisition_plan_id)) {
              errors.push(
                `Future executor queue references unknown plan ${row.acquisition_plan_id}`
              );
            }

            if (row.execution_status !== "not_connected") {
              errors.push(
                `Future executor queue ${row.acquisition_plan_id} must remain not_connected`
              );
            }

            if (!Array.isArray(row.query_templates) ||
                !Array.isArray(row.source_strategy)) {
              errors.push(
                `Future executor queue ${row.acquisition_plan_id} missing planned query/source strategy`
              );
            }
          }

          const state = payload.acquisition_state || {};

          if (Number(state.plan_count) !== plans.length) {
            errors.push(
              `Cosmos Acquisition state.plan_count mismatch: ${state.plan_count} vs ${plans.length}`
            );
          }

          if (state.execution_mode !== "planned_only" ||
              state.external_execution_connected !== false) {
            errors.push(
              "Cosmos Acquisition v0.1 must remain planning-only"
            );
          }

          if (state.evidence_validation_required_before_graph_admission !== true) {
            errors.push(
              "Cosmos Acquisition must require validation before graph admission"
            );
          }

          if (state.conceptual_distance_limit !== null) {
            errors.push(
              "Cosmos Acquisition conceptual distance must remain unlimited/null"
            );
          }

          if (state.continuation_possible !== true) {
            errors.push(
              "Cosmos Acquisition must preserve Cosmos continuation"
            );
          }

          const safeguards = payload.safeguards || {};

          if (safeguards.performs_external_search !== false ||
              safeguards.calls_openai_or_external_api !== false ||
              safeguards.invents_evidence !== false ||
              safeguards.invents_entities !== false ||
              safeguards.upgrades_evidence_quality !== false ||
              safeguards.writes_to_knowledge_graph !== false ||
              safeguards.converts_acquisition_plan_to_fact !== false ||
              safeguards.evidence_requires_validation !== true ||
              safeguards.source_lineage_preserved !== true ||
              safeguards.discovery_lineage_preserved !== true ||
              safeguards.frontier_reopens_only_after_validation !== true) {
            errors.push("Cosmos Acquisition safeguards invalid");
          }

          if (errors.length) {
            console.error("\nCosmos Acquisition v0.1 preflight errors:");
            for (const error of errors) {
              console.error(`- ${error}`);
            }
            process.exit(1);
          }

          console.log("");
          console.log("Cosmos Acquisition v0.1 isolated test passed.");
          console.log(`Status:             ${payload.status}`);
          console.log(`Acquisition plans:  ${plans.length}`);
          console.log(`Executor queue:      ${executorQueue.length}`);
          console.log(
            `Reopening plans:     ${plans.filter(x => x.frontier_effect?.reopens_frontier_if_resolved === true).length}`
          );
          console.log(
            "Planning-only execution boundary, ranked source strategy, evidence contracts, lineage and validation-before-knowledge safeguards passed."
          );
          console.log(
            "Repository files were not modified by the isolated test."
          );
          NODE

      - name: Test Cosmos Acquisition Applicability v0.1 In Isolated Workspace
        shell: bash
        run: |
          set -euo pipefail

          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEST_DIR"' EXIT


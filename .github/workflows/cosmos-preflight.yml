          const fs = require("fs");
          const path = require("path");

          const root = process.env.TEST_DIR;
          const file = path.join(
            root,
            "knowledge/cosmos/evidence-executor-test-v0.1.json"
          );

          if (!fs.existsSync(file)) {
            throw new Error(
              "Cosmos Evidence Executor did not create evidence-executor-test-v0.1.json"
            );
          }

          const payload = JSON.parse(fs.readFileSync(file, "utf8"));
          const errors = [];

          if (payload.schema_version !== "0.1") {
            errors.push(
              `Unexpected Cosmos Evidence Executor schema_version: ${payload.schema_version}`
            );
          }

          if (payload.status !== "evidence_execution_normalized") {
            errors.push(
              `Cosmos Evidence Executor failed: ${payload.status}`
            );
          }

          if (payload.source_evidence_strategy?.schema_version !== "0.1") {
            errors.push(
              `Cosmos Evidence Executor must consume Evidence Strategy v0.1; got ${payload.source_evidence_strategy?.schema_version}`
            );
          }

          if (payload.source_adapter?.adapter_name !==
              "cosmos_preflight_mock_adapter" ||
              payload.source_adapter?.adapter_mode !==
              "deterministic_fixture") {
            errors.push(
              "Cosmos Evidence Executor did not preserve adapter identity/mode"
            );
          }

          const state = payload.execution_state || {};
          const records = payload.evidence_records || [];
          const taskExecution = payload.task_execution || [];
          const orphans = payload.orphan_results || [];
          const validationQueue = payload.validation_queue || [];

          if (Number(state.evidence_task_count) !== 7) {
            errors.push(
              `Controlled Evidence Executor expected 7 evidence tasks; got ${state.evidence_task_count}`
            );
          }

          if (Number(state.adapter_result_count) !== 4) {
            errors.push(
              `Controlled Evidence Executor expected 4 adapter results; got ${state.adapter_result_count}`
            );
          }

          if (Number(state.normalized_evidence_record_count) !== 3) {
            errors.push(
              `Controlled Evidence Executor expected 3 normalized evidence records; got ${state.normalized_evidence_record_count}`
            );
          }

          if (Number(state.orphan_result_count) !== 1) {
            errors.push(
              `Controlled Evidence Executor expected 1 orphan result; got ${state.orphan_result_count}`
            );
          }

          if (Number(state.validation_decision_count) !== 0 ||
              Number(state.knowledge_admission_count) !== 0) {
            errors.push(
              "Cosmos Evidence Executor v0.1 must not make validation or knowledge-admission decisions"
            );
          }

          if (state.conceptual_distance_limit !== null) {
            errors.push(
              "Cosmos Evidence Executor conceptual distance must remain unlimited/null"
            );
          }

          if (state.continuation_possible !== true) {
            errors.push(
              "Cosmos Evidence Executor must preserve Cosmos continuation"
            );
          }

          if (!Array.isArray(records) || records.length !== 3) {
            errors.push(
              "Cosmos Evidence Executor normalized evidence_records[] invalid"
            );
          }

          const recordIds = new Set();

          for (const record of records) {
            if (!record.evidence_record_id ||
                !record.evidence_task_id ||
                !record.validation_target_id) {
              errors.push(
                "Cosmos Evidence Executor record missing identity/lineage"
              );
              continue;
            }

            if (recordIds.has(record.evidence_record_id)) {
              errors.push(
                `Duplicate evidence_record_id ${record.evidence_record_id}`
              );
            }
            recordIds.add(record.evidence_record_id);

            if (!record.source_url_or_identifier ||
                !record.source_title ||
                !record.extracted_fact ||
                !record.independence_group) {
              errors.push(
                `Evidence record ${record.evidence_record_id} missing source/evidence fields`
              );
            }

            if (![
              "supports",
              "partially_supports",
              "contradicts",
              "context_only",
              "insufficient"
            ].includes(record.supports_or_contradicts)) {
              errors.push(
                `Evidence record ${record.evidence_record_id} has invalid disposition`
              );
            }

            if (record.epistemic_status !== "collected_evidence" ||
                record.validation_status !== "not_evaluated" ||
                record.knowledge_status !== "not_admitted") {
              errors.push(
                `Evidence record ${record.evidence_record_id} crossed validation/knowledge boundary`
              );
            }

            if (record.record_quality?.has_source_identity !== true ||
                record.record_quality?.has_extracted_fact !== true ||
                record.record_quality?.has_source_date !== true ||
                record.record_quality?.has_publisher !== true ||
                record.record_quality?.has_independence_group !== true) {
              errors.push(
                `Evidence record ${record.evidence_record_id} record-quality flags invalid`
              );
            }
          }

          const contradictionRecords = records.filter(
            r => r.supports_or_contradicts === "contradicts"
          );

          if (contradictionRecords.length !== 1) {
            errors.push(
              `Controlled Evidence Executor expected exactly 1 contradictory evidence record; got ${contradictionRecords.length}`
            );
          }

          const dataCentersExecution = taskExecution.find(
            row => Number(row.collected_record_count) === 3
          );

          if (!dataCentersExecution) {
            errors.push(
              "Cosmos Evidence Executor did not resolve the data-centers task execution summary"
            );
          } else {
            if (Number(dataCentersExecution.supporting_record_count) !== 2 ||
                Number(dataCentersExecution.contradiction_record_count) !== 1 ||
                Number(dataCentersExecution.direct_high_authority_record_count) !== 2 ||
                Number(dataCentersExecution.independent_source_group_count) !== 3) {
              errors.push(
                "Cosmos Evidence Executor data-centers evidence counts invalid"
              );
            }

            const sufficiency =
              dataCentersExecution.sufficiency_observation || {};

            if (sufficiency.total_source_threshold_met !== true ||
                sufficiency.independent_source_threshold_met !== true ||
                sufficiency.direct_primary_preference_met !== true ||
                sufficiency.contradiction_search_observed !== true) {
              errors.push(
                "Cosmos Evidence Executor sufficiency observations invalid"
              );
            }

            if (dataCentersExecution.execution_status !== "evidence_collected" ||
                dataCentersExecution.validation_status !== "not_started" ||
                dataCentersExecution.knowledge_admission_status !== "not_started") {
              errors.push(
                "Cosmos Evidence Executor task crossed validation/knowledge boundary"
              );
            }
          }

          if (!Array.isArray(taskExecution) ||
              taskExecution.length !== 7) {
            errors.push(
              `Cosmos Evidence Executor expected 7 task_execution rows; got ${taskExecution.length}`
            );
          }

          const emptyTasks = taskExecution.filter(
            row => Number(row.collected_record_count) === 0
          );

          if (emptyTasks.length !== 6 ||
              emptyTasks.some(
                row => row.execution_status !== "no_evidence_returned"
              )) {
            errors.push(
              "Cosmos Evidence Executor no-evidence task handling invalid"
            );
          }

          if (!Array.isArray(validationQueue) ||
              validationQueue.length !== 7) {
            errors.push(
              "Cosmos Evidence Executor validation_queue[] invalid"
            );
          }

          for (let i = 0; i < validationQueue.length; i += 1) {
            const row = validationQueue[i];

            if (Number(row.validation_rank) !== i + 1) {
              errors.push(
                `Evidence Executor validation queue rank invalid at index ${i}`
              );
            }

            if (!Array.isArray(row.evidence_record_ids)) {
              errors.push(
                `Evidence Executor validation queue ${row.evidence_task_id} missing evidence_record_ids[]`
              );
            }

            if (row.validation_status !== "not_started" ||
                row.knowledge_admission_status !== "not_started") {
              errors.push(
                `Evidence Executor validation queue ${row.evidence_task_id} crossed validation boundary`
              );
            }
          }

          if (!Array.isArray(orphans) ||
              orphans.length !== 1 ||
              orphans[0].reason !== "unknown_evidence_task_id") {
            errors.push(
              "Cosmos Evidence Executor orphan-result preservation invalid"
            );
          }

          const safeguards = payload.safeguards || {};

          if (safeguards.performs_external_search !== false ||
              safeguards.calls_openai_or_external_api !== false ||
              safeguards.adapter_results_are_treated_as_unvalidated_input !== true ||
              safeguards.invents_evidence !== false ||
              safeguards.validates_candidates !== false ||
              safeguards.promotes_candidates_to_facts !== false ||
              safeguards.writes_to_knowledge_graph !== false ||
              safeguards.preserves_contradictory_evidence !== true ||
              safeguards.preserves_orphan_adapter_results !== true ||
              safeguards.source_lineage_preserved !== true ||
              safeguards.validation_required_before_knowledge_admission !== true ||
              safeguards.unlimited_conceptual_continuation_preserved !== true) {
            errors.push("Cosmos Evidence Executor safeguards invalid");
          }

          if (errors.length) {
            console.error("\nCosmos Evidence Executor v0.1 preflight errors:");
            for (const error of errors) {
              console.error(`- ${error}`);
            }
            process.exit(1);
          }

          console.log("");
          console.log("Cosmos Evidence Executor v0.1 isolated test passed.");
          console.log(`Status:                 ${payload.status}`);
          console.log(`Evidence tasks:         ${state.evidence_task_count}`);
          console.log(`Adapter results:        ${state.adapter_result_count}`);
          console.log(`Normalized records:     ${state.normalized_evidence_record_count}`);
          console.log(`Contradictions retained:${contradictionRecords.length}`);
          console.log(`Orphan results retained:${state.orphan_result_count}`);
          console.log(`Validation decisions:   ${state.validation_decision_count}`);
          console.log(`Knowledge admitted:     ${state.knowledge_admission_count}`);
          console.log(
            "Evidence normalization, independent-source counting, contradiction preservation, orphan preservation and validation-before-knowledge safeguards passed."
          );
          console.log(
            "Repository files were not modified by the isolated test."
          );
          NODE


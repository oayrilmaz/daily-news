              );
            }

            if (!Array.isArray(target.original_target_types) ||
                target.original_target_types.length < 1 ||
                !Array.isArray(target.proposed_investigation_types) ||
                target.proposed_investigation_types.length < 1) {
              errors.push(
                `Validation target ${target.validation_target_id} missing investigation intents`
              );
            }

            if (!target.validation_objective ||
                !Array.isArray(target.validation_requirements) ||
                target.validation_requirements.length < 1) {
              errors.push(
                `Validation target ${target.validation_target_id} missing validation contract`
              );
            }

            const contract = target.evidence_contract || {};

            if (Number(contract.minimum_independent_sources) < 1 ||
                contract.preferred_source_characteristic !==
                  "primary_or_authoritative_where_available" ||
                contract.contradiction_capture_required !== true ||
                contract.provenance_required !== true ||
                contract.source_date_required !== true ||
                contract.relationship_direction_required_where_applicable !== true ||
                !Array.isArray(contract.disposition_options) ||
                contract.disposition_options.length < 4) {
              errors.push(
                `Validation target ${target.validation_target_id} evidence contract invalid`
              );
            }

            if (!target.post_validation_fanout ||
                !Array.isArray(target.post_validation_fanout.if_supported) ||
                !Array.isArray(target.post_validation_fanout.if_partially_supported) ||
                !Array.isArray(target.post_validation_fanout.if_contradicted) ||
                !Array.isArray(target.post_validation_fanout.if_insufficient_evidence)) {
              errors.push(
                `Validation target ${target.validation_target_id} post-validation fanout invalid`
              );
            }

            if (!target.lineage ||
                !Array.isArray(target.lineage.source_candidate_ids) ||
                !Array.isArray(target.lineage.acquisition_plan_ids) ||
                !Array.isArray(target.lineage.discovery_target_ids) ||
                !Array.isArray(target.lineage.source_lineage)) {
              errors.push(
                `Validation target ${target.validation_target_id} lineage block invalid`
              );
            }
          }

          const expectedLabels = [
            "AI compute infrastructure",
            "semiconductors and accelerators",
            "data centers",
            "electricity demand",
            "cooling systems",
            "networking infrastructure",
            "software/model infrastructure"
          ];

          const labels = new Set(
            targets.map(x => String(x.candidate_label || ""))
          );

          for (const expected of expectedLabels) {
            if (!labels.has(expected)) {
              errors.push(
                `Candidate Validation Planner missing expected unique target: ${expected}`
              );
            }
          }

          const dataCenters = targets.find(
            x => String(x.candidate_label || "").toLowerCase() === "data centers"
          );

          if (!dataCenters) {
            errors.push(
              "Candidate Validation Planner did not resolve unique data centers target"
            );
          } else {
            const types = new Set(dataCenters.original_target_types || []);

            for (const expectedType of [
              "identify_components",
              "identify_materials",
              "identify_capacity"
            ]) {
              if (!types.has(expectedType)) {
                errors.push(
                  `Data centers validation target lost parent intent ${expectedType}`
                );
              }
            }

            if (Number(dataCenters.merged_from_candidate_count) !== 3) {
              errors.push(
                `Data centers validation target should merge 3 candidates; got ${dataCenters.merged_from_candidate_count}`
              );
            }
          }

          for (let i = 0; i < queue.length; i += 1) {
            const row = queue[i];

            if (Number(row.evidence_rank) !== i + 1) {
              errors.push(
                `Future evidence queue rank invalid at index ${i}`
              );
            }

            if (!targetIds.has(row.validation_target_id)) {
              errors.push(
                `Future evidence queue references unknown validation target ${row.validation_target_id}`
              );
            }

            if (row.execution_status !== "not_connected" ||
                row.validation_status !== "not_started") {
              errors.push(
                `Future evidence queue ${row.validation_target_id} crossed execution/validation boundary`
              );
            }

            if (!row.validation_objective ||
                !Array.isArray(row.validation_requirements) ||
                !row.evidence_contract ||
                !Array.isArray(row.proposed_investigation_types)) {
              errors.push(
                `Future evidence queue ${row.validation_target_id} missing evidence-ready planning fields`
              );
            }
          }

          const safeguards = payload.safeguards || {};

          if (safeguards.performs_external_search !== false ||
              safeguards.calls_openai_or_external_api !== false ||
              safeguards.validates_candidates !== false ||
              safeguards.invents_evidence !== false ||
              safeguards.writes_to_knowledge_graph !== false ||
              safeguards.promotes_candidates_to_facts !== false ||
              safeguards.duplicate_semantic_candidates_consolidated !== true ||
              safeguards.parent_lineage_preserved !== true ||
              safeguards.investigation_intents_preserved !== true ||
              safeguards.evidence_required_before_validation !== true ||
              safeguards.validation_required_before_execution !== true ||
              safeguards.unlimited_conceptual_continuation_preserved !== true) {
            errors.push("Candidate Validation Planner safeguards invalid");
          }

          if (errors.length) {
            console.error("\nCosmos Candidate Validation Planner v0.1 preflight errors:");
            for (const error of errors) {
              console.error(`- ${error}`);
            }
            process.exit(1);
          }

          console.log("");
          console.log("Cosmos Candidate Validation Planner v0.1 isolated test passed.");
          console.log(`Status:                ${payload.status}`);
          console.log(`Raw candidates:        ${state.raw_candidate_count}`);
          console.log(`Unique targets:        ${state.unique_validation_target_count}`);
          console.log(`Duplicates collapsed:  ${state.duplicate_candidate_count}`);
          console.log(`Future evidence queue: ${queue.length}`);
          console.log(`Validated:             ${state.validated_target_count}`);
          console.log(`Executable:            ${state.executable_target_count}`);
          console.log(
            "Semantic consolidation, parent-lineage preservation, evidence contracts and no-validation/no-execution safeguards passed."
          );
          console.log(
            "Repository files were not modified by the isolated test."
          );
          NODE

      - name: Test Cosmos Evidence Strategy v0.1 In Isolated Workspace
        shell: bash
        run: |

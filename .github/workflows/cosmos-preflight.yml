          if (firstState.conceptual_distance_limit !== null ||
              firstState.continuation_possible !== true ||
              secondState.conceptual_distance_limit !== null ||
              secondState.continuation_possible !== true) {
            errors.push("Graph Writer did not preserve unlimited conceptual continuation");
          }

          if (errors.length) {
            console.error("\nCosmos Graph Writer v0.1 preflight errors:");
            for (const error of errors) console.error(`- ${error}`);

          }

          if (!Array.isArray(graphQueue) || graphQueue.length !== 1) {
            errors.push(
              `Controlled Knowledge Admission expected 1 graph_write_queue item; got ${graphQueue.length}`
            );
          } else {
            const row = graphQueue[0];

            if (row.graph_write_rank !== 1 ||
                row.admitted_claim_class !== "validated_qualified_relationship" ||
                row.validation_disposition !== "partially_supported" ||
                Number(row.confidence_score) !== 76 ||
                row.graph_write_status !== "not_started" ||
                !Array.isArray(row.evidence_record_ids) ||
                row.evidence_record_ids.length !== 3) {
              errors.push(
                "Knowledge Admission graph_write_queue item invalid"
              );
            }
          }

          const safeguards = payload.safeguards || {};

          if (safeguards.performs_external_search !== false ||
              safeguards.calls_openai_or_external_api !== false ||
              safeguards.writes_to_knowledge_graph !== false ||
              safeguards.admission_is_not_graph_mutation !== true ||
              safeguards.insufficient_or_unresolved_not_admitted !== true ||
              safeguards.partially_supported_requires_qualification !== true ||
              safeguards.contradictory_evidence_preserved !== true ||
              safeguards.confidence_preserved !== true ||
              safeguards.source_lineage_preserved !== true ||
              safeguards.graph_writes_are_reversible !== true ||
              safeguards.separate_graph_writer_required !== true ||
              safeguards.unlimited_conceptual_continuation_preserved !== true) {
            errors.push(
              "Cosmos Knowledge Admission safeguards invalid"
            );
          }

          if (errors.length) {
            console.error("\nCosmos Knowledge Admission v0.1 preflight errors:");
            for (const error of errors) {
              console.error(`- ${error}`);
            }
            process.exit(1);
          }

          console.log("");
          console.log("Cosmos Knowledge Admission v0.1 isolated test passed.");
          console.log(`Status:                    ${payload.status}`);
          console.log(`Validations reviewed:      ${state.reviewed_count}`);
          console.log(`Admit with qualification:  ${state.by_decision?.admit_with_qualification || 0}`);
          console.log(`Reject for now:            ${state.by_decision?.reject_for_now || 0}`);
          console.log(`Graph-write eligible:      ${state.graph_write_eligible_count}`);
          console.log(`Graph writes performed:    ${state.graph_write_count}`);

          console.log(`Discovery targets: ${targets.length}`);
          console.log(`Acquisition queue: ${queue.length}`);
          console.log(
            `Reopenable:         ${targets.filter(x => x.reopens_frontier_if_resolved === true).length}`
          );
          console.log(`Output:            ${file}`);
          NODE


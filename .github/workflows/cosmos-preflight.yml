              --input knowledge/cosmos/core-test-v0.1.json \
              --out knowledge/cosmos/attention-test-v0.2.json

            node scripts/cosmos_consequence.cjs \
              --input knowledge/cosmos/attention-test-v0.2.json \
              --out knowledge/cosmos/consequence-test-v0.1.json

            node scripts/cosmos_discovery.cjs \
              --input knowledge/cosmos/consequence-test-v0.1.json \
              --out knowledge/cosmos/discovery-test-v0.1.json

            node scripts/cosmos_acquisition.cjs \
              --input knowledge/cosmos/discovery-test-v0.1.json \
              --out knowledge/cosmos/acquisition-test-v0.1.json

            node scripts/cosmos_acquisition_applicability.cjs \
              --input knowledge/cosmos/acquisition-test-v0.1.json \
              --out knowledge/cosmos/applicability-test-v0.1.json

            node scripts/cosmos_decomposition.cjs \
              --input knowledge/cosmos/applicability-test-v0.1.json \
              --out knowledge/cosmos/decomposition-test-v0.1.json

            node scripts/cosmos_candidate_validation.cjs \
              --input knowledge/cosmos/decomposition-test-v0.1.json \
              --out knowledge/cosmos/candidate-validation-test-v0.1.json

            node scripts/cosmos_evidence_strategy.cjs \
              --input knowledge/cosmos/candidate-validation-test-v0.1.json \
              --out knowledge/cosmos/evidence-strategy-test-v0.1.json
          )

          TEST_DIR="$TEST_DIR" node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const root = process.env.TEST_DIR;
          const file = path.join(
            root,
            "knowledge/cosmos/evidence-strategy-test-v0.1.json"
          );

          if (!fs.existsSync(file)) {
            throw new Error(
              "Cosmos Evidence Strategy did not create evidence-strategy-test-v0.1.json"
            );
          }

          const payload = JSON.parse(fs.readFileSync(file, "utf8"));
          const errors = [];

          if (payload.schema_version !== "0.1") {
            errors.push(
              `Unexpected Cosmos Evidence Strategy schema_version: ${payload.schema_version}`
            );
          }

          if (payload.status !== "evidence_strategy_resolved") {
            errors.push(
              `Cosmos Evidence Strategy failed: ${payload.status}`
            );
          }

          if (payload.source_candidate_validation?.schema_version !== "0.1") {
            errors.push(
              `Cosmos Evidence Strategy must consume Candidate Validation v0.1; got ${payload.source_candidate_validation?.schema_version}`
            );
          }

          const state = payload.evidence_state || {};
          const tasks = payload.evidence_tasks || [];
          const queue = payload.executor_queue || [];

          if (!Array.isArray(tasks) || tasks.length < 1) {
            errors.push("Cosmos Evidence Strategy evidence_tasks[] missing or empty");
          }

          if (!Array.isArray(queue) || queue.length < 1) {
            errors.push("Cosmos Evidence Strategy executor_queue[] missing or empty");
          }

          if (tasks.length !== queue.length) {
            errors.push(
              `Evidence Strategy task/executor queue mismatch: ${tasks.length} vs ${queue.length}`
            );
          }

          if (Number(state.validation_target_count) !== 7) {
            errors.push(
              `Controlled Evidence Strategy test expected 7 validation targets; got ${state.validation_target_count}`
            );
          }

          if (Number(state.evidence_task_count) !== 7) {
            errors.push(
              `Controlled Evidence Strategy test expected 7 evidence tasks; got ${state.evidence_task_count}`
            );
          }

          if (Number(state.evidence_collected_count) !== 0 ||
              Number(state.validation_decision_count) !== 0 ||
              Number(state.knowledge_admission_count) !== 0) {
            errors.push(
              "Cosmos Evidence Strategy v0.1 must not collect evidence, validate, or admit knowledge"
            );
          }

          if (state.external_execution_connected !== false) {
            errors.push(
              "Cosmos Evidence Strategy v0.1 must not connect external execution"
            );
          }

          if (state.conceptual_distance_limit !== null) {
            errors.push(
              "Cosmos Evidence Strategy conceptual distance must remain unlimited/null"
            );
          }

          if (state.continuation_possible !== true) {
            errors.push(
              "Cosmos Evidence Strategy must preserve Cosmos continuation"
            );
          }

          const taskIds = new Set();
          const validationTargetIds = new Set();

          for (const task of tasks) {
            if (!task.evidence_task_id ||
                !task.validation_target_id ||
                !task.abstract_subject ||
                !task.candidate_label ||
                !task.candidate_class) {
              errors.push(
                "Cosmos Evidence Strategy task missing identity/context"
              );
              continue;
            }

            if (taskIds.has(task.evidence_task_id)) {
              errors.push(
                `Duplicate evidence_task_id ${task.evidence_task_id}`
              );
            }
            taskIds.add(task.evidence_task_id);
            validationTargetIds.add(task.validation_target_id);

            if (!task.validation_objective ||
                !Array.isArray(task.evidence_questions) ||
                task.evidence_questions.length < 1 ||
                !Array.isArray(task.query_intents) ||
                task.query_intents.length < 1) {
              errors.push(
                `Evidence task ${task.evidence_task_id} missing evidence questions/query intents`
              );
            }

            if (!Array.isArray(task.source_strategy) ||
                task.source_strategy.length < 1) {
              errors.push(
                `Evidence task ${task.evidence_task_id} has no source_strategy`
              );
            } else {
              let previousAuthority = Infinity;

              for (const source of task.source_strategy) {
                const score = Number(source.authority_score);

                if (!source.source_type ||
                    !Number.isFinite(score) ||
                    !["primary", "secondary", "tertiary"].includes(source.priority)) {
                  errors.push(
                    `Evidence task ${task.evidence_task_id} has invalid source strategy`
                  );
                  continue;
                }

                if (score > previousAuthority + 1e-9) {
                  errors.push(
                    `Evidence task ${task.evidence_task_id} source strategy is not authority-ranked`
                  );
                }

                previousAuthority = score;

                if (source.acquisition_status !== "planned" ||
                    source.execution_adapter !== "unassigned") {
                  errors.push(
                    `Evidence task ${task.evidence_task_id} prematurely executes a source`
                  );
                }
              }
            }

            const sufficiency = task.sufficiency_contract || {};

            if (Number(sufficiency.minimum_total_sources) !== 2 ||
                Number(sufficiency.minimum_independent_sources) !== 2 ||
                sufficiency.direct_primary_source_preferred !== true ||
                sufficiency.contradiction_search_required !== true ||
                sufficiency.provenance_required !== true ||
                sufficiency.source_date_required !== true ||
                sufficiency.source_identity_required !== true ||
                sufficiency.extracted_fact_required !== true ||
                sufficiency.relationship_direction_required_where_applicable !== true ||
                sufficiency.geography_scope_required_where_applicable !== true ||
                sufficiency.temporal_scope_required_where_applicable !== true ||
                !sufficiency.single_source_exception) {
              errors.push(
                `Evidence task ${task.evidence_task_id} sufficiency contract invalid`
              );
            }

            const schema = task.evidence_record_schema || {};

            if (!Array.isArray(schema.required_fields) ||
                schema.required_fields.length < 10 ||
                !Array.isArray(schema.allowed_dispositions) ||
                !schema.allowed_dispositions.includes("supports") ||
                !schema.allowed_dispositions.includes("contradicts") ||
                !schema.allowed_dispositions.includes("insufficient")) {
              errors.push(
                `Evidence task ${task.evidence_task_id} evidence record schema invalid`
              );
            }

            const boundary = task.validation_boundary || {};

            if (boundary.evidence_collected !== false ||
                boundary.validation_decision_made !== false ||
                boundary.candidate_promoted !== false ||
                boundary.executable !== false ||
                boundary.knowledge_admitted !== false) {
              errors.push(
                `Evidence task ${task.evidence_task_id} crossed validation/knowledge boundary`
              );
            }

            if (!task.downstream_context ||
                !Array.isArray(task.downstream_context.original_target_types) ||
                !Array.isArray(task.downstream_context.proposed_investigation_types) ||
                !Array.isArray(task.downstream_context.if_supported_fanout) ||
                !Array.isArray(task.downstream_context.if_partially_supported_fanout)) {
              errors.push(
                `Evidence task ${task.evidence_task_id} downstream context invalid`
              );
            }

            if (!task.lineage ||
                !Array.isArray(task.lineage.source_candidate_ids) ||
                !Array.isArray(task.lineage.acquisition_plan_ids) ||
                !Array.isArray(task.lineage.discovery_target_ids)) {
              errors.push(
                `Evidence task ${task.evidence_task_id} lineage invalid`
              );
            }

            if (task.execution?.mode !== "planned_only" ||
                task.execution?.external_search_performed !== false ||
                task.execution?.executor_status !== "not_connected" ||
                Number(task.execution?.result_count) !== 0) {
              errors.push(
                `Evidence task ${task.evidence_task_id} execution boundary invalid`
              );
            }
          }

          if (taskIds.size !== tasks.length) {
            errors.push("Cosmos Evidence Strategy task IDs are not unique");
          }

          if (validationTargetIds.size !== tasks.length) {
            errors.push(
              "Cosmos Evidence Strategy must produce one task per unique validation target"
            );
          }

          const expectedLabels = [
            "AI compute infrastructure",
            "semiconductors and accelerators",
            "data centers",
            "electricity demand",
            "cooling systems",
            "networking infrastructure",
            "software/model infrastructure"
          ];

          const labels = new Set(
            tasks.map(x => String(x.candidate_label || ""))
          );

          for (const expected of expectedLabels) {
            if (!labels.has(expected)) {
              errors.push(
                `Cosmos Evidence Strategy missing expected target: ${expected}`
              );
            }
          }

          const dataCenters = tasks.find(
            x => String(x.candidate_label || "").toLowerCase() === "data centers"
          );

          if (!dataCenters) {
            errors.push(
              "Cosmos Evidence Strategy did not produce data centers evidence task"
            );
          } else {
            if (!dataCenters.source_strategy.some(
              x => x.source_type === "official_project_or_operator_document" &&
                   Number(x.authority_score) === 100
            )) {
              errors.push(
                "Data centers evidence task missing highest-authority operator/project source"
              );
            }

            for (const expectedType of [
              "identify_components",
              "identify_materials",
              "identify_capacity"
            ]) {
              if (!(dataCenters.downstream_context?.original_target_types || [])
                    .includes(expectedType)) {
                errors.push(
                  `Data centers evidence task lost downstream intent ${expectedType}`
                );
              }
            }
          }

          for (let i = 0; i < queue.length; i += 1) {
            const row = queue[i];

            if (Number(row.execution_rank) !== i + 1) {
              errors.push(
                `Evidence executor queue rank invalid at index ${i}`
              );
            }

            if (!taskIds.has(row.evidence_task_id)) {
              errors.push(
                `Evidence executor queue references unknown task ${row.evidence_task_id}`
              );
            }

            if (row.execution_status !== "not_connected" ||
                row.validation_status !== "not_started") {
              errors.push(
                `Evidence executor queue ${row.evidence_task_id} crossed execution/validation boundary`
              );
            }

            if (!Array.isArray(row.query_intents) ||
                !Array.isArray(row.source_strategy) ||
                !row.sufficiency_contract) {
              errors.push(
                `Evidence executor queue ${row.evidence_task_id} missing executor planning fields`
              );
            }
          }

          const safeguards = payload.safeguards || {};

          if (safeguards.performs_external_search !== false ||
              safeguards.calls_openai_or_external_api !== false ||
              safeguards.collects_evidence !== false ||
              safeguards.validates_candidates !== false ||
              safeguards.invents_evidence !== false ||
              safeguards.writes_to_knowledge_graph !== false ||
              safeguards.promotes_candidates_to_facts !== false ||
              safeguards.source_authority_ranked !== true ||
              safeguards.contradiction_search_required !== true ||
              safeguards.independent_corroboration_planned !== true ||
              safeguards.validation_required_before_execution !== true ||
              safeguards.source_lineage_preserved !== true ||
              safeguards.unlimited_conceptual_continuation_preserved !== true) {
            errors.push("Cosmos Evidence Strategy safeguards invalid");
          }

          if (errors.length) {
            console.error("\nCosmos Evidence Strategy v0.1 preflight errors:");
            for (const error of errors) {
              console.error(`- ${error}`);
            }
            process.exit(1);
          }

          console.log("");
          console.log("Cosmos Evidence Strategy v0.1 isolated test passed.");
          console.log(`Status:              ${payload.status}`);
          console.log(`Validation targets:  ${state.validation_target_count}`);
          console.log(`Evidence tasks:      ${state.evidence_task_count}`);
          console.log(`Executor queue:      ${queue.length}`);
          console.log(`Evidence collected:  ${state.evidence_collected_count}`);
          console.log(`Validation decisions:${state.validation_decision_count}`);
          console.log(`Knowledge admitted:  ${state.knowledge_admission_count}`);
          console.log(
            "Authority ranking, 2-source corroboration planning, contradiction search, lineage and no-execution safeguards passed."
          );
          console.log(
            "Repository files were not modified by the isolated test."
          );
          NODE


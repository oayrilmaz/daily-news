name: Build Cosmos Universal Social Queue

on:
  workflow_dispatch:

  # Primary + recovery schedules.
  # The queue freshness guard below means only the first successful trigger
  # actually rebuilds the queue. The later triggers are automatic fallbacks
  # in case GitHub delays or drops an earlier scheduled event.
  schedule:
    - cron: "47 9 * * *"
    - cron: "37 10 * * *"
    - cron: "27 11 * * *"
    - cron: "7 13 * * *"

  # Independent backup path: rebuild after the main daily PTD workflow
  # completes successfully. This no longer replaces the direct schedules;
  # it is only redundancy.
  workflow_run:
    workflows:
      - "Home AI + Video (PTD Today)"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: ptdtoday-cosmos-universal-social-discovery
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Sync with latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Validate universal discovery syntax
        run: node --check scripts/cosmos_universal_social_discovery.mjs

      - name: Check whether the Cosmos X queue is already fresh
        id: queue_freshness
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");

          let shouldBuild = true;
          let reason = "queue missing or unreadable";

          try {
            const queue = JSON.parse(fs.readFileSync("data/social-queue.json", "utf8"));
            const updatedAt = Date.parse(String(queue.updated_at || ""));
            const items = Array.isArray(queue.items) ? queue.items : [];
            const ageHours = Number.isFinite(updatedAt)
              ? (Date.now() - updatedAt) / 3600000
              : Infinity;

            // A healthy queue created within the last 18 hours does not need
            // another expensive discovery pass. Backup cron triggers simply exit.
            if (items.length >= 3 && items.length <= 5 && ageHours >= 0 && ageHours < 18) {
              shouldBuild = false;
              reason = `fresh queue: ${items.length} items, ${ageHours.toFixed(1)}h old`;
            } else {
              reason = `stale/invalid queue: ${items.length} items, ${Number.isFinite(ageHours) ? ageHours.toFixed(1) : "unknown"}h old`;
            }
          } catch (error) {
            reason = `queue check failed: ${error.message}`;
          }

          console.log(reason);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `should_build=${shouldBuild ? "true" : "false"}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `reason=${reason.replace(/\n/g, " ")}\n`);
          NODE

      - name: Skip message when a fresh queue already exists
        if: ${{ steps.queue_freshness.outputs.should_build != 'true' }}
        run: echo "Fresh Cosmos X queue already exists. Recovery trigger exits without rebuilding."

      - name: Discover fresh multidimensional Cosmos topics + build X queue
        if: ${{ steps.queue_freshness.outputs.should_build == 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COSMOS_DISCOVERY_MODEL: gpt-6-luna
          SITE_ORIGIN: https://ptdtoday.com
          COSMOS_SHARE_API: https://ptdtoday-cosmos.ptdtoday.workers.dev/api/cosmos/share
          SOCIAL_QUEUE_TARGET: "5"
          COSMOS_STRICT_COMPOSITE: "58"
          COSMOS_FALLBACK_COMPOSITE: "45"
          COSMOS_FALLBACK_BUTTERFLY: "45"
          COSMOS_HISTORY_DAYS: "7"
        run: node scripts/cosmos_universal_social_discovery.mjs

      - name: Validate generated universal queue
        if: ${{ steps.queue_freshness.outputs.should_build == 'true' }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const queue = JSON.parse(fs.readFileSync("data/social-queue.json", "utf8"));
          if (!Array.isArray(queue.items)) throw new Error("social-queue.json is missing items[]");
          if (queue.items.length < 3 || queue.items.length > 5) {
            throw new Error(`Expected 3-5 quality-gated X items, got ${queue.items.length}`);
          }

          const domains = new Set();

          for (const item of queue.items) {
            if (!Array.isArray(item.platforms) || item.platforms.length !== 1 || item.platforms[0] !== "x") {
              throw new Error(`Queue item ${item.id} is not X-only`);
            }

            const url = new URL(item.source_url);
            if (url.hostname !== "share.ptdtoday.com" || !url.pathname.startsWith("/s/")) {
              throw new Error(`Queue item ${item.id} does not point to the persistent Cosmos share surface`);
            }

            if (!item.discovery?.share_station_id || !item.discovery?.share_image_url) {
              throw new Error(`Queue item ${item.id} is missing shared-station metadata`);
            }

            if (!item.discovery || !Array.isArray(item.discovery.sources) || item.discovery.sources.length < 2) {
              throw new Error(`Queue item ${item.id} lacks two-source provenance`);
            }

            domains.add(String(item.discovery.domain || "other"));
          }

          if (queue.items.length >= 4 && domains.size < 3) {
            throw new Error(`Universal queue is too concentrated: only ${domains.size} domains`);
          }

          for (const file of [
            "data/cosmos-universal-discovery.json",
            "data/cosmos-universal-discovery-history.json",
            "cosmos-discoveries.html",
            "sitemap-cosmos.xml"
          ]) {
            if (!fs.existsSync(file)) throw new Error(`Missing generated file: ${file}`);
          }

          console.log(`Validated ${queue.items.length} universal X queue item(s) across ${domains.size} domains.`);
          NODE

      - name: Commit universal discoveries + persistent share URLs
        if: ${{ steps.queue_freshness.outputs.should_build == 'true' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add \
            data/social-queue.json \
            data/cosmos-universal-discovery.json \
            data/cosmos-universal-discovery-history.json \
            cosmos-discoveries.html \
            sitemap-cosmos.xml

          if git diff --cached --quiet; then
            echo "No universal Cosmos discovery changes to commit."
            exit 0
          fi

          git commit -m "Build Cosmos universal discovery + search feed"
          git push origin main

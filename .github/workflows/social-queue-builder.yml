name: Build COSMOS X Curiosity Queue + Distinct Visuals

on:
  workflow_dispatch:
  schedule:
    - cron: "47 11 * * *"
    - cron: "7 13 * * *"

permissions:
  contents: write

concurrency:
  group: cosmos-global-qa-v6-1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sync main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - name: Validate updated generator
        run: |
          node --check scripts/cosmos_real_questions_v6_1.mjs
          COSMOS_QA_SELF_TEST=1 node scripts/cosmos_real_questions_v6_1.mjs
          python -m py_compile scripts/cosmos_x_visual_cards.py
      - name: Build source-verified real questions, answers, Grok insights and YouTube links
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          COSMOS_QA_OPENAI_MODEL: ${{ vars.COSMOS_QA_OPENAI_MODEL || 'gpt-4.1-mini' }}
          COSMOS_QA_GROK_MODEL: ${{ vars.COSMOS_QA_GROK_MODEL || 'grok-4.3' }}
          COSMOS_QA_DAILY_COUNT: ${{ vars.COSMOS_QA_DAILY_COUNT || '3' }}
          SITE_ORIGIN: https://ptdtoday.com
        run: node scripts/cosmos_real_questions_v6_1.mjs
      - name: Install social visual dependency
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Generate verified preview cards
        run: python scripts/cosmos_x_visual_cards.py
      - name: Validate Q&A outputs
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('data/social-queue.json','utf8'));
          if(q.policy?.mode!=='cosmos_real_qa_v6_1')throw Error('Not the validated v6.1 real-question queue');
          if(!Array.isArray(q.items)||q.items.length<1||q.items.length>3)throw Error('Invalid Q&A count');
          for(const item of q.items){
            if(item.content_kind!=='discovery'||!item.enabled||!item.discovery?.real_question)throw Error('Not a real sourced question');
            if(item.grok_approved!==false)throw Error('Automated mentions must not be enabled');
            if(!item.discovery?.grok_perspective || !item.discovery?.full_answer || !item.discovery?.youtube?.video_id)throw Error('Missing Grok/answer/video');
            const src=new URL(item.source_url);
            if(src.hostname!=='ptdtoday.com'||!/^\/q\/realqa-[a-z0-9-]+\.html$/.test(src.pathname))throw Error('Invalid COSMOS destination');
            if(!fs.existsSync(src.pathname.slice(1)))throw Error('Q&A page not found');
            const image=new URL(item.discovery.visual_card_url);
            if(image.hostname!=='ptdtoday.com'||!fs.existsSync(image.pathname.slice(1)))throw Error('Image not found');
            const png=fs.readFileSync(image.pathname.slice(1));
            if(png.subarray(0,8).toString('hex')!=='89504e470d0a1a0a')throw Error('Invalid image');
          }
          console.log(`Validated ${q.items.length} REAL questions + sources + Grok + YouTube + PNG + COSMOS pages`)
          NODE
      - name: Commit public Q&A assets and queue
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add data/social-queue.json data/cosmos-real-qa-latest.json data/cosmos-real-qa-history.json q/ sitemap-cosmos.xml assets/cosmos-x-cards/
          if git diff --cached --quiet; then
            echo 'No new verified Q&A content. Existing queue remains unchanged.'
            exit 0
          fi
          git commit -m 'Build source-verified COSMOS Q&A with Grok and YouTube'
          git pull --rebase origin main
          git push origin main

name: Build Cosmos Universal Social Queue

on:
  workflow_dispatch:

  # Primary + recovery schedules. The freshness guard means only the first
  # successful trigger builds; later triggers are automatic fallbacks.
  schedule:
    - cron: "47 9 * * *"
    - cron: "37 10 * * *"
    - cron: "27 11 * * *"
    - cron: "7 13 * * *"

  workflow_run:
    workflows:
      - "Home AI + Video (PTD Today)"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: ptdtoday-cosmos-universal-social-discovery
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Sync with latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Validate Cosmos Question source files
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/cosmos_universal_social_discovery.mjs
          test -f q.html

          # q.html is intentionally self-contained now. Do not require the old
          # assets/cosmos-question.js or assets/cosmos-question.css files.
          node - <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("q.html", "utf8");

          const required = [
            [/<style[\s>]/i, "embedded Cosmos Question CSS"],
            [/id=["']cqPlayer["']/i, "Cosmos Question player"],
            [/id=["']cqShareQuestionInline["']/i, "question sharing controls"],
            [/COSMOS_CHALLENGE_BOOTSTRAP/, "official-question bootstrap support"]
          ];

          for (const [pattern, label] of required) {
            if (!pattern.test(html)) throw new Error(`q.html is missing ${label}`);
          }

          const scripts = [...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1])
            .filter(code => code.trim());

          if (!scripts.length) throw new Error("q.html has no embedded JavaScript");
          for (const code of scripts) new Function(code);

          console.log(`q.html self-contained validation passed (${scripts.length} inline script block(s)).`);
          NODE

      - name: Check whether the Cosmos X queue is already fresh
        id: queue_freshness
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");

          let shouldBuild = true;
          let reason = "queue missing or unreadable";

          try {
            const queue = JSON.parse(fs.readFileSync("data/social-queue.json", "utf8"));
            const updatedAt = Date.parse(String(queue.updated_at || ""));
            const items = Array.isArray(queue.items) ? queue.items : [];
            const ageHours = Number.isFinite(updatedAt)
              ? (Date.now() - updatedAt) / 3600000
              : Infinity;

            const participatory =
              String(queue.schema_version || "") === "2.0" &&
              items.length >= 3 &&
              items.length <= 5 &&
              items.every(item => {
                try {
                  const url = new URL(item.source_url);
                  return url.hostname === "ptdtoday.com" && url.pathname.startsWith("/q/");
                } catch {
                  return false;
                }
              });

            if (participatory && ageHours >= 0 && ageHours < 18) {
              shouldBuild = false;
              reason = `fresh participatory queue: ${items.length} items, ${ageHours.toFixed(1)}h old`;
            } else {
              reason = `stale/legacy queue: schema=${queue.schema_version || "unknown"}, items=${items.length}, age=${Number.isFinite(ageHours) ? ageHours.toFixed(1) : "unknown"}h`;
            }
          } catch (error) {
            reason = `queue check failed: ${error.message}`;
          }

          console.log(reason);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `should_build=${shouldBuild ? "true" : "false"}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `reason=${reason.replace(/\n/g, " ")}\n`);
          NODE

      - name: Skip message when a fresh queue already exists
        if: ${{ steps.queue_freshness.outputs.should_build != 'true' }}
        run: echo "Fresh Cosmos Question queue already exists. Recovery trigger exits without rebuilding."

      - name: Discover fresh developments + build participatory Cosmos Questions
        if: ${{ steps.queue_freshness.outputs.should_build == 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COSMOS_DISCOVERY_MODEL: gpt-6-luna
          SITE_ORIGIN: https://ptdtoday.com
          SOCIAL_QUEUE_TARGET: "5"
          COSMOS_STRICT_COMPOSITE: "60"
          COSMOS_FALLBACK_COMPOSITE: "48"
          COSMOS_FALLBACK_BUTTERFLY: "45"
          COSMOS_HISTORY_DAYS: "7"
        run: node scripts/cosmos_universal_social_discovery.mjs

      - name: Validate generated Cosmos Question queue
        if: ${{ steps.queue_freshness.outputs.should_build == 'true' }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const queue = JSON.parse(fs.readFileSync("data/social-queue.json", "utf8"));
          if (String(queue.schema_version) !== "2.0") {
            throw new Error(`Expected queue schema 2.0, got ${queue.schema_version}`);
          }
          if (!Array.isArray(queue.items) || queue.items.length < 3 || queue.items.length > 5) {
            throw new Error(`Expected 3-5 quality-gated X items, got ${queue.items?.length ?? 0}`);
          }

          const domains = new Set();
          for (const item of queue.items) {
            if (!Array.isArray(item.platforms) || item.platforms.length !== 1 || item.platforms[0] !== "x") {
              throw new Error(`Queue item ${item.id} is not X-only`);
            }

            const url = new URL(item.source_url);
            if (url.hostname !== "ptdtoday.com" || !url.pathname.startsWith("/q/") || !url.pathname.endsWith(".html")) {
              throw new Error(`Queue item ${item.id} does not point to a main-domain Cosmos Question page`);
            }

            const localFile = decodeURIComponent(url.pathname.replace(/^\//, ""));
            if (!fs.existsSync(localFile)) throw new Error(`Missing generated question page: ${localFile}`);

            const challenge = item.discovery?.challenge;
            if (!challenge?.challenge_id || !challenge?.question) {
              throw new Error(`Queue item ${item.id} is missing challenge metadata`);
            }
            if (!Array.isArray(challenge.options) || challenge.options.length !== 5 || challenge.options.map(o => o.key).join("") !== "ABCDE") {
              throw new Error(`Queue item ${item.id} does not have valid A-E options`);
            }
            if (!["fact","supported","opinion","prediction"].includes(challenge.answer_mode)) {
              throw new Error(`Queue item ${item.id} has invalid answer_mode`);
            }
            if (!Array.isArray(item.discovery?.sources) || item.discovery.sources.length < 2) {
              throw new Error(`Queue item ${item.id} lacks two-source provenance`);
            }
            domains.add(String(item.discovery.domain || "other"));
          }

          if (queue.items.length >= 4 && domains.size < 3) {
            throw new Error(`Universal queue is too concentrated: only ${domains.size} domains`);
          }

          for (const file of [
            "data/cosmos-universal-discovery.json",
            "data/cosmos-universal-discovery-history.json",
            "cosmos-discoveries.html",
            "sitemap-cosmos.xml"
          ]) {
            if (!fs.existsSync(file)) throw new Error(`Missing generated file: ${file}`);
          }

          console.log(`Validated ${queue.items.length} participatory Cosmos Question item(s) across ${domains.size} domains.`);
          NODE

      - name: Commit questions + discovery/search surfaces
        if: ${{ steps.queue_freshness.outputs.should_build == 'true' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add \
            data/social-queue.json \
            data/cosmos-universal-discovery.json \
            data/cosmos-universal-discovery-history.json \
            cosmos-discoveries.html \
            sitemap-cosmos.xml \
            q

          if git diff --cached --quiet; then
            echo "No Cosmos Question changes to commit."
            exit 0
          fi

          git commit -m "Build participatory Cosmos Questions + search feed"
          git push origin main

name: Build Cosmos Universal Social Queue

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - "Home AI + Video (PTD Today)"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: ptdtoday-cosmos-universal-social-discovery
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Sync with latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Validate universal discovery syntax
        run: node --check scripts/cosmos_universal_social_discovery.mjs

      - name: Discover fresh multidimensional Cosmos topics + build X queue
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COSMOS_DISCOVERY_MODEL: gpt-6-luna
          SITE_ORIGIN: https://ptdtoday.com
          SOCIAL_QUEUE_TARGET: "5"
          COSMOS_STRICT_COMPOSITE: "58"
          COSMOS_FALLBACK_COMPOSITE: "45"
          COSMOS_FALLBACK_BUTTERFLY: "45"
          COSMOS_HISTORY_DAYS: "7"
        run: node scripts/cosmos_universal_social_discovery.mjs

      - name: Validate generated universal queue
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const queue = JSON.parse(fs.readFileSync("data/social-queue.json", "utf8"));
          if (!Array.isArray(queue.items)) throw new Error("social-queue.json is missing items[]");
          if (queue.items.length < 3 || queue.items.length > 5) {
            throw new Error(`Expected 3-5 quality-gated X items, got ${queue.items.length}`);
          }

          const domains = new Set();

          for (const item of queue.items) {
            if (!Array.isArray(item.platforms) || item.platforms.length !== 1 || item.platforms[0] !== "x") {
              throw new Error(`Queue item ${item.id} is not X-only`);
            }

            const url = new URL(item.source_url);
            if (url.hostname !== "ptdtoday.com" || !url.pathname.startsWith("/explore/")) {
              throw new Error(`Queue item ${item.id} does not point to a permanent PTD Today Explore page`);
            }

            const filename = decodeURIComponent(url.pathname.split("/").pop());
            if (!fs.existsSync(`explore/${filename}`)) {
              throw new Error(`Missing Explore page for ${item.id}`);
            }

            if (!item.discovery || !Array.isArray(item.discovery.sources) || item.discovery.sources.length < 2) {
              throw new Error(`Queue item ${item.id} lacks two-source provenance`);
            }

            domains.add(String(item.discovery.domain || "other"));
          }

          if (queue.items.length >= 4 && domains.size < 3) {
            throw new Error(`Universal queue is too concentrated: only ${domains.size} domains`);
          }

          for (const file of [
            "data/cosmos-universal-discovery.json",
            "data/cosmos-universal-discovery-history.json",
            "sitemap-explore.xml",
            "sitemap.xml"
          ]) {
            if (!fs.existsSync(file)) throw new Error(`Missing generated file: ${file}`);
          }

          console.log(`Validated ${queue.items.length} universal X queue item(s) across ${domains.size} domains.`);
          NODE

      - name: Commit universal discoveries + Explore pages + Google sitemap
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add \
            data/social-queue.json \
            data/cosmos-universal-discovery.json \
            data/cosmos-universal-discovery-history.json \
            explore/ \
            sitemap-explore.xml \
            sitemap.xml

          if git diff --cached --quiet; then
            echo "No universal Cosmos discovery changes to commit."
            exit 0
          fi

          git commit -m "Build Cosmos universal social discovery"
          git push origin main

name: COSMOS v9.5.4 — Business Marketplace Controls
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run validate first, then apply in a separate run'
        required: true
        type: choice
        options: [validate, apply]
        default: validate
permissions:
  contents: write
jobs:
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate or apply guarded Marketplace v9.5.4
        run: python scripts/apply_cosmos_market_v954.py --mode "${{ inputs.mode }}"
      - name: Commit only Marketplace HTML
        if: inputs.mode == 'apply'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- cosmos-market-business.html
          if ! git diff --cached --quiet; then
            git commit -m 'COSMOS v9.5.4 improve Business Marketplace owner controls and location filters'
            git push origin HEAD:main
          fi
